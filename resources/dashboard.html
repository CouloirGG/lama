<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAMA</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#1e1b18', dim: '#151310', bright: '#221f1c', container: '#2c2a26' },
            primary: { DEFAULT: '#e5c371', container: '#c4a456' },
            secondary: { DEFAULT: '#ffb3ae' },
            tertiary: { DEFAULT: '#91cdff' },
            on: { surface: '#e8e1db', 'surface-var': '#d0c5b3' },
            outline: { DEFAULT: '#99907f', variant: '#4d4638' },
            error: { DEFAULT: '#ffb4ab' },
          },
          fontFamily: {
            serif: ['Noto Serif', 'serif'],
            sans: ['Work Sans', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes slideOut { from { transform: translateX(0); } to { transform: translateX(100%); } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; }
    body { background: #151310; color: #e8e1db; font-family: 'Work Sans', 'Segoe UI', system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4d4638; border-radius: 3px; }
    input:focus, select:focus { outline: none; }
    select option { background: #1e1b18; color: #e8e1db; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .grunge-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .tier-bar { transition: width 0.4s ease; }
    .tab-active { border-bottom: 2px solid #e5c371; color: #e5c371; }
    .card-hover { transition: background 0.15s ease, border-color 0.15s ease; }
    .card-hover:hover { background: #2c2a26; border-color: #99907f; }
    .fade-in { animation: fadeIn 0.25s ease both; }
  </style>
</head>
<body>
  <div class="grunge-overlay"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // -----------------------------------------------------------------------
    // Config
    // -----------------------------------------------------------------------
    const API_BASE = window.location.origin;
    const WS_URL = `ws://${window.location.host}/ws`;

    // -----------------------------------------------------------------------
    // Slot icon mapping
    // -----------------------------------------------------------------------
    const SLOT_ICONS = {
      Helm: "head_mounted_device",
      BodyArmour: "shield",
      Gloves: "back_hand",
      Boots: "do_not_step",
      Weapon: "swords",
      Weapon2: "swords",
      Offhand: "security",
      Offhand2: "security",
      Belt: "horizontal_rule",
      Amulet: "diamond",
      Ring: "circle",
      Ring2: "circle",
      Flask: "syringe",
      Flask2: "syringe",
    };

    function slotIcon(slot) {
      return SLOT_ICONS[slot] || "help_outline";
    }

    // -----------------------------------------------------------------------
    // API helper
    // -----------------------------------------------------------------------
    async function api(path, method = "GET", body = null) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      try {
        const res = await fetch(`${API_BASE}${path}`, opts);
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch { data = { raw }; }
        if (!res.ok) {
          let msg = data?.error || `HTTP ${res.status}`;
          // FastAPI 422 returns detail as array of {msg, loc, ...} objects
          if (!data?.error && Array.isArray(data?.detail)) {
            msg = data.detail.map(d => d.msg || JSON.stringify(d)).join("; ");
          } else if (!data?.error && typeof data?.detail === "string") {
            msg = data.detail;
          }
          return { error: msg, ...data };
        }
        return data;
      } catch (e) {
        return { error: e.message };
      }
    }

    // -----------------------------------------------------------------------
    // WebSocket hook
    // -----------------------------------------------------------------------
    function useDashboardSocket(url, onMessage) {
      const wsRef = useRef(null);
      const [connected, setConnected] = useState(false);
      const reconnectRef = useRef(null);
      const disconnectTimerRef = useRef(null);
      const onMessageRef = useRef(onMessage);
      onMessageRef.current = onMessage;

      const connect = useCallback(() => {
        if (wsRef.current?.readyState === WebSocket.OPEN) return;
        const ws = new WebSocket(url);
        wsRef.current = ws;
        ws.onopen = () => {
          if (disconnectTimerRef.current) { clearTimeout(disconnectTimerRef.current); disconnectTimerRef.current = null; }
          setConnected(true);
          if (reconnectRef.current) { clearTimeout(reconnectRef.current); reconnectRef.current = null; }
        };
        ws.onmessage = (evt) => { try { onMessageRef.current(JSON.parse(evt.data)); } catch (e) { console.error("WS parse:", e); } };
        ws.onclose = () => {
          if (!disconnectTimerRef.current) {
            disconnectTimerRef.current = setTimeout(() => { setConnected(false); disconnectTimerRef.current = null; }, 800);
          }
          reconnectRef.current = setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();
      }, [url]);

      useEffect(() => { connect(); return () => { wsRef.current?.close(); if (reconnectRef.current) clearTimeout(reconnectRef.current); if (disconnectTimerRef.current) clearTimeout(disconnectTimerRef.current); }; }, [connect]);
      return { connected };
    }

    // -----------------------------------------------------------------------
    // Icon component
    // -----------------------------------------------------------------------
    function Icon({ name, className = "" }) {
      return <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    }

    // -----------------------------------------------------------------------
    // WhyBadge — inline explanation component
    // -----------------------------------------------------------------------
    const SEV_COLORS = {
      critical: "border-red-500/50 bg-red-500/10 text-red-300",
      warning: "border-yellow-500/50 bg-yellow-500/10 text-yellow-200",
      positive: "border-green-500/50 bg-green-500/10 text-green-300",
      info: "border-outline-variant bg-surface-container text-on-surface-var",
    };
    const SEV_ICONS = { critical: "error", warning: "warning", positive: "check_circle", info: "info" };

    function WhyCard({ explanation, neutral }) {
      const e = explanation;
      const icon = SEV_ICONS[e.severity] || "info";
      const iconColor = { critical: "text-red-400", warning: "text-yellow-400", positive: "text-green-400", info: "text-on-surface-var" }[e.severity] || "";
      const [open, setOpen] = useState(false);
      return (
        <div
          className={`flex gap-2 px-3 py-1.5 rounded cursor-pointer transition-colors ${neutral ? "bg-surface/50 hover:bg-surface-container" : SEV_COLORS[e.severity] || SEV_COLORS.info}`}
          onClick={() => setOpen(!open)}
        >
          <Icon name={icon} className={`text-sm mt-px shrink-0 ${neutral ? iconColor : ""}`} />
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono font-semibold text-on-surface">{e.title}</span>
              {e.adoptionPct > 0 && (
                <span className="text-[10px] font-mono opacity-50">{e.adoptionPct.toFixed(0)}%</span>
              )}
              {!open && <span className="text-[10px] font-mono opacity-40 truncate flex-1">{e.text.slice(0, 60)}...</span>}
            </div>
            {open && <p className="text-xs font-mono leading-relaxed opacity-80 mt-1">{e.text}</p>}
          </div>
          <Icon name={open ? "expand_less" : "expand_more"} className="text-xs opacity-30 shrink-0 mt-0.5" />
        </div>
      );
    }

    function WhySection({ title, explanations, icon, maxItems = 10 }) {
      if (!explanations || explanations.length === 0) return null;
      const [expanded, setExpanded] = useState(false);
      const shown = expanded ? explanations : explanations.slice(0, maxItems);
      return (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-2">
            {icon && <Icon name={icon} className="text-base text-primary-container" />}
            <h3 className="font-serif text-base text-on-surface">{title}</h3>
            <span className="text-xs font-mono text-on-surface-var">({explanations.length})</span>
          </div>
          <div className="flex flex-col gap-2">
            {shown.map((e, i) => <WhyCard key={i} explanation={e} />)}
          </div>
          {explanations.length > maxItems && !expanded && (
            <button onClick={() => setExpanded(true)} className="text-xs font-mono text-primary-container hover:text-primary">
              Show {explanations.length - maxItems} more...
            </button>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Scorecard — big numbers at the top of the Pulse tab
    // -----------------------------------------------------------------------
    const STATUS_BG = {
      critical: "bg-red-500/15 border-red-500/40 text-red-300",
      warning: "bg-yellow-500/15 border-yellow-500/40 text-yellow-200",
      positive: "bg-green-500/15 border-green-500/40 text-green-300",
      info: "bg-surface-container border-outline-variant text-on-surface-var",
    };

    function ScorecardPanel({ scorecard }) {
      const sc = scorecard;
      return (
        <div className="grid grid-cols-3 gap-3">
          {/* EHP */}
          <div className={`flex flex-col items-center p-4 rounded-lg border ${STATUS_BG[sc.ehpStatus] || STATUS_BG.info}`}>
            <span className="text-[10px] font-mono tracking-widest opacity-60 mb-1">EFFECTIVE HP</span>
            <span className="text-2xl font-mono font-bold">{sc.ehp?.toLocaleString() || "?"}</span>
            <span className="text-[10px] font-mono opacity-70 mt-1">{sc.ehpContext}</span>
          </div>
          {/* DPS */}
          <div className={`flex flex-col items-center p-4 rounded-lg border ${STATUS_BG[sc.dpsStatus] || STATUS_BG.info}`}>
            <span className="text-[10px] font-mono tracking-widest opacity-60 mb-1">DPS</span>
            <span className="text-2xl font-mono font-bold">{sc.dpsLabel || "?"}</span>
            <span className="text-[10px] font-mono opacity-70 mt-1">Primary skill</span>
          </div>
          {/* Resists */}
          <div className={`flex flex-col items-center p-4 rounded-lg border ${STATUS_BG[sc.resistStatus] || STATUS_BG.info}`}>
            <span className="text-[10px] font-mono tracking-widest opacity-60 mb-1">RESISTANCES</span>
            <span className="text-lg font-mono font-bold">{sc.resistStatus === "positive" ? "Capped" : "Gaps"}</span>
            <span className="text-[10px] font-mono opacity-70 mt-1 text-center">{sc.resistSummary}</span>
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // InsightGroupCard — collapsible group of related explanations
    // -----------------------------------------------------------------------
    function InsightGroupCard({ group }) {
      const [open, setOpen] = useState(false);
      const g = group;
      const headerColor = {
        critical: "border-l-red-500 bg-red-500/8",
        warning: "border-l-yellow-500 bg-yellow-500/8",
        positive: "border-l-green-500 bg-green-500/8",
        info: "border-l-outline bg-surface-container",
      }[g.severity] || "border-l-outline bg-surface-container";
      const labelColor = {
        critical: "text-red-400", warning: "text-yellow-400",
        positive: "text-green-400", info: "text-on-surface-var"
      }[g.severity] || "";
      return (
        <div className={`rounded-lg border border-outline-variant overflow-hidden`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer border-l-4 ${headerColor}`}
            onClick={() => setOpen(!open)}
          >
            <Icon name={g.icon} className={`text-xl shrink-0 ${labelColor}`} />
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className={`text-sm font-mono font-semibold ${labelColor}`}>{g.label}</span>
                {g.statValue && (
                  <span className="text-xs font-mono text-on-surface px-2 py-0.5 rounded bg-surface-container border border-outline-variant">
                    {g.statValue}
                  </span>
                )}
                <span className="text-[10px] font-mono text-on-surface-var">{g.items?.length || 0} items</span>
              </div>
              <p className="text-xs font-mono text-on-surface-var mt-0.5">{g.summary}</p>
            </div>
            <Icon name={open ? "expand_less" : "expand_more"} className="text-base text-on-surface-var shrink-0" />
          </div>
          {open && g.items?.length > 0 && (
            <div className="flex flex-col gap-0.5 px-3 py-2 bg-surface-dim/50">
              {g.items.map((e, i) => <WhyCard key={i} explanation={e} neutral />)}
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // TopBar
    // -----------------------------------------------------------------------
    const getWindowApi = () => window.pywebview?.api;

    function TopBar({ charData, onSettingsClick }) {
      return (
        <div
          className="pywebview-drag-region fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 py-3 bg-surface-dim/95 backdrop-blur border-b border-outline-variant"
        >
          <div className="font-serif text-xl font-bold tracking-widest text-primary">LAMA</div>
          {charData && (
            <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container border border-outline-variant">
              <span className="text-sm font-mono text-on-surface">{charData.name}</span>
              <span className="text-xs text-on-surface-var">Lv{charData.level}</span>
              <span className="text-xs text-primary-container font-mono">{charData.ascendancy || charData.class}</span>
            </div>
          )}
          <div className="flex items-center gap-1">
            <button onClick={onSettingsClick} className="p-2 rounded-lg hover:bg-surface-container transition-colors text-on-surface-var hover:text-on-surface" title="Settings">
              <Icon name="settings" />
            </button>
            <button onClick={() => getWindowApi()?.minimize()} className="p-2 rounded-lg hover:bg-surface-container transition-colors text-on-surface-var hover:text-on-surface" title="Minimize">
              <Icon name="remove" />
            </button>
            <button onClick={() => getWindowApi()?.toggle_maximize()} className="p-2 rounded-lg hover:bg-surface-container transition-colors text-on-surface-var hover:text-on-surface" title="Maximize">
              <Icon name="crop_square" />
            </button>
            <button onClick={() => getWindowApi()?.quit()} className="p-2 rounded-lg hover:bg-surface-container transition-colors text-on-surface-var hover:text-error" title="Close">
              <Icon name="close" />
            </button>
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // TabNav
    // -----------------------------------------------------------------------
    const TABS = ["PULSE", "GEAR", "MARKET", "GUIDE"];

    function TabNav({ activeTab, onTabChange, hasCharacter, onSettingsClick }) {
      if (!hasCharacter) {
        return (
          <div className="fixed top-[57px] left-0 right-0 z-40 flex items-center justify-center px-5 py-3 bg-surface/90 backdrop-blur border-b border-outline-variant">
            <button
              onClick={onSettingsClick}
              className="text-sm text-primary-container font-mono hover:text-primary transition-colors underline underline-offset-4"
            >
              Open Settings to look up a character
            </button>
          </div>
        );
      }
      return (
        <div className="fixed top-[57px] left-0 right-0 z-40 flex items-center gap-0 px-5 bg-surface/90 backdrop-blur border-b border-outline-variant">
          {TABS.map(tab => (
            <button
              key={tab}
              onClick={() => onTabChange(tab)}
              className={`px-5 py-3 text-xs font-mono tracking-widest transition-colors ${
                activeTab === tab ? "tab-active text-primary" : "text-on-surface-var hover:text-on-surface border-b-2 border-transparent"
              }`}
            >
              {tab}
            </button>
          ))}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Settings Panel
    // -----------------------------------------------------------------------
    function SettingsPanel({ open, onClose, settings, setSettings, status, onLookup, charData }) {
      const [query, setQuery] = useState("");
      const [savedChars, setSavedChars] = useState([]);
      const [leagues, setLeagues] = useState([]);
      const [lookupLoading, setLookupLoading] = useState(false);
      const [lookupError, setLookupError] = useState("");
      const [suggestions, setSuggestions] = useState([]);
      const [scanFps, setScanFps] = useState(settings?.scan_fps || 2);
      const [detectionCooldown, setDetectionCooldown] = useState(settings?.detection_cooldown || 3);
      const [overlayMode, setOverlayMode] = useState(settings?.overlay_mode || "standard");

      useEffect(() => {
        if (!open) return;
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
        api("/api/leagues").then(data => { if (data.leagues) setLeagues(data.leagues); });
      }, [open]);

      useEffect(() => {
        setScanFps(settings?.scan_fps || 2);
        setDetectionCooldown(settings?.detection_cooldown || 3);
        setOverlayMode(settings?.overlay_mode || "standard");
      }, [settings]);

      // Fuzzy filter saved chars as user types
      const filteredSaved = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("poe.ninja")) return [];
        const matches = [];
        for (const grp of savedChars) {
          for (const ch of (grp.characters || [])) {
            const acct = grp.accountName || "";
            if (ch.name.toLowerCase().includes(q) || acct.toLowerCase().includes(q)) {
              matches.push({ account: acct, name: ch.name, class: ch.class, level: ch.level });
            }
          }
        }
        return matches;
      }, [query, savedChars]);

      const handleSmartLookup = async (overrideQuery) => {
        const q = (overrideQuery || query).trim();
        if (!q) return;
        setLookupLoading(true);
        setLookupError("");
        setSuggestions([]);
        const data = await api("/api/character/smart-lookup", "POST", { query: q });
        setLookupLoading(false);
        if (data.suggestions) {
          setSuggestions(data.suggestions);
          setLookupError(data.error || "Multiple matches — pick one:");
        } else if (data.error) {
          setLookupError(data.error);
        } else {
          setLookupError("");
          const acct = data.account || "";
          onLookup(acct, data.name, data);
          api("/api/character/saved").then(d => { if (Array.isArray(d)) setSavedChars(d); });
        }
      };

      const handleSuggestionClick = async (acct, charName) => {
        setQuery(charName);
        setSuggestions([]);
        setLookupLoading(true);
        setLookupError("");
        const result = await onLookup(acct, charName);
        setLookupLoading(false);
        if (result?.error) setLookupError(result.error);
      };

      const handleSavedClick = async (acct, charName) => {
        setQuery(charName);
        setLookupLoading(true);
        setLookupError("");
        setSuggestions([]);
        const result = await onLookup(acct, charName);
        setLookupLoading(false);
        if (result?.error) setLookupError(result.error);
      };

      const handleDeleteSaved = async (acct, charName) => {
        await api("/api/character/delete", "POST", { account: acct, character: charName });
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
      };

      const saveSettings = async () => {
        const newSettings = { ...settings, scan_fps: scanFps, detection_cooldown: detectionCooldown, overlay_mode: overlayMode };
        await api("/api/settings", "POST", newSettings);
        setSettings(newSettings);
      };

      const handleOverlayAction = async (action) => {
        await api(`/api/overlay/${action}`, "POST");
      };

      if (!open) return null;

      return (
        <div className="fixed inset-0 z-[60]" onClick={onClose}>
          <div className="absolute inset-0 bg-black/30" />
          <div
            className="absolute top-0 right-0 bottom-0 w-[380px] max-w-[90vw] bg-surface border-l border-outline-variant overflow-y-auto"
            style={{ animation: "slideIn 0.2s ease" }}
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-5 py-4 border-b border-outline-variant">
              <h2 className="font-serif text-lg text-primary">Settings</h2>
              <button onClick={onClose} className="p-2 rounded-lg hover:bg-surface-container text-on-surface-var hover:text-on-surface transition-colors" title="Close settings">
                <Icon name="close" />
              </button>
            </div>

            {/* Character Lookup */}
            <div className="p-5 border-b border-outline-variant">
              <h3 className="text-xs font-mono tracking-widest text-on-surface-var mb-3">CHARACTER LOOKUP</h3>
              <input
                value={query}
                onChange={e => { setQuery(e.target.value); setSuggestions([]); setLookupError(""); }}
                placeholder="Name, account/character, or poe.ninja URL"
                className="w-full px-3 py-2 mb-2 rounded bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-mono focus:border-primary-container"
                onKeyDown={e => { if (e.key === "Enter") handleSmartLookup(); }}
              />
              {filteredSaved.length > 0 && !lookupLoading && (
                <div className="mb-2 rounded border border-outline-variant bg-surface-container overflow-hidden">
                  {filteredSaved.slice(0, 5).map((m, i) => (
                    <div
                      key={i}
                      onClick={() => handleSavedClick(m.account, m.name)}
                      className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-dim transition-colors border-b border-outline-variant last:border-0"
                    >
                      <span className="text-sm text-on-surface font-mono">{m.name}</span>
                      <span className="text-xs text-on-surface-var">Lv{m.level} {m.class}</span>
                    </div>
                  ))}
                </div>
              )}
              <button
                onClick={() => handleSmartLookup()}
                disabled={lookupLoading || !query.trim()}
                className="w-full py-2 rounded bg-primary-container text-surface-dim text-sm font-mono font-semibold hover:bg-primary transition-colors disabled:opacity-50"
              >
                {lookupLoading ? "Looking up..." : "Look Up"}
              </button>
              {lookupError && <p className="mt-2 text-xs text-error">{lookupError}</p>}
              {suggestions.length > 0 && (
                <div className="mt-2 rounded border border-outline-variant bg-surface-container overflow-hidden">
                  {suggestions.map((s, i) => (
                    <div
                      key={i}
                      onClick={() => handleSuggestionClick(s.account, s.name)}

    // -----------------------------------------------------------------------
    // Build Health Gauge (SVG circular gauge)
    // -----------------------------------------------------------------------
    function BuildHealthGauge({ insights, comparison }) {
      const score = useMemo(() => {
        if (!insights) return 0;
        let s = 100;
        const slots = insights.slotSummary || [];
        if (slots.length > 0) {
          const avgPenalty = slots.reduce((sum, sl) => sum + Math.max(0, (sl.avgTier - 1) * 10), 0) / slots.length;
          s -= avgPenalty;
        }
        const deadCount = slots.reduce((sum, sl) => sum + (sl.deadMods?.length || 0), 0);
        s -= deadCount * 5;
        const popular = (insights.keystoneGaps?.popular || []);
        const missingKs = popular.filter(k => k.percentage > 30 && !k.hasIt).length;
        s -= missingKs * 3;
        return Math.max(0, Math.min(100, Math.round(s)));
      }, [insights]);

      const radius = 80;
      const circumference = 2 * Math.PI * radius;
      const dashOffset = circumference - (score / 100) * circumference;

      return (
        <div className="flex flex-col items-center gap-3">
          <svg width="200" height="200" viewBox="0 0 200 200" className="drop-shadow-lg">
            <circle cx="100" cy="100" r={radius} fill="none" stroke="#2c2a26" strokeWidth="10" />
            <circle
              cx="100" cy="100" r={radius}
              fill="none" stroke="#e5c371" strokeWidth="10"
              strokeLinecap="round"
              strokeDasharray={circumference}
              strokeDashoffset={dashOffset}
              transform="rotate(-90 100 100)"
              className="transition-all duration-1000"
            />
            <text x="100" y="92" textAnchor="middle" className="fill-on-surface font-mono text-4xl font-bold" style={{ fontSize: "42px" }}>{score}</text>
            <text x="100" y="118" textAnchor="middle" className="fill-on-surface-var font-mono" style={{ fontSize: "12px" }}>Build Health</text>
          </svg>
          <StatusBadge score={score} />
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Status Badge
    // -----------------------------------------------------------------------
    function StatusBadge({ score }) {
      let color, label;
      if (score >= 75) { color = "bg-green-400"; label = "ON TRACK"; }
      else if (score >= 40) { color = "bg-yellow-400"; label = "NEEDS WORK"; }
      else { color = "bg-red-400"; label = "CRITICAL"; }

      return (
        <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container border border-outline-variant">
          <span className={`w-2 h-2 rounded-full ${color}`} />
          <span className="text-xs font-mono tracking-widest text-on-surface-var">{label}</span>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // KPI Row
    // -----------------------------------------------------------------------
    function KPIRow({ insights, comparison }) {
      const defType = insights?.archetype?.defenseType || "unknown";
      const mainSkill = insights?.archetype?.mainSkill || "unknown";
      const metaScore = comparison?.overallScore ?? "--";

      const cards = [
        { label: "Survivability", value: defType, icon: "shield" },
        { label: "DPS Source", value: mainSkill, icon: "bolt" },
        { label: "Meta Match", value: typeof metaScore === "number" ? `${metaScore}%` : metaScore, icon: "analytics" },

      return (
        <div className="grid grid-cols-3 gap-3">

            <div key={c.label} className="flex flex-col items-center gap-1 p-4 rounded-lg bg-surface border border-outline-variant">
              <Icon name={c.icon} className="text-primary-container text-xl" />
              <span className="text-lg font-mono font-semibold text-on-surface capitalize">{c.value}</span>

    // -----------------------------------------------------------------------
    // Critical Actions Checklist
    // -----------------------------------------------------------------------
    function CriticalActionsChecklist({ insights }) {
      const actions = useMemo(() => {
        if (!insights) return [];
        const items = [];
        const slots = insights.slotSummary || [];
        for (const sl of slots) {
          for (const dm of (sl.deadMods || [])) {
            items.push({
              type: "dead",
              border: "border-l-secondary",
              icon: "local_fire_department",
              iconColor: "text-secondary",
              title: `Remove "${dm.mod}" on ${sl.slotDisplay}`,
              subtitle: dm.reason,
            });
          }
        }
        const popular = insights.keystoneGaps?.popular || [];
        for (const k of popular) {
          if (k.percentage > 30 && !k.hasIt) {
            items.push({
              type: "keystone",
              border: "border-l-yellow-400",
              icon: "diamond",
              iconColor: "text-yellow-400",
              title: `Consider ${k.name}`,
              subtitle: `${k.percentage}% of players use this`,
            });
          }
        }
        for (const sl of slots) {
          if (sl.avgTier >= 3.5) {
            items.push({
              type: "weak",
              border: "border-l-tertiary",
              icon: "trending_up",
              iconColor: "text-tertiary",
              title: `Upgrade ${sl.slotDisplay}`,
              subtitle: `Average Tier: T${sl.avgTier}`,
            });
          }
        }
        return items;
      }, [insights]);

      if (actions.length === 0) return null;

      return (
        <div className="flex flex-col gap-2">
          <h3 className="font-serif text-base text-on-surface mb-1">Critical Actions</h3>
          {actions.map((a, i) => (
            <div key={i} className={`flex items-start gap-3 p-3 rounded-lg bg-surface border border-outline-variant border-l-4 ${a.border} fade-in`} style={{ animationDelay: `${i * 50}ms` }}>
              <Icon name={a.icon} className={`${a.iconColor} text-xl mt-0.5`} />
              <div className="flex-1 min-w-0">
                <div className="text-sm text-on-surface font-mono">{a.title}</div>
                <div className="text-xs text-on-surface-var mt-0.5">{a.subtitle}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Inline Character Lookup (shown when no character is loaded)
    // -----------------------------------------------------------------------
    function InlineCharacterLookup({ onLookup }) {
      const [query, setQuery] = useState("");
      const [savedChars, setSavedChars] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [suggestions, setSuggestions] = useState([]);

      useEffect(() => {
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
      }, []);

      // Fuzzy filter saved chars as user types
      const filteredSaved = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("poe.ninja")) return [];
        const matches = [];
        for (const grp of savedChars) {
          for (const ch of (grp.characters || [])) {
            const acct = grp.accountName || "";
            if (ch.name.toLowerCase().includes(q) || acct.toLowerCase().includes(q)) {
              matches.push({ account: acct, name: ch.name, class: ch.class, level: ch.level });
            }
          }
        }
        return matches;
      }, [query, savedChars]);

      const handleSmartLookup = async (overrideQuery) => {
        const q = (overrideQuery || query).trim();
        if (!q) return;
        setLoading(true);
        setError("");
        setSuggestions([]);
        const data = await api("/api/character/smart-lookup", "POST", { query: q });
        setLoading(false);
        if (data.suggestions) {
          setSuggestions(data.suggestions);
          setError(data.error || "Multiple matches — pick one:");
        } else if (data.error) {
          setError(data.error);
        } else {
          setError("");
          const acct = data.account || "";
          onLookup(acct, data.name, data);
        }
      };

      const handleSuggestionClick = async (acct, charName) => {
        setQuery(charName);
        setSuggestions([]);
        setLoading(true);
        setError("");
        const result = await onLookup(acct, charName);
        setLoading(false);
        if (result?.error) setError(result.error);
      };

      const handleSavedClick = async (acct, charName) => {
        setQuery(charName);
        setLoading(true);
        setError("");
        setSuggestions([]);
        const result = await onLookup(acct, charName);
        setLoading(false);
        if (result?.error) setError(result.error);
      };

      return (
        <div className="flex flex-col items-center justify-center h-full gap-6 px-8">
          <div className="w-full max-w-sm">
            <h2 className="font-serif text-xl text-on-surface mb-1 text-center">Welcome to LAMA</h2>
            <p className="text-on-surface-var font-mono text-sm mb-6 text-center">
              Look up your character to begin build analysis
            </p>

            <input
              value={query}
              onChange={e => { setQuery(e.target.value); setSuggestions([]); setError(""); }}
              placeholder="Name, account/character, or poe.ninja URL"
              className="w-full px-3 py-2 mb-2 rounded bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-mono focus:border-primary-container focus:outline-none"
              onKeyDown={e => { if (e.key === "Enter") handleSmartLookup(); }}
            />
            {filteredSaved.length > 0 && !loading && (
              <div className="mb-2 rounded border border-outline-variant bg-surface-container overflow-hidden">
                {filteredSaved.slice(0, 5).map((m, i) => (
                  <div
                    key={i}
                    onClick={() => handleSavedClick(m.account, m.name)}
                    className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-dim transition-colors border-b border-outline-variant last:border-0"
                  >
                    <span className="text-sm text-on-surface font-mono">{m.name}</span>
                    <span className="text-xs text-on-surface-var">Lv{m.level} {m.class}</span>
                  </div>
                ))}
              </div>
            )}
            <button
              onClick={() => handleSmartLookup()}
              disabled={loading || !query.trim()}
              className="w-full py-3 rounded-lg bg-primary-container text-surface-dim text-sm font-mono font-semibold hover:bg-primary transition-colors disabled:opacity-50"
            >
              {loading ? "Looking up..." : "Look Up Character"}
            </button>
            {error && <p className="mt-2 text-xs text-error font-mono">{error}</p>}
            {suggestions.length > 0 && (
              <div className="mt-2 rounded border border-outline-variant bg-surface-container overflow-hidden">
                {suggestions.map((s, i) => (
                  <div
                    key={i}
                    onClick={() => handleSuggestionClick(s.account, s.name)}
                    className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-dim transition-colors border-b border-outline-variant last:border-0"
                  >
                    <div>
                      <span className="text-sm text-on-surface font-mono">{s.name}</span>
                      <span className="ml-2 text-xs text-outline font-mono">{s.account}</span>
                    </div>
                    <span className="text-xs text-on-surface-var">Lv{s.level} {s.class}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {savedChars.length > 0 && !query.trim() && (
            <div className="w-full max-w-sm">
              <h3 className="text-xs font-mono tracking-widest text-on-surface-var mb-3">SAVED CHARACTERS</h3>
              <div className="flex flex-col gap-2">
                {savedChars.map((acctGroup, i) => (
                  <div key={i}>
                    <div className="text-xs text-outline mb-1 font-mono">{acctGroup.accountName}</div>
                    {(acctGroup.characters || []).map((ch, j) => (
                      <div
                        key={j}
                        onClick={() => handleSavedClick(acctGroup.accountName, ch.name)}
                        className="flex items-center justify-between px-3 py-2 rounded bg-surface-container border border-outline-variant cursor-pointer hover:border-primary-container transition-colors"
                      >
                        <span className="text-sm text-on-surface font-mono">{ch.name}</span>
                        <span className="text-xs text-on-surface-var">Lv{ch.level} {ch.class}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------

    function PulseTab({ charData, insights, improvement, comparison, whyInsights, onLookup }) {

      const clearGroup = groups.find(g => g.category === "clear_speed");
      const qualityGroup = groups.find(g => g.category === "quality");
      const allStats = whyInsights?.stats || [];

      return (

            />

              label="Primary DPS"
              value={sc?.dpsLabel || "..."}
              context="Main skill damage"
              status={sc?.dpsStatus || "info"}
              icon="bolt"
            />
            <ScoreStatCard
              label="Resistances"
              value={sc?.resistStatus === "positive" ? "Capped" : "Gaps"}

            {/* ── LEFT: Survival Analytics ──────────────── */}

              <div className="bg-surface-container p-5 border-l-2 border-primary-container/40 flex-1">

                  <Icon name="analytics" className="text-base" />
                  Survival Analytics
                </h4>

                {/* Resist bars */}
