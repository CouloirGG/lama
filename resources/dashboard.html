<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAMA</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link href="/vendor/fonts.css" rel="stylesheet" />
  <script src="/vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "surface-bright": "#3a3939",
                    "secondary": "#e9c176",
                    "tertiary": "#b5eaff",
                    "on-tertiary": "#003543",
                    "inverse-on-surface": "#313030",
                    "on-surface-variant": "#d7c3b5",
                    "on-primary": "#4d2700",
                    "surface-container": "#201f1f",
                    "surface-container-highest": "#353534",
                    "background": "#131313",
                    "on-surface": "#e5e2e1",
                    "surface-container-high": "#2a2a2a",
                    "primary": "#ffdcc2",
                    "on-secondary": "#412d00",
                    "surface-container-lowest": "#0e0e0e",
                    "outline": "#9f8d81",
                    "surface-container-low": "#1c1b1b",
                    "surface-dim": "#131313",
                    "surface": "#131313",
                    "error": "#ffb4ab",
                    "error-container": "#93000a",
                    "on-primary-container": "#794614",
                    "primary-container": "#ffb77b",
                    "primary-fixed": "#ffdcc2",
                    "primary-fixed-dim": "#ffb77c",
                    "outline-variant": "#52443a",
                    "on-error": "#690005",
                    "secondary-container": "#5d4200",
                    "on-secondary-container": "#d6b066",
                    "on-primary-fixed": "#2e1500",
                    "tertiary-container": "#89d0ea",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#353534",
                    "surface-tint": "#ffb77c",
                },
                borderRadius: {"DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px"},
                fontFamily: {
                    "headline": ["Noto Serif"],
                    "body": ["Space Grotesk"],
                    "label": ["Space Grotesk"],
                    "serif": ["Noto Serif", "serif"],
                    "sans": ["Space Grotesk", "sans-serif"],
                    "mono": ["Space Grotesk", "monospace"],
                },
            },
        },
    };
  </script>
  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes slideOut { from { transform: translateX(0); } to { transform: translateX(100%); } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; }
    body { background-color: #0e0e0e; color: #e5e2e1; font-family: 'Space Grotesk', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .font-serif, .font-headline { font-family: 'Noto Serif', serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    #root { width: 100%; height: 100%; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #52443a; border-radius: 3px; }
    input:focus, select:focus { outline: none; }
    select option { background: #201f1f; color: #e5e2e1; }
    .tier-bar { transition: width 0.4s ease; }
    .card-hover { transition: background 0.15s ease, border-color 0.15s ease; }
    .card-hover:hover { background: #2a2a2a; border-color: #9f8d81; }
    .fade-in { animation: fadeIn 0.25s ease both; }
    .nav-item-active { color: #ffb77b; border-right: 3px solid #ffb77b; background: rgba(255, 183, 123, 0.08); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="/vendor/react.min.js"></script>
  <script src="/vendor/react-dom.min.js"></script>
  <script src="/vendor/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // -----------------------------------------------------------------------
    // Config
    // -----------------------------------------------------------------------
    const API_BASE = window.location.origin;
    const WS_URL = `ws://${window.location.host}/ws`;

    // -----------------------------------------------------------------------
    // Slot icon mapping
    // -----------------------------------------------------------------------
    const SLOT_ICONS = {
      Helm: "head_mounted_device",
      BodyArmour: "shield",
      Gloves: "back_hand",
      Boots: "do_not_step",
      Weapon: "swords",
      Weapon2: "swords",
      Offhand: "security",
      Offhand2: "security",
      Belt: "horizontal_rule",
      Amulet: "diamond",
      Ring: "circle",
      Ring2: "circle",
      Flask: "syringe",
      Flask2: "syringe",
    };

    function slotIcon(slot) {
      return SLOT_ICONS[slot] || "help_outline";
    }

    // -----------------------------------------------------------------------
    // API helper
    // -----------------------------------------------------------------------
    async function api(path, method = "GET", body = null) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      try {
        const res = await fetch(`${API_BASE}${path}`, opts);
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch { data = { raw }; }
        if (!res.ok) {
          let msg = data?.error || `HTTP ${res.status}`;
          if (!data?.error && Array.isArray(data?.detail)) {
            msg = data.detail.map(d => d.msg || JSON.stringify(d)).join("; ");
          } else if (!data?.error && typeof data?.detail === "string") {
            msg = data.detail;
          }
          return { error: msg, ...data };
        }
        return data;
      } catch (e) {
        return { error: e.message };
      }
    }

    // -----------------------------------------------------------------------
    // WebSocket hook
    // -----------------------------------------------------------------------
    function useDashboardSocket(url, onMessage) {
      const wsRef = useRef(null);
      const [connected, setConnected] = useState(false);
      const reconnectRef = useRef(null);
      const disconnectTimerRef = useRef(null);
      const onMessageRef = useRef(onMessage);
      onMessageRef.current = onMessage;

      const connect = useCallback(() => {
        if (wsRef.current?.readyState === WebSocket.OPEN) return;
        const ws = new WebSocket(url);
        wsRef.current = ws;
        ws.onopen = () => {
          if (disconnectTimerRef.current) { clearTimeout(disconnectTimerRef.current); disconnectTimerRef.current = null; }
          setConnected(true);
          if (reconnectRef.current) { clearTimeout(reconnectRef.current); reconnectRef.current = null; }
        };
        ws.onmessage = (evt) => { try { onMessageRef.current(JSON.parse(evt.data)); } catch (e) { console.error("WS parse:", e); } };
        ws.onclose = () => {
          if (!disconnectTimerRef.current) {
            disconnectTimerRef.current = setTimeout(() => { setConnected(false); disconnectTimerRef.current = null; }, 800);
          }
          reconnectRef.current = setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();
      }, [url]);

      useEffect(() => { connect(); return () => { wsRef.current?.close(); if (reconnectRef.current) clearTimeout(reconnectRef.current); if (disconnectTimerRef.current) clearTimeout(disconnectTimerRef.current); }; }, [connect]);
      return { connected };
    }

    // -----------------------------------------------------------------------
    // Icon component
    // -----------------------------------------------------------------------
    function Icon({ name, className = "" }) {
      return <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    }

    // -----------------------------------------------------------------------
    // WhyBadge — inline explanation component
    // -----------------------------------------------------------------------
    const SEV_COLORS = {
      critical: "border-red-500/50 bg-red-500/10 text-red-300",
      warning: "border-yellow-500/50 bg-yellow-500/10 text-yellow-200",
      positive: "border-green-500/50 bg-green-500/10 text-green-300",
      info: "border-outline-variant bg-surface-container text-on-surface-variant",
    };
    const SEV_ICONS = { critical: "error", warning: "warning", positive: "check_circle", info: "info" };

    function WhyCard({ explanation, neutral }) {
      const e = explanation;
      const icon = SEV_ICONS[e.severity] || "info";
      const iconColor = { critical: "text-red-400", warning: "text-yellow-400", positive: "text-green-400", info: "text-on-surface-variant" }[e.severity] || "";
      const [open, setOpen] = useState(false);
      return (
        <div
          className={`flex gap-2 px-3 py-1.5 cursor-pointer transition-colors ${neutral ? "bg-surface-container-lowest hover:bg-surface-container" : SEV_COLORS[e.severity] || SEV_COLORS.info}`}
          onClick={() => setOpen(!open)}
        >
          <Icon name={icon} className={`text-sm mt-px shrink-0 ${neutral ? iconColor : ""}`} />
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono font-semibold text-on-surface">{e.title}</span>
              {e.adoptionPct > 0 && (
                <span className="text-xs font-mono opacity-70">{e.adoptionPct.toFixed(0)}%</span>
              )}
              {!open && <span className="text-xs font-mono opacity-60 truncate flex-1">{e.text.slice(0, 60)}...</span>}
            </div>
            {open && <p className="text-xs font-mono leading-relaxed opacity-80 mt-1">{e.text}</p>}
          </div>
          <Icon name={open ? "expand_less" : "expand_more"} className="text-xs opacity-30 shrink-0 mt-0.5" />
        </div>
      );
    }

    function WhySection({ title, explanations, icon, maxItems = 10 }) {
      if (!explanations || explanations.length === 0) return null;
      const [expanded, setExpanded] = useState(false);
      const shown = expanded ? explanations : explanations.slice(0, maxItems);
      return (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-2">
            {icon && <Icon name={icon} className="text-base text-primary-container" />}
            <h3 className="font-serif text-base text-on-surface">{title}</h3>
            <span className="text-xs font-mono text-on-surface-variant">({explanations.length})</span>
          </div>
          <div className="flex flex-col gap-2">
            {shown.map((e, i) => <WhyCard key={i} explanation={e} />)}
          </div>
          {explanations.length > maxItems && !expanded && (
            <button onClick={() => setExpanded(true)} className="text-xs font-mono text-primary-container hover:text-primary">
              Show {explanations.length - maxItems} more...
            </button>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Scorecard severity backgrounds
    // -----------------------------------------------------------------------
    const STATUS_BG = {
      critical: "bg-red-500/15 border-red-500/40 text-red-300",
      warning: "bg-yellow-500/15 border-yellow-500/40 text-yellow-200",
      positive: "bg-green-500/15 border-green-500/40 text-green-300",
      info: "bg-surface-container border-outline-variant text-on-surface-variant",
    };

    function ScorecardPanel({ scorecard }) {
      const sc = scorecard;
      return (
        <div className="grid grid-cols-3 gap-3">
          <div className={`flex flex-col items-center p-4 border ${STATUS_BG[sc.ehpStatus] || STATUS_BG.info}`}>
            <span className="text-xs font-mono tracking-widest opacity-60 mb-1">EFFECTIVE HP</span>
            <span className="text-2xl font-mono font-bold">{sc.ehp?.toLocaleString() || "?"}</span>
            <span className="text-xs font-mono opacity-70 mt-1">{sc.ehpContext}</span>
          </div>
          <div className={`flex flex-col items-center p-4 border ${STATUS_BG[sc.dpsStatus] || STATUS_BG.info}`}>
            <span className="text-xs font-mono tracking-widest opacity-60 mb-1">DPS</span>
            <span className="text-2xl font-mono font-bold">{sc.dpsLabel || "?"}</span>
            <span className="text-xs font-mono opacity-70 mt-1">Primary skill</span>
          </div>
          <div className={`flex flex-col items-center p-4 border ${STATUS_BG[sc.resistStatus] || STATUS_BG.info}`}>
            <span className="text-xs font-mono tracking-widest opacity-60 mb-1">RESISTANCES</span>
            <span className="text-lg font-mono font-bold">{sc.resistStatus === "positive" ? "Capped" : "Gaps"}</span>
            <span className="text-xs font-mono opacity-70 mt-1 text-center">{sc.resistSummary}</span>
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // InsightGroupCard — collapsible group of related explanations
    // -----------------------------------------------------------------------
    function InsightGroupCard({ group }) {
      const [open, setOpen] = useState(false);
      const g = group;
      const headerColor = {
        critical: "border-l-red-500 bg-red-500/8",
        warning: "border-l-yellow-500 bg-yellow-500/8",
        positive: "border-l-green-500 bg-green-500/8",
        info: "border-l-outline bg-surface-container",
      }[g.severity] || "border-l-outline bg-surface-container";
      const labelColor = {
        critical: "text-red-400", warning: "text-yellow-400",
        positive: "text-green-400", info: "text-on-surface-variant"
      }[g.severity] || "";
      return (
        <div className="border border-outline-variant overflow-hidden">
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer border-l-4 ${headerColor}`}
            onClick={() => setOpen(!open)}
          >
            <Icon name={g.icon} className={`text-xl shrink-0 ${labelColor}`} />
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className={`text-sm font-mono font-semibold ${labelColor}`}>{g.label}</span>
                {g.statValue && (
                  <span className="text-xs font-mono text-on-surface px-2 py-0.5 bg-surface-container border border-outline-variant">
                    {g.statValue}
                  </span>
                )}
                <span className="text-xs font-mono text-on-surface-variant">{g.items?.length || 0} items</span>
              </div>
              <p className="text-xs font-mono text-on-surface-variant mt-0.5">{g.summary}</p>
            </div>
            <Icon name={open ? "expand_less" : "expand_more"} className="text-base text-on-surface-variant shrink-0" />
          </div>
          {open && g.items?.length > 0 && (
            <div className="flex flex-col gap-0.5 px-3 py-2 bg-surface-container-lowest">
              {g.items.map((e, i) => <WhyCard key={i} explanation={e} neutral />)}
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Window API
    // -----------------------------------------------------------------------
    const getWindowApi = () => window.pywebview?.api;

    // -----------------------------------------------------------------------
    // NavBar (replaces TopBar) — fixed top, full width
    // -----------------------------------------------------------------------
    function NavBar({ onSettingsClick }) {
      return (
        <div
          className="pywebview-drag-region fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 bg-surface-container-lowest border-b border-outline-variant"
          style={{ height: "64px" }}
        >
          <div className="font-serif text-xl font-bold tracking-[0.15em] text-primary-container">LAMA</div>
          <div className="flex items-center gap-1">
            <button onClick={onSettingsClick} className="p-2 hover:bg-surface-container transition-colors text-on-surface-variant hover:text-on-surface" title="Settings">
              <Icon name="settings" />
            </button>
            <button onClick={() => getWindowApi()?.minimize()} className="p-2 hover:bg-surface-container transition-colors text-on-surface-variant hover:text-on-surface" title="Minimize">
              <Icon name="remove" />
            </button>
            <button onClick={() => getWindowApi()?.toggle_maximize()} className="p-2 hover:bg-surface-container transition-colors text-on-surface-variant hover:text-on-surface" title="Maximize">
              <Icon name="crop_square" />
            </button>
            <button onClick={() => getWindowApi()?.quit()} className="p-2 hover:bg-surface-container transition-colors text-on-surface-variant hover:text-error" title="Close">
              <Icon name="close" />
            </button>
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Sidebar (replaces TabNav) — fixed left, below navbar
    // -----------------------------------------------------------------------
    const NAV_ITEMS = [
      { id: "BUILD", label: "OVERVIEW", icon: "dashboard" },
      { id: "GEAR", label: "GEAR", icon: "inventory_2" },
      { id: "MARKET", label: "MARKET", icon: "storefront" },
      { id: "GUIDE", label: "GUIDE", icon: "menu_book" },
    ];

    function Sidebar({ activeTab, onTabChange, charData, hasCharacter, onSettingsClick }) {
      return (
        <div
          className="fixed left-0 top-[64px] bottom-0 z-40 flex flex-col bg-surface-container-low border-r border-outline-variant"
          style={{ width: "256px" }}
        >
          {/* Character info */}
          {charData && (
            <div className="px-5 py-4 border-b border-outline-variant">
              <div className="text-sm font-sans font-semibold text-on-surface">{charData.name}</div>
              <div className="text-xs text-on-surface-variant mt-0.5">
                {charData.ascendancy || charData.class} — Lv{charData.level}
              </div>
            </div>
          )}

          {/* Navigation */}
          <nav className="flex-1 flex flex-col py-2">
            {!hasCharacter ? (
              <button
                onClick={onSettingsClick}
                className="mx-3 my-1 px-4 py-3 text-left text-sm text-primary-container font-sans hover:bg-surface-container transition-colors"
              >
                Open Settings to look up a character
              </button>
            ) : (
              NAV_ITEMS.map(item => (
                <button
                  key={item.id}
                  onClick={() => onTabChange(item.id)}
                  className={`flex items-center gap-3 mx-2 px-4 py-3 text-left transition-colors ${
                    activeTab === item.id
                      ? "nav-item-active"
                      : "text-on-surface-variant hover:text-on-surface hover:bg-surface-container"
                  }`}
                >
                  <Icon name={item.icon} className="text-xl" />
                  <span className="text-xs font-sans tracking-[0.15em] font-semibold">{item.label}</span>
                </button>
              ))
            )}
          </nav>

          {/* Export button */}
          {hasCharacter && (
            <div className="px-4 py-4 border-t border-outline-variant">
              <button className="w-full py-2.5 text-xs font-sans font-bold tracking-widest uppercase text-on-primary bg-gradient-to-r from-primary-container to-secondary hover:opacity-90 transition-opacity">
                <Icon name="download" className="text-sm mr-2 align-middle" />
                EXPORT
              </button>
            </div>
          )}

          {/* Connection status */}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Settings Panel
    // -----------------------------------------------------------------------
    function SettingsPanel({ open, onClose, settings, setSettings, status, onLookup, charData }) {
      const [query, setQuery] = useState("");
      const [savedChars, setSavedChars] = useState([]);
      const [leagues, setLeagues] = useState([]);
      const [lookupLoading, setLookupLoading] = useState(false);
      const [lookupError, setLookupError] = useState("");
      const [suggestions, setSuggestions] = useState([]);
      const [scanFps, setScanFps] = useState(settings?.scan_fps || 2);
      const [detectionCooldown, setDetectionCooldown] = useState(settings?.detection_cooldown || 3);
      const [overlayMode, setOverlayMode] = useState(settings?.overlay_mode || "standard");

      useEffect(() => {
        if (!open) return;
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
        api("/api/leagues").then(data => { if (data.leagues) setLeagues(data.leagues); });
      }, [open]);

      useEffect(() => {
        setScanFps(settings?.scan_fps || 2);
        setDetectionCooldown(settings?.detection_cooldown || 3);
        setOverlayMode(settings?.overlay_mode || "standard");
      }, [settings]);

      const filteredSaved = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("poe.ninja")) return [];
        const matches = [];
        for (const grp of savedChars) {
          for (const ch of (grp.characters || [])) {
            const acct = grp.accountName || "";
            if (ch.name.toLowerCase().includes(q) || acct.toLowerCase().includes(q)) {
              matches.push({ account: acct, name: ch.name, class: ch.class, level: ch.level });
            }
          }
        }
        return matches;
      }, [query, savedChars]);

      const handleSmartLookup = async (overrideQuery) => {
        const q = (overrideQuery || query).trim();
        if (!q) return;
        setLookupLoading(true);
        setLookupError("");
        setSuggestions([]);
        const data = await api("/api/character/smart-lookup", "POST", { query: q });
        setLookupLoading(false);
        if (data.suggestions) {
          setSuggestions(data.suggestions);
          setLookupError(data.error || "Multiple matches — pick one:");
        } else if (data.error) {
          setLookupError(data.error);
        } else {
          setLookupError("");
          const acct = data.account || "";
          onLookup(acct, data.name, data);
          api("/api/character/saved").then(d => { if (Array.isArray(d)) setSavedChars(d); });
        }
      };

      const handleSuggestionClick = async (acct, charName) => {
        setQuery(charName);
        setSuggestions([]);
        setLookupLoading(true);
        setLookupError("");
        const result = await onLookup(acct, charName);
        setLookupLoading(false);
        if (result?.error) setLookupError(result.error);
      };

      const handleSavedClick = async (acct, charName) => {
        setQuery(charName);
        setLookupLoading(true);
        setLookupError("");
        setSuggestions([]);
        const result = await onLookup(acct, charName);
        setLookupLoading(false);
        if (result?.error) setLookupError(result.error);
      };

      const handleDeleteSaved = async (acct, charName) => {
        await api("/api/character/delete", "POST", { account: acct, character: charName });
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
      };

      const saveSettings = async () => {
        const newSettings = { ...settings, scan_fps: scanFps, detection_cooldown: detectionCooldown, overlay_mode: overlayMode };
        await api("/api/settings", "POST", newSettings);
        setSettings(newSettings);
      };

      const handleOverlayAction = async (action) => {
        await api(`/api/overlay/${action}`, "POST");
      };

      if (!open) return null;

      return (
        <div className="fixed inset-0 z-[60]" onClick={onClose}>
          <div className="absolute inset-0 bg-black/30" />
          <div
            className="absolute top-0 right-0 bottom-0 w-[380px] max-w-[90vw] bg-surface-container-low border-l border-outline-variant overflow-y-auto"
            style={{ animation: "slideIn 0.2s ease" }}
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-5 py-4 border-b border-outline-variant">
              <h2 className="font-serif text-lg text-primary-container">Settings</h2>
              <button onClick={onClose} className="p-2 hover:bg-surface-container text-on-surface-variant hover:text-on-surface transition-colors" title="Close settings">
                <Icon name="close" />
              </button>
            </div>

            {/* Character Lookup */}
            <div className="p-5 border-b border-outline-variant">
              <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">CHARACTER LOOKUP</h3>
              <input
                value={query}
                onChange={e => { setQuery(e.target.value); setSuggestions([]); setLookupError(""); }}
                placeholder="Name, account/character, or poe.ninja URL"
                className="w-full px-3 py-2 mb-2 bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-sans focus:border-primary-container"
                onKeyDown={e => { if (e.key === "Enter") handleSmartLookup(); }}
              />
              {filteredSaved.length > 0 && !lookupLoading && (
                <div className="mb-2 border border-outline-variant bg-surface-container overflow-hidden">
                  {filteredSaved.slice(0, 5).map((m, i) => (
                    <div
                      key={i}
                      onClick={() => handleSavedClick(m.account, m.name)}

    // -----------------------------------------------------------------------
    // Build Health Gauge (SVG circular gauge)
    // -----------------------------------------------------------------------
    function BuildHealthGauge({ insights, comparison }) {
      const score = useMemo(() => {
        if (!insights) return 0;
        let s = 100;
        const slots = insights.slotSummary || [];
        if (slots.length > 0) {
          const avgPenalty = slots.reduce((sum, sl) => sum + Math.max(0, (sl.avgTier - 1) * 10), 0) / slots.length;
          s -= avgPenalty;
        }
        const deadCount = slots.reduce((sum, sl) => sum + (sl.deadMods?.length || 0), 0);
        s -= deadCount * 5;
        const popular = (insights.keystoneGaps?.popular || []);
        const missingKs = popular.filter(k => k.percentage > 30 && !k.hasIt).length;
        s -= missingKs * 3;
        return Math.max(0, Math.min(100, Math.round(s)));
      }, [insights]);

      const radius = 80;
      const circumference = 2 * Math.PI * radius;
      const dashOffset = circumference - (score / 100) * circumference;

      return (
        <div className="flex flex-col items-center gap-3">
          <svg width="200" height="200" viewBox="0 0 200 200" className="drop-shadow-lg">
            <circle cx="100" cy="100" r={radius} fill="none" stroke="#353534" strokeWidth="10" />
            <circle
              cx="100" cy="100" r={radius}
              fill="none" stroke="#ffb77b" strokeWidth="10"
              strokeLinecap="round"
              strokeDasharray={circumference}
              strokeDashoffset={dashOffset}
              transform="rotate(-90 100 100)"
              className="transition-all duration-1000"
            />
            <text x="100" y="92" textAnchor="middle" className="fill-on-surface font-sans text-4xl font-bold" style={{ fontSize: "42px" }}>{score}</text>
            <text x="100" y="118" textAnchor="middle" className="fill-on-surface-variant font-sans" style={{ fontSize: "12px" }}>Build Health</text>
          </svg>
          <StatusBadge score={score} />
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Status Badge
    // -----------------------------------------------------------------------
    function StatusBadge({ score }) {
      let color, label;
      if (score >= 75) { color = "bg-green-400"; label = "ON TRACK"; }
      else if (score >= 40) { color = "bg-yellow-400"; label = "NEEDS WORK"; }
      else { color = "bg-red-400"; label = "CRITICAL"; }

      return (
        <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container border border-outline-variant">
          <span className={`w-2 h-2 rounded-full ${color}`} />
          <span className="text-xs font-sans tracking-widest text-on-surface-variant">{label}</span>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    function KPIRow({ insights, comparison }) {
      const defType = insights?.archetype?.defenseType || "unknown";
      const mainSkill = insights?.archetype?.mainSkill || "unknown";
      const metaScore = comparison?.overallScore ?? "--";

      const cards = [

      return (

    // -----------------------------------------------------------------------
    // Critical Actions Checklist
    // -----------------------------------------------------------------------
    function CriticalActionsChecklist({ insights }) {
      const actions = useMemo(() => {
        if (!insights) return [];
        const items = [];
        const slots = insights.slotSummary || [];
        for (const sl of slots) {
          for (const dm of (sl.deadMods || [])) {
            items.push({
              type: "dead",
              border: "border-l-secondary",
              icon: "local_fire_department",
              iconColor: "text-secondary",
              title: `Remove "${dm.mod}" on ${sl.slotDisplay}`,
              subtitle: dm.reason,
            });
          }
        }
        const popular = insights.keystoneGaps?.popular || [];
        for (const k of popular) {
          if (k.percentage > 30 && !k.hasIt) {
            items.push({
              type: "keystone",
              border: "border-l-yellow-400",
              icon: "diamond",
              iconColor: "text-yellow-400",
              title: `Consider ${k.name}`,
              subtitle: `${k.percentage}% of players use this`,
            });
          }
        }
        for (const sl of slots) {
          if (sl.avgTier >= 3.5) {
            items.push({
              type: "weak",
              border: "border-l-tertiary",
              icon: "trending_up",
              iconColor: "text-tertiary",
              title: `Upgrade ${sl.slotDisplay}`,
              subtitle: `Average Tier: T${sl.avgTier}`,
            });
          }
        }
        return items;
      }, [insights]);

      if (actions.length === 0) return null;

      return (
        <div className="flex flex-col gap-2">
          <h3 className="font-serif text-base text-on-surface mb-1">Critical Actions</h3>
          {actions.map((a, i) => (
            <div key={i} className={`flex items-start gap-3 p-3 bg-surface-container-low border border-outline-variant border-l-4 ${a.border} fade-in`} style={{ animationDelay: `${i * 50}ms` }}>
              <Icon name={a.icon} className={`${a.iconColor} text-xl mt-0.5`} />
              <div className="flex-1 min-w-0">
                <div className="text-sm text-on-surface font-sans">{a.title}</div>
                <div className="text-xs text-on-surface-variant mt-0.5">{a.subtitle}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Inline Character Lookup (shown when no character is loaded)
    // -----------------------------------------------------------------------
    function InlineCharacterLookup({ onLookup }) {
      const [query, setQuery] = useState("");
      const [savedChars, setSavedChars] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [suggestions, setSuggestions] = useState([]);

      useEffect(() => {
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
      }, []);

      const filteredSaved = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("poe.ninja")) return [];
        const matches = [];
        for (const grp of savedChars) {
          for (const ch of (grp.characters || [])) {
            const acct = grp.accountName || "";
            if (ch.name.toLowerCase().includes(q) || acct.toLowerCase().includes(q)) {
              matches.push({ account: acct, name: ch.name, class: ch.class, level: ch.level });
            }
          }
        }
        return matches;
      }, [query, savedChars]);

      const handleSmartLookup = async (overrideQuery) => {
        const q = (overrideQuery || query).trim();
        if (!q) return;
        setLoading(true);
        setError("");
        setSuggestions([]);
        const data = await api("/api/character/smart-lookup", "POST", { query: q });
        setLoading(false);
        if (data.suggestions) {
          setSuggestions(data.suggestions);
          setError(data.error || "Multiple matches — pick one:");
        } else if (data.error) {
          setError(data.error);
        } else {
          setError("");
          const acct = data.account || "";
          onLookup(acct, data.name, data);
        }
      };

      const handleSuggestionClick = async (acct, charName) => {
        setQuery(charName);
        setSuggestions([]);
        setLoading(true);
        setError("");
        const result = await onLookup(acct, charName);
        setLoading(false);
        if (result?.error) setError(result.error);
      };

      const handleSavedClick = async (acct, charName) => {
        setQuery(charName);
        setLoading(true);
        setError("");
        setSuggestions([]);
        const result = await onLookup(acct, charName);
        setLoading(false);
        if (result?.error) setError(result.error);
      };

      return (
        <div className="flex flex-col items-center justify-center h-full gap-6 px-8">
          <div className="w-full max-w-sm">
            <h2 className="font-serif text-xl text-on-surface mb-1 text-center">Welcome to LAMA</h2>
            <p className="text-on-surface-variant font-sans text-sm mb-6 text-center">
              Look up your character to begin build analysis
            </p>

            <input
              value={query}
              onChange={e => { setQuery(e.target.value); setSuggestions([]); setError(""); }}
              placeholder="Name, account/character, or poe.ninja URL"
              className="w-full px-3 py-2 mb-2 bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-sans focus:border-primary-container focus:outline-none"
              onKeyDown={e => { if (e.key === "Enter") handleSmartLookup(); }}
            />
            {filteredSaved.length > 0 && !loading && (
              <div className="mb-2 border border-outline-variant bg-surface-container overflow-hidden">
                {filteredSaved.slice(0, 5).map((m, i) => (
                  <div
                    key={i}
                    onClick={() => handleSavedClick(m.account, m.name)}
                    className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border-b border-outline-variant last:border-0"
                  >
                    <span className="text-sm text-on-surface font-sans">{m.name}</span>
                    <span className="text-xs text-on-surface-variant">Lv{m.level} {m.class}</span>
                  </div>
                ))}
              </div>
            )}
            <button
              onClick={() => handleSmartLookup()}
              disabled={loading || !query.trim()}
              className="w-full py-3 bg-primary-container text-on-primary text-sm font-sans font-semibold hover:bg-primary transition-colors disabled:opacity-70"
            >
              {loading ? "Looking up..." : "Look Up Character"}
            </button>
            {error && <p className="mt-2 text-xs text-error font-sans">{error}</p>}
            {suggestions.length > 0 && (
              <div className="mt-2 border border-outline-variant bg-surface-container overflow-hidden">
                {suggestions.map((s, i) => (
                  <div
                    key={i}
                    onClick={() => handleSuggestionClick(s.account, s.name)}
                    className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border-b border-outline-variant last:border-0"
                  >
                    <div>
                      <span className="text-sm text-on-surface font-sans">{s.name}</span>
                      <span className="ml-2 text-xs text-outline font-sans">{s.account}</span>
                    </div>
                    <span className="text-xs text-on-surface-variant">Lv{s.level} {s.class}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {savedChars.length > 0 && !query.trim() && (
            <div className="w-full max-w-sm">
              <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">SAVED CHARACTERS</h3>
              <div className="flex flex-col gap-2">
                {savedChars.map((acctGroup, i) => (
                  <div key={i}>
                    <div className="text-xs text-outline mb-1 font-sans">{acctGroup.accountName}</div>
                    {(acctGroup.characters || []).map((ch, j) => (
                      <div
                        key={j}
                        onClick={() => handleSavedClick(acctGroup.accountName, ch.name)}
                        className="flex items-center justify-between px-3 py-2 bg-surface-container border border-outline-variant cursor-pointer hover:border-primary-container transition-colors"
                      >
                        <span className="text-sm text-on-surface font-sans">{ch.name}</span>
                        <span className="text-xs text-on-surface-variant">Lv{ch.level} {ch.class}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // PULSE Tab (Overview)
    // -----------------------------------------------------------------------
    function PulseTab({ charData, insights, improvement, comparison, whyInsights, onLookup }) {
      if (!charData) {
        return <InlineCharacterLookup onLookup={onLookup} />;
      }

      if (!insights && !whyInsights) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-3">
            <div className="w-8 h-8 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
            <span className="text-sm text-on-surface-variant font-sans">Analyzing build...</span>
          </div>
        );
      }

      const sc = whyInsights?.scorecard;
      const groups = whyInsights?.insightGroups || [];
      const survivalGroup = groups.find(g => g.category === "survival");
      const damageGroup = groups.find(g => g.category === "damage");
      const clearGroup = groups.find(g => g.category === "clear_speed");
      const qualityGroup = groups.find(g => g.category === "quality");
      const allStats = whyInsights?.stats || [];

      const resists = allStats.filter(s => s.title.includes("Resistance"));
      const nonResistStats = allStats.filter(s => !s.title.includes("Resistance"));

      // Projection state
      const [projections, setProjections] = useState({});
      const toggleProjection = useCallback((name) => {
        setProjections(prev => ({ ...prev, [name]: !prev[name] }));
      }, []);

      const projectedDeltas = useMemo(() => {
        const deltas = { dps: 0, ehp: 0 };
        const synergyMap = whyInsights?.synergyMap || [];
        for (const cat of synergyMap) {
          for (const item of cat.missing) {
            if (projections[item.name] && item.estimatedValue > 0) {
              if (cat.category === "dps") deltas.dps += item.estimatedValue;
              if (cat.category === "survival") deltas.ehp += item.estimatedValue;
            }
          }
        }
        for (const g of groups) {
          for (const item of g.items) {
            if (projections[item.title?.replace("Allocate ", "").replace("Missing: ", "")] && item.estimatedValue > 0) {
              // Avoid double-counting
            }
          }
        }
        return deltas;
      }, [projections, whyInsights, groups]);

      const projectedEhp = (sc?.ehp || 0) + projectedDeltas.ehp;
      const projectedDps = (sc?.dps || 0) + projectedDeltas.dps;
      const hasProjections = projectedDeltas.dps > 0 || projectedDeltas.ehp > 0;

      // Gear state
      const [selectedGearSlot, setSelectedGearSlot] = useState(null);
      const [leftPanel, setLeftPanel] = useState("survival");
      const gearSlots = insights?.slotSummary || [];

      // Passive tree analysis
      const [treeAnalysis, setTreeAnalysis] = useState(null);
      const [treeLoading, setTreeLoading] = useState(false);
      // useEffect disabled — tree analysis was causing blank screens
      // TODO: re-enable after fixing root cause

      // Build comparison state
      const [compareQuery, setCompareQuery] = useState("");
      const [compareResult, setCompareResult] = useState(null);
      const [compareLoading, setCompareLoading] = useState(false);
      const [compareError, setCompareError] = useState("");

      const handleCompare = async () => {
        if (!compareQuery.trim() || !account || !character) return;
        setCompareLoading(true);
        setCompareError("");
        const data = await api("/api/character/compare", "POST", {
          player_account: account,
          player_character: character,
          target_query: compareQuery.trim(),
        });
        setCompareLoading(false);
        if (data.error) setCompareError(data.error);
        else setCompareResult(data);
      };

      return (
        <div className="flex flex-col gap-0 p-6">
          {/* Stat Cards Row */}
          <div className="grid grid-cols-3 gap-4 mb-6">
            <StitchStatCard
              label="Effective HP"
              value={sc ? sc.ehp?.toLocaleString() : "..."}
              context={sc?.ehpContext || ""}
              status={sc?.ehpStatus || "info"}
              icon="shield"
              projected={hasProjections && projectedDeltas.ehp > 0 ? projectedEhp : null}
              projectedDelta={projectedDeltas.ehp}
            />
            <StitchStatCard
              label="Primary DPS"
              value={sc?.dpsLabel || "..."}
              context="Main skill damage"
              status={sc?.dpsStatus || "info"}
              icon="bolt"
              projected={hasProjections && projectedDeltas.dps > 0 ? projectedDps : null}
              projectedDelta={projectedDeltas.dps}
            />
            <StitchStatCard
              label="Resistances"
              value={sc?.resistStatus === "positive" ? "Capped" : "Gaps"}
              context={sc?.resistSummary || ""}
              status={sc?.resistStatus || "info"}
              icon="verified"
            />
          </div>

          {/* 3-Column Layout */}
          <div className="grid grid-cols-12 gap-6" style={{ minHeight: "calc(100vh - 300px)" }}>

            {/* LEFT: Defense / Gear Panel */}
            <div className="col-span-3 flex flex-col gap-0">
              {/* Panel toggle */}
              <div className="flex border-b border-outline-variant/20">
                <button
                  onClick={() => { setLeftPanel("survival"); setSelectedGearSlot(null); }}
                  className={`flex-1 py-1.5 text-[12px] font-sans uppercase tracking-widest transition-all ${
                    leftPanel === "survival" ? "text-primary-container border-b-2 border-primary-container" : "text-on-surface-variant hover:text-on-surface"
                  }`}
                >
                  <Icon name="shield" className="text-xs mr-1 align-middle" />Survival
                </button>
                <button
                  onClick={() => setLeftPanel("gear")}
                  className={`flex-1 py-1.5 text-[12px] font-sans uppercase tracking-widest transition-all ${
                    leftPanel === "gear" ? "text-secondary border-b-2 border-secondary" : "text-on-surface-variant hover:text-on-surface"
                  }`}
                >
                  <Icon name="inventory_2" className="text-xs mr-1 align-middle" />Gear
                </button>
              </div>

              {leftPanel === "survival" ? (
                <div className="bg-surface-container-low p-4 border-l-2 border-primary-container/40 flex-1 overflow-y-auto">
                  {/* Resist bars */}
                  <div className="space-y-2 mb-4">
                    {[
                      { name: "Fire", key: "Fire Resistance", color: "bg-red-400" },
                      { name: "Cold", key: "Cold Resistance", color: "bg-blue-400" },
                      { name: "Lightning", key: "Lightning Resistance", color: "bg-yellow-300" },
                      { name: "Chaos", key: "Chaos Resistance", color: "bg-purple-400" },
                    ].map(r => {
                      const stat = resists.find(s => s.title === r.key);
                      const valMatch = stat?.text?.match(/(\d+)%/);
                      const val = valMatch ? parseInt(valMatch[1]) : 0;
                      const capped = stat?.severity === "positive";
                      const pct = Math.max(0, Math.min(100, val));
                      return (
                        <div key={r.name} className="space-y-0.5">
                          <div className="flex justify-between text-[12px] uppercase tracking-widest font-sans">
                            <span className="text-on-surface-variant">{r.name}</span>
                            <span className={capped ? "text-primary-container" : "text-error"}>
                              {val > 0 ? `${Math.min(val, 75)}%` : "?"}
                            </span>
                          </div>
                          <div className="h-1 bg-surface-container-lowest w-full">
                            <div className={`h-full ${capped ? r.color : "bg-error"}`} style={{ width: `${pct}%` }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Survival issues */}
                  {survivalGroup && survivalGroup.items.length > 0 && (
                    <div className="space-y-1.5">
                      <p className="text-[12px] font-sans uppercase tracking-widest text-on-surface-variant">Issues ({survivalGroup.items.length})</p>
                      {survivalGroup.items.slice(0, 5).map((e, i) => (
                        <SurvivalItem key={i} explanation={e} />
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-surface-container-low p-4 border-l-2 border-secondary/40 flex-1 overflow-y-auto">
                  {/* Gear slot list */}
                  {selectedGearSlot ? (
                    <div>
                      <button
                        onClick={() => setSelectedGearSlot(null)}
                        className="flex items-center gap-1 text-[12px] font-sans text-on-surface-variant hover:text-on-surface mb-3"
                      >
                        <Icon name="arrow_back" className="text-xs" /> All Gear
                      </button>
                      <SlotDetailPanel
                        slot={gearSlots.find(s => s.slot === selectedGearSlot) || { slot: selectedGearSlot }}
                        charData={charData}
                        insights={insights}
                        account={charData?._account || ""}
                      />
                    </div>
                  ) : (
                    <div className="space-y-1.5">
                      {gearSlots.map(sl => {
                        const hasDeadMods = (sl.deadMods?.length || 0) > 0;
                        return (
                          <div
                            key={sl.slot}
                            className="flex items-center gap-2 p-2 cursor-pointer hover:bg-surface-container-high transition-colors"
                            onClick={() => setSelectedGearSlot(sl.slot)}
                          >
                            <Icon name={slotIcon(sl.slot)} className="text-on-surface-variant text-sm" />
                            <div className="flex-1 min-w-0">
                              <div className="text-[12px] font-sans text-on-surface-variant">{sl.slotDisplay}</div>
                              <div className="text-xs font-sans text-on-surface truncate">{sl.itemName}</div>
                            </div>
                            {hasDeadMods && <span className="w-1.5 h-1.5 rounded-full bg-red-400 shrink-0" />}
                            <span className={`text-[12px] font-sans px-1 py-0.5 ${tierColor(sl.avgTier)}`}>
                              T{sl.avgTier}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* CENTER: Synergy Map */}
            <SynergyMapPanel
              synergyMap={whyInsights?.synergyMap}
              meta={whyInsights?.meta}
              projections={projections}
              onToggle={toggleProjection}
            />

            {/* RIGHT: Improvement Path */}
            <div className="col-span-3 flex flex-col gap-4">
              <div className="bg-surface-container-low p-5 border-l-2 border-secondary/40 flex-1">
                <h4 className="flex items-center gap-2 text-xs font-sans uppercase tracking-widest text-secondary mb-4">
                  <Icon name="trending_up" className="text-base" />
                  Improvement Path
                </h4>

                <div className="space-y-3">
                  {groups.flatMap(g => g.items.filter(e => e.severity === "critical" || e.context === "action"))
                    .filter((e, i, arr) => arr.findIndex(x => x.title === e.title) === i)
                    .slice(0, 6)
                    .map((e, i) => {
                      const name = e.title?.replace("Allocate ", "").replace("Missing: ", "");
                      return (
                        <ImprovementCard
                          key={i}
                          explanation={e}
                          toggled={!!projections[name]}
                          onToggle={() => toggleProjection(name)}
                        />
                      );
                    })
                  }
                </div>

                <NextBigUpgradeCard improvement={improvement} />

                {/* Perk Tree Swaps */}
                {treeLoading && (
                  <div className="mt-4 pt-4 border-t border-outline-variant/20">
                    <div className="flex items-center gap-2 py-2">
                      <div className="w-3 h-3 border-2 border-tertiary border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
                      <span className="text-xs font-sans text-on-surface-variant">Analyzing passive tree...</span>
                    </div>
                  </div>
                )}
                {!treeLoading && treeAnalysis && Array.isArray(treeAnalysis.swapRecommendations) && treeAnalysis.swapRecommendations.length > 0 && (
                  <div className="mt-4 pt-4 border-t border-outline-variant/20">
                    <h4 className="flex items-center gap-2 text-xs font-sans uppercase tracking-widest text-tertiary mb-3">
                      <Icon name="swap_horiz" className="text-base" />
                      Perk Swaps
                      {treeAnalysis.targetName && (
                        <span className="text-on-surface-variant font-normal">vs {treeAnalysis.targetName}</span>
                      )}
                    </h4>
                    <div className="space-y-2">
                      {treeAnalysis.swapRecommendations.slice(0, 5).map((swap, i) => (
                        <SwapCard key={i} swap={swap} rank={i + 1} />
                      ))}
                    </div>
                  </div>
                )}

                {/* Compare to Build */}
                <div className="mt-4 pt-4 border-t border-outline-variant/20">
                  <h4 className="flex items-center gap-2 text-xs font-sans uppercase tracking-widest text-primary-container mb-3">
                    <Icon name="compare_arrows" className="text-base" />
                    Compare to Build
                  </h4>
                  <div className="flex gap-2 mb-2">
                    <input
                      value={compareQuery}
                      onChange={e => { setCompareQuery(e.target.value); setCompareError(""); }}
                      placeholder="poe.ninja URL or account/char"
                      className="flex-1 px-2 py-1.5 bg-surface-container-lowest border border-outline-variant text-xs font-sans text-on-surface placeholder-outline focus:border-primary-container focus:outline-none"
                      onKeyDown={e => { if (e.key === "Enter") handleCompare(); }}
                    />
                    <button
                      onClick={handleCompare}
                      disabled={compareLoading || !compareQuery.trim()}
                      className="px-3 py-1.5 bg-primary-container text-on-primary text-xs font-sans hover:bg-primary transition-colors disabled:opacity-50"
                    >
                      {compareLoading ? "..." : "Diff"}
                    </button>
                  </div>
                  {compareError && <p className="text-xs text-error font-sans mb-2">{compareError}</p>}
                  {compareResult && (
                    <div className="space-y-1.5">
                      <div className="text-xs font-sans text-on-surface-variant mb-2">
                        vs <span className="text-primary-container">{compareResult.target?.name}</span>
                        {" "}({compareResult.target?.ascendancy} Lv{compareResult.target?.level})
                        {" — "}{compareResult.player_dps} vs {compareResult.target_dps} DPS
                      </div>
                      {compareResult.diffs?.slice(0, 10).map((d, i) => (
                        <ComparisonDiffCard key={i} diff={d} />
                      ))}
                      {compareResult.total_diffs > 10 && (
                        <p className="text-xs font-sans text-on-surface-variant">+{compareResult.total_diffs - 10} more differences</p>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -- Stitch Stat Card (new design) ------------------------------------

    function StitchStatCard({ label, value, context, status, icon, projected, projectedDelta }) {
      const hasProjection = projected != null && projectedDelta > 0;
      const fmtProjected = projected != null ? (projected >= 1e6 ? `${(projected/1e6).toFixed(1)}M` : projected >= 1e3 ? `${(projected/1e3).toFixed(0)}K` : projected.toLocaleString()) : "";
      const fmtDelta = projectedDelta > 0 ? (projectedDelta >= 1e6 ? `+${(projectedDelta/1e6).toFixed(1)}M` : projectedDelta >= 1e3 ? `+${(projectedDelta/1e3).toFixed(0)}K` : `+${projectedDelta.toLocaleString()}`) : "";

      // Progress bar percentage based on status
      const barPct = { critical: 25, warning: 55, positive: 100, info: 50 }[status] || 50;

      return (
        <div className="bg-surface-container-low p-6">
          <div className="flex justify-between items-start mb-4">
            <span className="uppercase text-[10px] tracking-widest text-on-surface/60 font-bold">{label}</span>
            <Icon name={icon} className="text-primary-container" />
          </div>
          {hasProjection ? (
            <>
              <div className="flex items-baseline gap-2 mb-2">
                <span className="font-serif text-3xl text-on-surface-variant line-through opacity-70 tracking-tighter">{value}</span>
                <span className="font-serif text-5xl text-primary-container tracking-tighter">{fmtProjected}</span>
              </div>
            </>
          ) : (
            <div className="font-serif text-5xl text-primary-container mb-2 tracking-tighter">{value}</div>
          )}
          <div className="w-full h-1 bg-surface-container-lowest mb-3">
            <div className="h-full bg-primary-container transition-all duration-500" style={{ width: `${barPct}%` }} />
          </div>
          {hasProjection ? (
            <p className="text-[11px] text-primary-container uppercase tracking-wider">{fmtDelta} with selected improvements</p>
          ) : (
            <p className="text-[11px] text-on-surface/40 uppercase tracking-wider">{context}</p>
          )}
        </div>
      );
    }

    // -- Pulse sub-components ------------------------------------------------

    function SurvivalItem({ explanation }) {
      const e = explanation;
      const iconName = { critical: "error", warning: "warning", positive: "check_circle", info: "info" }[e.severity] || "info";
      const iconColor = { critical: "text-error", warning: "text-yellow-400", positive: "text-primary-container", info: "text-on-surface-variant" }[e.severity] || "";
      const [open, setOpen] = useState(false);
      return (
        <div className="bg-surface-container-lowest p-2 cursor-pointer hover:bg-surface-container transition-colors" onClick={() => setOpen(!open)}>
          <div className="flex items-center gap-2">
            <Icon name={iconName} className={`text-xs ${iconColor}`} />
            <span className="text-xs font-sans font-bold text-on-surface flex-1 truncate">{e.title.replace("Allocate ", "").replace("Missing: ", "")}</span>
            {e.adoptionPct > 0 && <span className="text-[12px] font-sans text-on-surface-variant">{e.adoptionPct.toFixed(0)}%</span>}
          </div>
          {open && <p className="text-[12px] font-sans text-on-surface-variant mt-1 leading-relaxed pl-5">{e.text}</p>}
        </div>
      );
    }

    function SynergyMapPanel({ synergyMap, meta, projections = {}, onToggle }) {
      const categories = synergyMap || [];
      const [activeCategory, setActiveCategory] = useState(categories[0]?.category || "dps");
      const active = categories.find(c => c.category === activeCategory) || categories[0];

      if (!active) {
        return (
          <div className="col-span-6 flex items-center justify-center">
            <div className="w-6 h-6 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
          </div>
        );
      }

      const catColors = {
        dps: { border: "border-secondary", text: "text-secondary", bg: "bg-secondary/10", glow: "rgba(233, 193, 118, 0.25)" },
        survival: { border: "border-primary-container", text: "text-primary-container", bg: "bg-primary-container/10", glow: "rgba(255, 183, 123, 0.25)" },
        clear_speed: { border: "border-tertiary", text: "text-tertiary", bg: "bg-tertiary/10", glow: "rgba(181, 234, 255, 0.25)" },
      };
      const colors = catColors[active.category] || catColors.dps;

      return (
        <div className="col-span-6 relative flex flex-col">
          {/* Grid backdrop */}
          <div className="absolute inset-0 opacity-5" style={{ backgroundImage: "radial-gradient(circle, #9f8d81 1px, transparent 1px)", backgroundSize: "40px 40px" }} />

          <div className="relative z-10">
            {/* Category tabs */}
            <div className="flex items-center justify-center gap-1 mb-6">
              {categories.map(cat => {
                const isActive = cat.category === activeCategory;
                const tabColor = catColors[cat.category] || catColors.dps;
                return (
                  <button
                    key={cat.category}
                    onClick={() => setActiveCategory(cat.category)}
                    className={`px-4 py-2 text-xs font-sans uppercase tracking-widest transition-all ${
                      isActive
                        ? `${tabColor.bg} ${tabColor.text} border-b-2 ${tabColor.border}`
                        : "text-on-surface-variant hover:text-on-surface"
                    }`}
                  >
                    <Icon name={cat.icon} className="text-sm mr-1 align-middle" />
                    {cat.label}
                  </button>
                );
              })}
            </div>

            {/* Central output node */}
            {(() => {
              const toggledDelta = active.missing
                .filter(m => projections[m.name] && m.estimatedValue > 0)
                .reduce((sum, m) => sum + m.estimatedValue, 0);
              const hasProjected = toggledDelta > 0;

              return (
                <div className={`mx-auto w-44 bg-surface-container border-2 ${colors.border} flex flex-col items-center justify-center text-center mb-6 py-5 px-4 transition-all`} style={{ boxShadow: `0 0 ${hasProjected ? 35 : 25}px ${colors.glow}` }}>
                  <span className={`text-[12px] uppercase tracking-[0.2em] ${colors.text} font-sans mb-1`}>{active.label}</span>
                  {hasProjected ? (
                    <>
                      <span className="text-lg font-serif text-on-surface-variant line-through opacity-60 leading-none">{active.value || "?"}</span>
                      <span className="text-3xl font-serif font-bold text-primary-container leading-none">
                        {(() => {
                          const curMatch = (active.value || "").match(/([\d,.]+)\s*([KkMm]?)/);
                          if (curMatch) {
                            let cur = parseFloat(curMatch[1].replace(",",""));
                            if ((curMatch[2] || "").toUpperCase() === "K") cur *= 1000;
                            if ((curMatch[2] || "").toUpperCase() === "M") cur *= 1e6;
                            const proj = cur + toggledDelta;
                            return proj >= 1e6 ? `${(proj/1e6).toFixed(1)}M` : proj >= 1e3 ? `${(proj/1e3).toFixed(0)}K` : proj.toLocaleString();
                          }
                          return active.value;
                        })()}
                      </span>
                      <span className="text-[12px] font-sans text-primary-container mt-1">
                        +{toggledDelta >= 1e6 ? `${(toggledDelta/1e6).toFixed(1)}M` : toggledDelta >= 1e3 ? `${(toggledDelta/1e3).toFixed(0)}K` : toggledDelta.toLocaleString()} projected
                      </span>
                    </>
                  ) : (
                    <>
                      <span className="text-3xl font-serif font-bold text-on-surface leading-none">{active.value || "?"}</span>
                      <span className="text-[12px] uppercase tracking-widest text-on-surface-variant mt-2">
                        {active.contributors.length} active · {active.missing.length} missing
                      </span>
                    </>
                  )}
                </div>
              );
            })()}

            {/* Contributors */}
            {active.contributors.length > 0 && (
              <div className="mb-4">
                <p className="text-[12px] font-sans uppercase tracking-widest text-on-surface-variant mb-2 px-2">
                  <Icon name="check_circle" className="text-xs text-primary-container mr-1 align-middle" />
                  Active Contributors
                </p>
                <div className="grid grid-cols-2 gap-2">
                  {active.contributors.map((c, i) => (
                    <ContributorNode key={i} contributor={c} colors={colors} positive />
                  ))}
                </div>
              </div>
            )}

            {/* Missing */}
            {active.missing.length > 0 && (
              <div className="mb-4">
                <p className="text-[12px] font-sans uppercase tracking-widest text-on-surface-variant mb-2 px-2">
                  <Icon name="add_circle" className="text-xs text-error mr-1 align-middle" />
                  Missing — Would Improve {active.label}
                </p>
                <div className="grid grid-cols-2 gap-2">
                  {active.missing.map((c, i) => (
                    <ContributorNode
                      key={i}
                      contributor={c}
                      colors={colors}
                      positive={false}
                      toggled={!!projections[c.name]}
                      onToggle={onToggle ? () => onToggle(c.name) : null}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* Meta context */}
            {meta?.length > 0 && (
              <div className="p-3 bg-surface-container-lowest border border-outline-variant/10 text-center mt-2">
                <p className="text-[12px] font-sans text-on-surface-variant">{meta[0].text}</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ContributorNode({ contributor, colors, positive, toggled, onToggle }) {
      const c = contributor;
      const [open, setOpen] = useState(false);
      const typeIcons = { skill: "auto_awesome", support: "link", keystone: "diamond", gear: "inventory_2", stat: "bar_chart", missing: "add" };
      const hasEstimate = c.estimatedValue > 0 || c.estimatedPct > 0;
      const isToggled = toggled && !positive;
      return (
        <div
          className={`p-2.5 border cursor-pointer transition-all ${
            isToggled
              ? "bg-primary-container/10 border-primary-container/40"
              : positive
                ? "bg-surface-container border-outline-variant/20 hover:border-outline"
                : "bg-surface-container-lowest border-error/20 hover:border-error/40"
          }`}
          onClick={() => setOpen(!open)}
        >
          <div className="flex items-start gap-2">
            {!positive && onToggle && (
              <div
                className={`w-4 h-4 mt-px shrink-0 border flex items-center justify-center cursor-pointer transition-all ${
                  isToggled ? "bg-primary-container border-primary-container" : "border-outline-variant hover:border-outline"
                }`}
                onClick={(e) => { e.stopPropagation(); onToggle(); }}
              >
                {isToggled && <Icon name="check" className="text-xs text-surface-container-lowest" />}
              </div>
            )}
            {positive && <Icon name={typeIcons[c.sourceType] || "info"} className={`text-xs mt-px ${colors.text}`} />}
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-1.5">
                <span className={`text-xs font-sans font-bold truncate ${isToggled ? "text-primary-container" : "text-on-surface"}`}>{c.name}</span>
                {hasEstimate && (
                  <span className={`text-[12px] font-sans font-bold ${isToggled ? "text-primary-container" : positive ? colors.text : "text-error"}`}>
                    {c.estimatedPct > 0 ? `${positive ? "" : "+"}${c.estimatedPct.toFixed(0)}%` : ""}
                  </span>
                )}
                {c.adoptionPct > 0 && <span className="text-xs font-sans text-on-surface-variant">{c.adoptionPct.toFixed(0)}% use</span>}
              </div>
              {hasEstimate && c.estimatedValue > 0 && (
                <div className={`text-xs font-sans font-bold mb-0.5 ${isToggled ? "text-primary-container" : positive ? "text-on-surface" : "text-error"}`}>
                  {positive ? "" : "+"}{c.estimatedValue >= 1000 ? (c.estimatedValue >= 1e6 ? `${(c.estimatedValue/1e6).toFixed(1)}M` : `${(c.estimatedValue/1e3).toFixed(0)}K`) : c.estimatedValue.toFixed(0)}
                </div>
              )}

    function ModRow({ name, tierNum, tierCount, value, barWidth, barColor, dotColor, benefitColor, benefitReason, replaceText, tierText, tierSeverity }) {
