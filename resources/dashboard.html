                  {[
                    { name: "Fire", key: "Fire Resistance", color: "bg-red-400" },
                    { name: "Cold", key: "Cold Resistance", color: "bg-blue-400" },
                    { name: "Lightning", key: "Lightning Resistance", color: "bg-yellow-300" },
                    { name: "Chaos", key: "Chaos Resistance", color: "bg-purple-400" },
                  ].map(r => {
                    const stat = resists.find(s => s.title === r.key);
                    // Extract value from text like "Fire Resistance is capped at 75% with 6% overcap"
                    const valMatch = stat?.text?.match(/(\d+)%/);
                    const val = valMatch ? parseInt(valMatch[1]) : 0;
                    const capped = stat?.severity === "positive";
                    const pct = Math.max(0, Math.min(100, val));
                    return (
                      <div key={r.name} className="space-y-1">
                        <div className="flex justify-between text-[10px] uppercase tracking-widest font-mono">
                          <span className="text-on-surface-var">{r.name} Res</span>
                          <span className={capped ? "text-primary-container" : val < 75 ? "text-error" : "text-on-surface-var"}>
                            {val > 0 ? `${Math.min(val, 75)}%` : "?"}
                          </span>
                        </div>
                        <div className="h-1.5 bg-surface-dim w-full">
                          <div className={`h-full transition-all ${capped ? r.color : "bg-error"}`} style={{ width: `${pct}%` }} />
                        </div>
                        {!capped && val < 75 && (
                          <p className="text-[9px] text-error uppercase font-mono tracking-tight">Uncapped: {75 - val}% gap</p>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* Survival issues */}
                {survivalGroup && (
                  <div className="space-y-2">
                    <p className="text-[10px] font-mono uppercase tracking-widest text-on-surface-var mb-2">Issues ({survivalGroup.items.length})</p>
                    {survivalGroup.items.slice(0, 5).map((e, i) => (
                      <SurvivalItem key={i} explanation={e} />
                    ))}
                    {survivalGroup.items.length > 5 && (
                      <p className="text-[9px] font-mono text-on-surface-var">+{survivalGroup.items.length - 5} more</p>
                    )}
                  </div>
                )}

                {/* EHP note */}
                {sc && sc.ehpStatus !== "positive" && (
                  <div className="mt-4 p-3 bg-surface-dim border-l-2 border-primary-container/30">
                    <p className="text-[10px] font-mono text-on-surface-var leading-relaxed">
                      <span className="text-primary-container font-bold">Note:</span> {sc.ehpContext}.
                    </p>
                  </div>
                )}
              </div>
            </div>

            {/* ── CENTER: Synergy Map ──────────────────── */}
            <div className="col-span-6 relative flex items-start justify-center pt-8">
              {/* Grid backdrop */}
              <div className="absolute inset-0 opacity-5" style={{ backgroundImage: "radial-gradient(circle, #99907f 1px, transparent 1px)", backgroundSize: "40px 40px" }} />

              <div className="relative z-10 w-full max-w-lg">
                {/* Central DPS node */}
                <div className="mx-auto w-40 h-40 bg-surface-container border-2 border-primary-container flex flex-col items-center justify-center text-center mb-8" style={{ boxShadow: "0 0 20px rgba(229, 195, 113, 0.2)" }}>
                  <span className="text-[9px] uppercase tracking-[0.2em] text-primary-container font-mono mb-1">Build Output</span>
                  <span className="text-3xl font-serif font-bold text-on-surface leading-none">{sc?.dpsLabel || "..."}</span>
                  <span className="text-[9px] uppercase tracking-widest text-on-surface-var mt-1">Total DPS</span>
                </div>

                {/* Connected keystones/items as synergy nodes */}
                {damageGroup && damageGroup.items.length > 0 && (
                  <div className="grid grid-cols-2 gap-3 mb-6">
                    {damageGroup.items.map((e, i) => (
                      <SynergyNode key={i} explanation={e} type="damage" />
                    ))}
                  </div>
                )}

                {clearGroup && clearGroup.items.length > 0 && (
                  <div className="grid grid-cols-2 gap-3 mb-6">
                    {clearGroup.items.map((e, i) => (
                      <SynergyNode key={i} explanation={e} type="clear" />
                    ))}
                  </div>
                )}

                {qualityGroup && qualityGroup.items.length > 0 && (
                  <div className="grid grid-cols-2 gap-3">
                    {qualityGroup.items.map((e, i) => (
                      <SynergyNode key={i} explanation={e} type="quality" />
                    ))}
                  </div>
                )}

                {/* Meta context */}
                {whyInsights?.meta?.length > 0 && (
                  <div className="mt-6 p-3 bg-surface-dim/50 border border-outline-variant/20 text-center">
                    <p className="text-[10px] font-mono text-on-surface-var">{whyInsights.meta[0].text}</p>
                  </div>
                )}
              </div>
            </div>

            {/* ── RIGHT: Improvement Path ──────────────── */}
            <div className="col-span-3 flex flex-col gap-4">
              <div className="bg-surface-container p-5 border-l-2 border-secondary/40 flex-1">
                <h4 className="flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-secondary mb-4">
                  <Icon name="trending_up" className="text-base" />
                  Improvement Path
                </h4>

                <div className="space-y-3">
                  {/* Merge all action items from groups, sorted by severity */}
                  {groups.flatMap(g => g.items.filter(e => e.severity === "critical" || e.context === "action"))
                    .filter((e, i, arr) => arr.findIndex(x => x.title === e.title) === i)
                    .slice(0, 6)
                    .map((e, i) => (
                      <ImprovementCard key={i} explanation={e} />
                    ))
                  }
                </div>

                <NextBigUpgradeCard improvement={improvement} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Pulse sub-components ──────────────────────────────

    function ScoreStatCard({ label, value, context, status, icon }) {
      const borderColor = { critical: "border-error/40", warning: "border-yellow-500/40", positive: "border-primary-container/40", info: "border-outline-variant/30" }[status] || "border-outline-variant/30";
      const textColor = { critical: "text-error", warning: "text-yellow-400", positive: "text-primary-container", info: "text-on-surface" }[status] || "";
      return (
        <div className={`bg-surface-container p-5 border-l-4 ${borderColor}`}>
          <p className="text-[10px] uppercase tracking-widest text-on-surface-var font-mono mb-2">{label}</p>
          <div className="flex items-baseline gap-2">
            <span className={`text-3xl font-serif font-bold tracking-tight ${textColor}`}>{value}</span>
          </div>
          <p className="text-[10px] font-mono text-on-surface-var mt-2">{context}</p>
        </div>
      );
    }

    function SurvivalItem({ explanation }) {
      const e = explanation;
      const iconName = { critical: "error", warning: "warning", positive: "check_circle", info: "info" }[e.severity] || "info";
      const iconColor = { critical: "text-error", warning: "text-yellow-400", positive: "text-primary-container", info: "text-on-surface-var" }[e.severity] || "";
      const [open, setOpen] = useState(false);
      return (
        <div className="bg-surface-dim/50 p-2 cursor-pointer hover:bg-surface-dim transition-colors" onClick={() => setOpen(!open)}>
          <div className="flex items-center gap-2">
            <Icon name={iconName} className={`text-xs ${iconColor}`} />
            <span className="text-[10px] font-mono font-bold text-on-surface flex-1 truncate">{e.title.replace("Allocate ", "").replace("Missing: ", "")}</span>
            {e.adoptionPct > 0 && <span className="text-[9px] font-mono text-on-surface-var">{e.adoptionPct.toFixed(0)}%</span>}
          </div>
          {open && <p className="text-[9px] font-mono text-on-surface-var mt-1 leading-relaxed pl-5">{e.text}</p>}
        </div>
      );
    }

    function SynergyNode({ explanation, type }) {
      const e = explanation;
      const borderColor = { damage: "border-secondary/30", clear: "border-tertiary/30", quality: "border-outline-variant/20" }[type] || "border-outline-variant/20";
      const labelColor = { damage: "text-secondary", clear: "text-tertiary", quality: "text-on-surface-var" }[type] || "";
      const typeLabel = { damage: "Damage", clear: "Clear Speed", quality: "Quality" }[type] || "";
      const [open, setOpen] = useState(false);
      return (
        <div className={`bg-surface-container p-3 border ${borderColor} hover:border-primary-container/50 transition-all cursor-pointer`} onClick={() => setOpen(!open)}>
          <div className="flex justify-between items-start mb-1">
            <span className={`text-[8px] font-mono uppercase tracking-widest ${labelColor}`}>{typeLabel}</span>
            {e.adoptionPct > 0 && <span className="text-[8px] font-mono text-on-surface-var">{e.adoptionPct.toFixed(0)}%</span>}
          </div>
          <h5 className="text-[11px] font-mono font-bold uppercase tracking-tight text-on-surface">{e.title.replace("Allocate ", "").replace("Missing: ", "")}</h5>
          {open && <p className="text-[9px] font-mono text-on-surface-var mt-2 leading-relaxed">{e.text}</p>}
        </div>
      );
    }

    function ImprovementCard({ explanation }) {
      const e = explanation;
      const borderColor = { critical: "border-error", warning: "border-secondary", info: "border-primary-container" }[e.severity] || "border-outline-variant";
      const labelColor = { critical: "text-error", warning: "text-secondary", info: "text-primary-container" }[e.severity] || "";
      const typeLabel = { critical: "Urgent", warning: "Recommended", info: "Optional" }[e.severity] || "";
      const [open, setOpen] = useState(false);
      return (
        <div className={`bg-surface-dim/50 p-3 border-l-2 ${borderColor} hover:bg-surface-bright transition-all cursor-pointer group`} onClick={() => setOpen(!open)}>
          <div className="flex justify-between items-start mb-1">
            <span className={`text-[8px] font-mono uppercase tracking-widest ${labelColor}`}>{typeLabel}</span>
          </div>
          <h6 className="text-[11px] font-mono font-bold uppercase tracking-tight text-on-surface">{e.title.replace("Allocate ", "").replace("Missing: ", "")}</h6>
          {open ? (
            <p className="text-[9px] font-mono text-on-surface-var mt-1 leading-relaxed">{e.text}</p>
          ) : (
            <p className="text-[9px] font-mono text-on-surface-var mt-1 truncate">{e.text.slice(0, 60)}...</p>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Equipment Grid + Slot Detail
    // -----------------------------------------------------------------------
    function tierColor(avg) {
      if (avg <= 2) return "bg-green-400/20 text-green-400 border-green-400/30";
      if (avg <= 3.5) return "bg-yellow-400/20 text-yellow-400 border-yellow-400/30";
      return "bg-red-400/20 text-red-400 border-red-400/30";
    }

    function SlotDetailPanel({ slot, charData, insights, account }) {
      const [popularItems, setPopularItems] = useState(null);
      const [loadingPopular, setLoadingPopular] = useState(false);

      const slotData = useMemo(() => {
        return (insights?.slotSummary || []).find(s => s.slot === slot.slot);
      }, [insights, slot]);

      const equipment = useMemo(() => {
        return (charData?.equipment || []).find(e => e.slot === slot.slot);
      }, [charData, slot]);

      const modTiers = equipment?.modTiers || {};

      const allMods = useMemo(() => {
        const result = [];
        for (const [modType, tiers] of Object.entries(modTiers)) {
          if (!tiers) continue;
          for (const t of tiers) {
            if (t) result.push({ ...t, modType });
          }
        }
        return result;
      }, [modTiers]);

      const deadMods = slotData?.deadMods || [];
      const weakMods = slotData?.weakMods || [];

      const fetchPopular = async () => {
        if (popularItems || loadingPopular) return;
        setLoadingPopular(true);
        const data = await api("/api/character/popular-items", "POST", {
          account: account,
          character: charData.name,
          slot: slot.slot,
        });
        setLoadingPopular(false);
        if (!data.error && Array.isArray(data)) setPopularItems(data);
        else if (data.items) setPopularItems(data.items);
      };

      return (
        <div className="col-span-2 p-4 rounded-lg bg-surface-bright border border-outline-variant fade-in">
          <div className="text-sm font-mono font-semibold text-on-surface mb-3">{slot.itemName || "Unknown Item"}</div>

          {/* Mod list with tier bars */}
          {allMods.length > 0 && (
            <div className="flex flex-col gap-2 mb-4">
              {allMods.map((mod, i) => {
                const isDead = deadMods.some(dm => mod.display_name?.includes(dm.mod) || dm.mod?.includes(mod.display_name));
                const isWeak = mod.tier_num >= 3;
                const weakInfo = weakMods.find(wm => wm.name === mod.display_name);
                const barWidth = mod.tier_count > 0 ? Math.max(5, ((mod.tier_count - mod.tier_num + 1) / mod.tier_count) * 100) : 50;
                const barColor = mod.tier_num <= 2 ? "bg-green-400" : mod.tier_num <= 3 ? "bg-yellow-400" : "bg-red-400";

                return (
                  <div key={i} className={`p-2 rounded ${isDead ? "bg-red-400/10 border border-red-400/20" : isWeak ? "bg-yellow-400/5" : ""}`}>
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs font-mono text-on-surface truncate flex-1">{mod.display_name}</span>
                      <span className="text-xs font-mono text-on-surface-var whitespace-nowrap">T{mod.tier_num}/{mod.tier_count}</span>
                      <span className="text-xs font-mono text-outline whitespace-nowrap">{mod.value ?? ""}</span>
                    </div>
                    <div className="mt-1 h-1.5 rounded-full bg-surface-container overflow-hidden">
                      <div className={`h-full rounded-full tier-bar ${barColor}`} style={{ width: `${barWidth}%` }} />
                    </div>
                    {isDead && <div className="text-xs text-secondary mt-1">{deadMods.find(dm => mod.display_name?.includes(dm.mod))?.reason || "Dead mod"}</div>}
                    {isWeak && weakInfo?.nextTierRange && (
                      <div className="text-xs text-yellow-400/80 mt-1">Next: T{weakInfo.nextTier} would be {weakInfo.nextTierRange}</div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {allMods.length === 0 && (
            <div className="text-xs text-outline font-mono mb-4">No tier data available for this item</div>
          )}

          {/* Popular Items */}
          <button
            onClick={fetchPopular}
            className="px-3 py-1.5 rounded bg-surface-container border border-outline-variant text-xs font-mono text-on-surface-var hover:border-primary-container hover:text-on-surface transition-colors"
          >
            {loadingPopular ? "Loading..." : "View Popular Items"}
          </button>

          {popularItems && (
            <div className="mt-3 flex flex-col gap-1">
              {popularItems.slice(0, 5).map((item, i) => (
                <div key={i} className="flex items-center justify-between px-2 py-1.5 rounded bg-surface-container">
                  <span className="text-xs font-mono text-on-surface">{item.name}</span>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono text-on-surface-var">{item.percentage?.toFixed(1)}%</span>
                    {item.rarity && (
                      <span className={`text-xs px-1.5 py-0.5 rounded font-mono ${
                        item.rarity === "unique" ? "bg-primary-container/20 text-primary-container" : "bg-surface-bright text-on-surface-var"
                      }`}>{item.rarity}</span>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function GearTab({ charData, insights, account }) {
      const [expandedSlot, setExpandedSlot] = useState(null);

      if (!charData) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-4">
            <Icon name="inventory_2" className="text-6xl text-outline" />
            <p className="text-on-surface-var font-mono text-sm">Load a character to view gear</p>
          </div>
        );
      }

      if (!insights) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-3">
            <div className="w-8 h-8 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
            <span className="text-sm text-on-surface-var font-mono">Loading gear data...</span>
          </div>
        );
      }

      const slots = insights.slotSummary || [];

      const selectedSlot = slots.find(s => s.slot === expandedSlot);

      return (
        <div className="p-5 max-w-4xl mx-auto">
          <h2 className="font-serif text-lg text-on-surface mb-4">Equipment</h2>
          <div className="flex gap-4">
            {/* Slot list — left side */}
            <div className="flex flex-col gap-2 w-64 shrink-0">
              {slots.map(sl => {
                const isSelected = expandedSlot === sl.slot;
                const hasDeadMods = (sl.deadMods?.length || 0) > 0;
                return (
                  <div
                    key={sl.slot}
                    className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition-colors ${
                      isSelected ? "bg-surface-bright border-primary-container/40" : "bg-surface border-outline-variant hover:border-outline"
                    }`}
                    onClick={() => setExpandedSlot(isSelected ? null : sl.slot)}
                  >
                    <div className="relative">
                      <Icon name={slotIcon(sl.slot)} className="text-on-surface-var text-lg" />
                      {hasDeadMods && <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-red-400" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-[10px] font-mono text-on-surface-var">{sl.slotDisplay}</div>
                      <div className="text-xs font-mono text-on-surface truncate">{sl.itemName}</div>
                    </div>
                    <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${tierColor(sl.avgTier)}`}>
                      T{sl.avgTier}
                    </span>
                  </div>
                );
              })}
            </div>
            {/* Detail panel — right side */}
            <div className="flex-1 min-w-0">
              {selectedSlot ? (
                <SlotDetailPanel
                  slot={selectedSlot}
                  charData={charData}
                  insights={insights}
                  account={charData._account || ""}
                />
              ) : (
                <div className="flex flex-col items-center justify-center h-full text-on-surface-var py-12">
                  <Icon name="touch_app" className="text-4xl mb-2 opacity-50" />
                  <span className="text-sm font-mono opacity-70">Select an item to view details</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // MARKET Tab
    // -----------------------------------------------------------------------
    function CostTierBreakdown({ efficiency }) {
      const [expanded, setExpanded] = useState(null);
      const costTiers = efficiency?.costTiers || [];

      if (!costTiers.length) return null;

      const tierLabels = ["Free", "Budget", "Mid", "High", "Premium"];
      const tierColors = ["bg-green-400", "bg-tertiary", "bg-primary", "bg-yellow-400", "bg-secondary"];
      const total = costTiers.reduce((s, t) => s + (t.items?.length || 0), 0) || 1;

      return (
        <div className="flex flex-col gap-3">
          <h3 className="font-serif text-base text-on-surface">Investment Tiers</h3>
          <div className="h-3 rounded-full bg-surface-container overflow-hidden flex">
            {costTiers.map((tier, i) => {
              const w = ((tier.items?.length || 0) / total) * 100;
              return <div key={i} className={`h-full ${tierColors[i] || "bg-outline"} cursor-pointer hover:opacity-80 transition-opacity`} style={{ width: `${Math.max(w, 2)}%` }} onClick={() => setExpanded(expanded === i ? null : i)} />;
            })}
          </div>
          <div className="flex justify-between text-xs font-mono text-on-surface-var">
            {costTiers.map((tier, i) => (
              <span key={i} className="cursor-pointer hover:text-on-surface" onClick={() => setExpanded(expanded === i ? null : i)}>
                {tierLabels[i] || `Tier ${i + 1}`} ({tier.items?.length || 0})
              </span>
            ))}
          </div>
          {expanded !== null && costTiers[expanded]?.items && (
            <div className="flex flex-col gap-2 fade-in">
              {costTiers[expanded].items.map((item, i) => (
                <div key={i} className="flex items-center justify-between p-2 rounded bg-surface-container">
                  <div className="flex-1 min-w-0">
                    <span className="text-xs font-mono text-on-surface">{item.name || item.item}</span>
                    {item.slot && <span className="ml-2 text-xs text-on-surface-var">{item.slot}</span>}
                  </div>
                  {item.price && <span className="text-xs font-mono text-primary-container">{item.price}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function UpgradeSuggestions({ efficiency }) {
      const upgrades = efficiency?.upgradePriority || [];
      if (!upgrades.length) return null;

      return (
        <div className="flex flex-col gap-3">
          <h3 className="font-serif text-base text-on-surface">Upgrade Priority</h3>
          {upgrades.map((u, i) => (
            <div key={i} className="p-3 rounded-lg bg-surface border border-outline-variant fade-in" style={{ animationDelay: `${i * 50}ms` }}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-sm font-mono font-semibold text-on-surface">{u.slotDisplay || u.slot}</span>
                <span className={`text-xs font-mono px-2 py-0.5 rounded border ${tierColor(u.currentTier || u.avgTier || 3)}`}>
                  T{u.currentTier || u.avgTier} avg
                </span>
              </div>
              {u.topItem && (
                <div className="flex items-center justify-between mt-1">
                  <span className="text-xs font-mono text-on-surface-var">{u.topItem}</span>
                  {u.topItemPrice && <span className="text-xs font-mono text-primary-container">{u.topItemPrice}</span>}
                </div>
              )}
              {u.reason && <div className="text-xs text-on-surface-var mt-1">{u.reason}</div>}
            </div>
          ))}
        </div>
      );
    }

    function BudgetPlanner({ efficiency }) {
      const [budget, setBudget] = useState("");
      const upgrades = efficiency?.upgradePriority || [];

      const filteredUpgrades = useMemo(() => {
        const b = parseFloat(budget);
        if (!b || isNaN(b)) return upgrades;
        return upgrades.filter(u => {
          const price = parseFloat(String(u.topItemPrice || "").replace(/[^0-9.]/g, ""));
          return !isNaN(price) && price <= b;
        });
      }, [budget, upgrades]);

      const totalCost = useMemo(() => {
        return filteredUpgrades.reduce((sum, u) => {
          const price = parseFloat(String(u.topItemPrice || "").replace(/[^0-9.]/g, ""));
          return sum + (isNaN(price) ? 0 : price);
        }, 0);
      }, [filteredUpgrades]);

      return (
        <div className="flex flex-col gap-3">
          <h3 className="font-serif text-base text-on-surface">Budget Planner</h3>
          <div className="flex items-center gap-3">
            <input
              type="number"
              value={budget}
              onChange={e => setBudget(e.target.value)}
              placeholder="Budget (divines)"
              className="flex-1 px-3 py-2 rounded bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-mono focus:border-primary-container"
            />
            {budget && (
              <div className="text-xs font-mono text-on-surface-var">
                {filteredUpgrades.length} items | ~{totalCost.toFixed(1)}d total
              </div>
            )}
          </div>
          {budget && filteredUpgrades.length > 0 && (
            <div className="flex flex-col gap-2">
              {filteredUpgrades.map((u, i) => (
                <div key={i} className="flex items-center justify-between p-2 rounded bg-surface-container">
                  <span className="text-xs font-mono text-on-surface">{u.slotDisplay || u.slot}: {u.topItem || "upgrade"}</span>
                  <span className="text-xs font-mono text-primary-container">{u.topItemPrice || "?"}</span>
                </div>
              ))}
            </div>
          )}
          {budget && filteredUpgrades.length === 0 && (
            <div className="text-xs text-on-surface-var font-mono">No upgrades found within budget</div>
          )}
        </div>
      );
    }

    function MarketTab({ charData, efficiency }) {
      if (!charData) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-4">
            <Icon name="storefront" className="text-6xl text-outline" />
            <p className="text-on-surface-var font-mono text-sm">Load a character to view market data</p>
          </div>
        );
      }

      if (!efficiency) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-3">
            <div className="w-8 h-8 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
            <span className="text-sm text-on-surface-var font-mono">Loading market data...</span>
          </div>
        );
      }

      return (
        <div className="flex flex-col gap-6 p-5 max-w-4xl mx-auto">
          <CostTierBreakdown efficiency={efficiency} />
          <UpgradeSuggestions efficiency={efficiency} />
          <BudgetPlanner efficiency={efficiency} />
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // GUIDE Tab
    // -----------------------------------------------------------------------
    function GuideImportBar({ onImport }) {
      const [url, setUrl] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleImport = async () => {
        if (!url.trim()) return;
        setLoading(true);
        setError("");
        const result = await api("/api/guide/import", "POST", { url: url.trim() });
        setLoading(false);
        if (result.error) setError(result.error);
        else {
          setUrl("");
          if (onImport) onImport(result);
        }
      };

      return (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-2">
            <input
              value={url}
              onChange={e => setUrl(e.target.value)}
              placeholder="Paste build guide URL"
              className="flex-1 px-3 py-2 rounded bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-mono focus:border-primary-container"
              onKeyDown={e => { if (e.key === "Enter") handleImport(); }}
            />
            <button
              onClick={handleImport}
              disabled={loading}
              className="px-4 py-2 rounded bg-primary-container text-surface-dim text-sm font-mono font-semibold hover:bg-primary transition-colors disabled:opacity-50"
            >
              {loading ? "..." : "Import"}
            </button>
          </div>
          {error && <p className="text-xs text-error">{error}</p>}
        </div>
      );
    }

    function GuideList({ guides, selectedId, onSelect, onDelete }) {
      if (!guides.length) return <div className="text-xs text-on-surface-var font-mono mt-2">No guides imported yet</div>;

      return (
        <div className="flex flex-col gap-2 mt-3">
          {guides.map(g => (
            <div
              key={g.id}
              className={`flex items-center justify-between p-3 rounded-lg border cursor-pointer card-hover ${
                selectedId === g.id ? "bg-surface-bright border-primary-container/40" : "bg-surface border-outline-variant"
              }`}
              onClick={() => onSelect(g.id)}
            >
              <div className="flex-1 min-w-0">
                <div className="text-sm font-mono text-on-surface truncate">{g.title}</div>
                <div className="text-xs text-on-surface-var mt-0.5">{g.char_class} {g.ascendancy ? `- ${g.ascendancy}` : ""} | {g.stages || 0} stages</div>
              </div>
              <button
                onClick={e => { e.stopPropagation(); onDelete(g.id); }}
                className="p-1 text-outline hover:text-error transition-colors ml-2"
              >
                <Icon name="delete" className="text-base" />
              </button>
            </div>
          ))}
        </div>
      );
    }

    function GuideDetail({ guide, charData }) {
      const [activeStage, setActiveStage] = useState(null);
      const [comparison, setComparison] = useState(null);
      const [compLoading, setCompLoading] = useState(false);

      useEffect(() => {
        if (!guide) return;
        if (guide.stages?.length > 0 && !activeStage) {
          setActiveStage(guide.stages[0].stage || guide.stages[0].name || 0);
        }
      }, [guide]);

      useEffect(() => {
        if (!guide || !charData) return;
        setCompLoading(true);
        api(`/api/guide/${guide.id}/compare`, "POST", {
          account: charData._account,
          character_name: charData.name,
        }).then(data => {
          setCompLoading(false);
          if (!data.error) setComparison(data);
        });
      }, [guide, charData]);

      if (!guide) return null;

      const stages = guide.stages || [];
      const stageData = comparison?.stages || comparison?.comparison || [];
      const currentStageComparison = Array.isArray(stageData)
        ? stageData.find(s => s.stage === activeStage) || stageData[0]
        : stageData;

      const slotComparisons = currentStageComparison?.slots || currentStageComparison?.gear || [];

      return (
        <div className="mt-4 flex flex-col gap-3 fade-in">
          {/* Stage tabs */}
          {stages.length > 1 && (
            <div className="flex gap-1 overflow-x-auto">
              {stages.map((st, i) => {
                const stageName = st.stage || st.name || `Stage ${i + 1}`;
                return (
                  <button
                    key={i}
                    onClick={() => setActiveStage(stageName)}
                    className={`px-3 py-1.5 rounded text-xs font-mono whitespace-nowrap transition-colors ${
                      activeStage === stageName
                        ? "bg-primary-container text-surface-dim"
                        : "bg-surface-container text-on-surface-var hover:text-on-surface"
                    }`}
                  >
                    {stageName}
                  </button>
                );
              })}
            </div>
          )}

          {compLoading ? (
            <div className="flex items-center justify-center py-8">
              <div className="w-6 h-6 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
            </div>
          ) : slotComparisons.length > 0 ? (
            <div className="flex flex-col gap-2">
              <div className="grid grid-cols-3 gap-2 px-2 text-xs font-mono text-on-surface-var">
                <span>Slot</span>
                <span>Guide</span>
                <span>Yours</span>
              </div>
              {slotComparisons.map((sc, i) => {
                const matchClass = sc.match === "exact" ? "text-green-400" : sc.match === "partial" ? "text-yellow-400" : "text-red-400";
                const matchIcon = sc.match === "exact" ? "check_circle" : sc.match === "partial" ? "change_circle" : "cancel";
                return (
                  <div key={i} className="grid grid-cols-3 gap-2 p-2 rounded bg-surface-container items-center">
                    <span className="text-xs font-mono text-on-surface-var">{sc.slotDisplay || sc.slot}</span>
                    <span className="text-xs font-mono text-on-surface truncate">{sc.guideItem || sc.guide_item || "--"}</span>
                    <div className="flex items-center gap-1">
                      <Icon name={matchIcon} className={`text-sm ${matchClass}`} />
                      <span className="text-xs font-mono text-on-surface truncate">{sc.yourItem || sc.your_item || "--"}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="text-xs text-on-surface-var font-mono text-center py-4">
              {charData ? "No comparison data available" : "Load a character to compare against this guide"}
            </div>
          )}
        </div>
      );
    }

    function GuideTab({ charData }) {
      const [guides, setGuides] = useState([]);
      const [selectedGuideId, setSelectedGuideId] = useState(null);
      const [selectedGuide, setSelectedGuide] = useState(null);

      const fetchGuides = useCallback(async () => {
        const data = await api("/api/guide/list");
        if (Array.isArray(data)) setGuides(data);
      }, []);

      useEffect(() => { fetchGuides(); }, []);

      const handleImport = (result) => {
        fetchGuides();
        if (result.id) setSelectedGuideId(result.id);
      };

      const handleSelect = async (id) => {
        setSelectedGuideId(id);
        const data = await api(`/api/guide/${id}`);
        if (!data.error) setSelectedGuide(data);
      };

      const handleDelete = async (id) => {
        await api(`/api/guide/${id}`, "DELETE");
        fetchGuides();
        if (selectedGuideId === id) { setSelectedGuideId(null); setSelectedGuide(null); }
      };

      return (
        <div className="flex flex-col gap-4 p-5 max-w-4xl mx-auto">
          <h2 className="font-serif text-lg text-on-surface">Build Guides</h2>
          <GuideImportBar onImport={handleImport} />
          <GuideList guides={guides} selectedId={selectedGuideId} onSelect={handleSelect} onDelete={handleDelete} />
          {selectedGuide && <GuideDetail guide={selectedGuide} charData={charData} />}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Dashboard (root)
    // -----------------------------------------------------------------------
    function Dashboard() {
      const [charData, setCharData] = useState(null);
      const [account, setAccount] = useState("");
      const [character, setCharacter] = useState("");
      const [insights, setInsights] = useState(null);
      const [efficiency, setEfficiency] = useState(null);
      const [improvement, setImprovement] = useState(null);
      const [comparison, setComparison] = useState(null);
      const [whyInsights, setWhyInsights] = useState(null);
      const [activeTab, setActiveTab] = useState("PULSE");
      const [settings, setSettings] = useState({});
      const [status, setStatus] = useState({});
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [analysisLoading, setAnalysisLoading] = useState(false);

      // Fetch analysis data when charData changes
      useEffect(() => {
        if (!charData || !account || !character) return;
        setAnalysisLoading(true);
        setInsights(null);
        setEfficiency(null);
        setImprovement(null);
        setComparison(null);
        setWhyInsights(null);

        const body = { account, character };

        // Core analysis — fast, blocks the loading spinner
        Promise.all([
          api("/api/character/build-insights", "POST", body),
          api("/api/character/improvement-package", "POST", body),
          api("/api/character/build-compare", "POST", body),
          api("/api/character/build-efficiency", "POST", body),
        ]).then(([ins, imp, comp, eff]) => {
          if (!ins.error) setInsights(ins);
          if (!imp.error) setImprovement(imp);
          if (!comp.error) setComparison(comp);
          if (!eff.error) setEfficiency(eff);
          setAnalysisLoading(false);
        }).catch(() => setAnalysisLoading(false));

        // Why-engine — runs independently, populates when ready
        api("/api/character/why-insights", "POST", body).then(why => {
          if (why && !why.error) {
            console.log("[LAMA] Why-insights received:", Object.keys(why).map(k => `${k}:${Array.isArray(why[k]) ? why[k].length : Object.keys(why[k] || {}).length}`).join(", "));
            setWhyInsights(why);
          } else {
            console.warn("[LAMA] Why-insights failed:", why?.error || "empty response");
          }
        }).catch(e => console.warn("[LAMA] Why-insights error:", e));
      }, [charData, account, character]);

      // Character lookup handler — accepts optional pre-fetched data from smart-lookup
      const handleLookup = useCallback(async (acct, charName, prefetchedData) => {
        const data = prefetchedData || await api("/api/character/lookup", "POST", { account: acct, character: charName });
        if (data.error) return data;
        setAccount(acct || data.account || "");
        setCharacter(charName || data.name || "");
        setCharData({ ...data, _account: acct || data.account || "" });
        setSettingsOpen(false);
        return data;
      }, []);

      // WebSocket handler
      const handleWsMessage = useCallback((msg) => {
        switch (msg.type) {
          case "init":
            setStatus({ state: msg.state, uptime: msg.uptime, stats: msg.stats, version: msg.version });
            if (msg.settings) setSettings(msg.settings);
            break;
          case "settings":
            if (msg.settings) setSettings(msg.settings);
            break;
          case "state_change":
            setStatus(prev => ({ ...prev, state: msg.state }));
            break;
          case "log":
            // Could store logs if needed
            break;
        }
      }, []);

      const { connected } = useDashboardSocket(WS_URL, handleWsMessage);

      const tabContent = useMemo(() => {
        switch (activeTab) {
          case "PULSE":
            return <PulseTab charData={charData} insights={insights} improvement={improvement} comparison={comparison} whyInsights={whyInsights} onLookup={handleLookup} />;
          case "GEAR":
            return <GearTab charData={charData} insights={insights} account={account} />;
          case "MARKET":
            return <MarketTab charData={charData} efficiency={efficiency} />;
          case "GUIDE":
            return <GuideTab charData={charData} />;
          default:
            return null;
        }
      }, [activeTab, charData, insights, improvement, comparison, efficiency, account]);

      return (
        <div className="flex flex-col h-full">
          <TopBar charData={charData} onSettingsClick={() => setSettingsOpen(true)} />
          <TabNav activeTab={activeTab} onTabChange={setActiveTab} hasCharacter={!!charData} onSettingsClick={() => setSettingsOpen(true)} />

          {/* Main content area */}
          <div className="flex-1 overflow-y-auto" style={{ marginTop: charData ? "105px" : "105px" }}>
            {tabContent}
          </div>

          {/* Connection indicator */}
          <div className="fixed bottom-3 left-3 flex items-center gap-1.5 z-40">
            <span className={`w-1.5 h-1.5 rounded-full ${connected ? "bg-green-400" : "bg-red-400"}`} />
            <span className="text-[10px] font-mono text-outline">{connected ? "Connected" : "Disconnected"}</span>
          </div>

          {/* Settings Panel */}
          <SettingsPanel
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            settings={settings}
            setSettings={setSettings}
            status={status}
            onLookup={handleLookup}
            charData={charData}
          />
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Mount
    // -----------------------------------------------------------------------
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
