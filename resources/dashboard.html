    function tierColor(avg) {
      if (avg <= 2) return "bg-green-400/20 text-green-400 border-green-400/30";
      if (avg <= 3.5) return "bg-yellow-400/20 text-yellow-400 border-yellow-400/30";
      return "bg-red-400/20 text-red-400 border-red-400/30";
    }

    // Classify a mod as beneficial, neutral, or wasted for a build
    function classifyMod(modText, archetype) {
      if (!modText || !archetype) return { benefit: "neutral", reason: "" };
      const ml = modText.toLowerCase();
      const dmgType = archetype.damageType || archetype.damage_type || "";
      const defType = archetype.defenseType || archetype.defense_type || "";
      const isCrit = archetype.isCrit || archetype.is_crit || archetype.isCoc || archetype.is_coc;
      const isSpell = dmgType === "spell";
      const isAttack = dmgType === "attack";
      const isMinion = dmgType === "minion";

      if (isSpell) {
        if (/spell.*damage|cast speed|gem level|level of all.*spell|level of all.*skill/.test(ml))
          return { benefit: "green", reason: "Scales your spell damage directly" };
        if (/as extra.*damage|elemental damage|cold damage|fire damage|lightning damage/.test(ml))
          return { benefit: "green", reason: "Adds elemental damage scaling" };
      }
      if (isAttack) {
        if (/attack speed|physical damage|added.*damage to attack|melee damage/.test(ml))
          return { benefit: "green", reason: "Scales your attack damage directly" };
      }
      if (isCrit && /critical.*hit.*chance|critical.*damage|critical.*multiplier/.test(ml))
        return { benefit: "green", reason: "Scales your crit damage" };
      if (/maximum life/.test(ml) && (defType === "life" || defType === "hybrid"))
        return { benefit: "green", reason: "Increases your life pool" };
      if (/energy shield|maximum energy shield/.test(ml) && (defType === "es" || defType === "hybrid"))
        return { benefit: "green", reason: "Increases your ES pool" };
      if (/resist/.test(ml))
        return { benefit: "green", reason: "Helps cap resistances" };
      if (/movement speed/.test(ml))
        return { benefit: "green", reason: "Faster movement = better clear" };
      if (/spirit/.test(ml))
        return { benefit: "green", reason: "Enables more skill reservations" };

      if (isSpell && /attack speed|local.*physical|added.*damage to attack/.test(ml))
        return { benefit: "red", reason: "Attack mod on a spell build — wasted",
          replace: "Replace with: % spell damage, % cast speed, or +gem levels" };
      if (isAttack && /spell.*damage|cast speed/.test(ml))
        return { benefit: "red", reason: "Spell mod on an attack build — wasted",
          replace: "Replace with: % attack speed, flat physical damage, or % elemental damage" };
      if (!isCrit && /critical.*hit.*chance|critical.*multiplier/.test(ml))
        return { benefit: "red", reason: "Crit mod on a non-crit build — wasted",
          replace: "Replace with: % increased damage, flat damage, or defensive mod" };
      if (defType === "es" && /maximum life/.test(ml) && /armour|evasion/.test(ml))
        return { benefit: "red", reason: "Life/armour mod on an ES build",
          replace: "Replace with: +ES, % increased ES, or ES recharge" };

      if (/mana.*regeneration/.test(ml) && defType !== "mom")
        return { benefit: "neutral", reason: "Mana regen — minor utility for this build",
          replace: isSpell ? "Could be: % spell damage, cast speed, or resistance" : "Could be: attack speed, flat damage, or resistance" };
      if (/maximum mana/.test(ml) && defType !== "mom")
        return { benefit: "neutral", reason: "Mana pool — minor utility unless using Mind Over Matter",
          replace: defType === "life" ? "Better as: +maximum life, resistance, or damage mod" : "Better as: +ES, resistance, or damage mod" };
      if (/item rarity|item quantity/.test(ml))
        return { benefit: "neutral", reason: "Magic find — doesn't help in combat",
          replace: "Could be a damage or survivability mod instead" };
      if (/light radius|stun/.test(ml))
        return { benefit: "neutral", reason: "Minor utility — low impact",
          replace: isSpell ? "Better as: spell damage, cast speed, or resistance" : "Better as: damage, attack speed, or resistance" };
      if (/intelligence|dexterity|strength/.test(ml) && !/damage/.test(ml))
        return { benefit: "neutral", reason: "Attribute — may be needed for gem requirements",
          replace: "" };

      return { benefit: "neutral", reason: "", replace: "" };
    }

    // Plain-language tier explanation
    function tierExplanation(tierNum, tierCount, value, tierRange, modName) {
      if (!tierNum || !tierCount) return null;
      const pct = Math.round(((tierCount - tierNum + 1) / tierCount) * 100);

      if (tierNum === 1) {
        return { text: "Best possible roll (Tier 1). This is the highest value this mod can roll.", severity: "positive" };
      }
      if (tierNum <= 2) {
        return { text: `Near-perfect roll (Tier ${tierNum} of ${tierCount}). Only ${tierNum - 1} tier${tierNum > 2 ? "s" : ""} higher exist.`, severity: "positive" };
      }
      if (tierNum <= Math.ceil(tierCount / 2)) {
        const nextRange = tierRange || "";
        return {
          text: `Mid-tier roll (Tier ${tierNum} of ${tierCount}). Higher tiers exist with better values${nextRange ? ` — next tier rolls ${nextRange}` : ""}. Search player trade for an upgrade.`,
          severity: "warning"
        };
      }
      return {
        text: `Low roll (Tier ${tierNum} of ${tierCount}). Significantly better versions of this mod exist. Look for Tier 1-${Math.ceil(tierCount / 3)} on trade — the difference is substantial.`,
        severity: "critical"
      };
    }

    function SlotDetailPanel({ slot, charData, insights, account }) {
      const [popularItems, setPopularItems] = useState(null);
      const [loadingPopular, setLoadingPopular] = useState(false);

      const slotData = useMemo(() => {
        return (insights?.slotSummary || []).find(s => s.slot === slot.slot);
      }, [insights, slot]);

      const equipment = useMemo(() => {
        return (charData?.equipment || []).find(e => e.slot === slot.slot);
      }, [charData, slot]);

      const modTiers = equipment?.modTiers || {};

      const allMods = useMemo(() => {
        const result = [];
        for (const [modType, tiers] of Object.entries(modTiers)) {
          if (!tiers) continue;
          for (const t of tiers) {
            if (t) result.push({ ...t, modType });
          }
        }
        return result;
      }, [modTiers]);

      const archetype = insights?.archetype || {};

      const rawMods = useMemo(() => {
        if (!equipment) return [];
        const mods = [];
        for (const mod of (equipment.explicitMods || equipment.explicit_mods || [])) {
          mods.push({ text: mod, type: "explicit" });
        }
        for (const mod of (equipment.implicitMods || equipment.implicit_mods || [])) {
          mods.push({ text: mod, type: "implicit" });
        }
        for (const mod of (equipment.craftedMods || equipment.crafted_mods || [])) {
          mods.push({ text: mod, type: "crafted" });
        }
        return mods;
      }, [equipment]);

      const deadMods = slotData?.deadMods || [];
      const weakMods = slotData?.weakMods || [];

      const fetchPopular = async () => {
        if (popularItems || loadingPopular) return;
        setLoadingPopular(true);
        const data = await api("/api/character/popular-items", "POST", {
          account: account,
          character: charData.name,
          slot: slot.slot,
        });
        setLoadingPopular(false);
        if (!data.error && Array.isArray(data)) setPopularItems(data);
        else if (data.items) setPopularItems(data.items);
      };

      return (
        <div className="p-3 bg-surface-container-high border border-outline-variant fade-in">
          <div className="text-xs font-sans font-semibold text-on-surface mb-2">{slot.itemName || "Unknown Item"}</div>

          <div className="flex flex-col gap-1 mb-3">
            {allMods.length > 0 ? (
              allMods.map((mod, i) => {
                const isDead = deadMods.some(dm => mod.display_name?.includes(dm.mod) || dm.mod?.includes(mod.display_name));
                const benefit = classifyMod(mod.display_name, archetype);
                const tierExp = tierExplanation(mod.tier_num, mod.tier_count, mod.value, mod.tier_range, mod.display_name);
                const barWidth = mod.tier_count > 0 ? Math.max(5, ((mod.tier_count - mod.tier_num + 1) / mod.tier_count) * 100) : 50;
                const benefitColor = isDead ? "border-red-500/30 bg-red-500/5" :
                  benefit.benefit === "green" ? "border-green-500/20 bg-green-500/5" :
                  benefit.benefit === "red" ? "border-red-500/20 bg-red-500/5" :
                  "border-outline-variant/20";
                const dotColor = isDead ? "bg-red-400" : benefit.benefit === "green" ? "bg-green-400" : benefit.benefit === "red" ? "bg-red-400" : "bg-outline";
                const barColor = mod.tier_num <= 2 ? "bg-green-400" : mod.tier_num <= 3 ? "bg-yellow-400" : "bg-red-400";

                return (
                  <ModRow key={i}
                    name={mod.display_name}
                    tierNum={mod.tier_num} tierCount={mod.tier_count} value={mod.value}
                    barWidth={barWidth} barColor={barColor}
                    dotColor={dotColor} benefitColor={benefitColor}
                    benefitReason={isDead ? (deadMods.find(dm => mod.display_name?.includes(dm.mod))?.reason || "Dead mod — wasted on this build") : benefit.reason}
                    replaceText={isDead ? (isSpell ? "Replace with: % spell damage, cast speed, or +gem levels" : isAttack ? "Replace with: attack speed, flat damage, or resistance" : "Replace with a build-relevant mod") : benefit.replace}
                    tierText={tierExp?.text}
                    tierSeverity={tierExp?.severity}
                  />
                );
              })
            ) : rawMods.length > 0 ? (
              rawMods.map((mod, i) => {
                const cleanText = (mod.text || "").replace(/\[([^|\]]*\|)?([^\]]*)\]/g, "$2");
                const benefit = classifyMod(cleanText, archetype);
                const dotColor = benefit.benefit === "green" ? "bg-green-400" : benefit.benefit === "red" ? "bg-red-400" : "bg-outline";
                const benefitColor = benefit.benefit === "green" ? "border-green-500/20 bg-green-500/5" :
                  benefit.benefit === "red" ? "border-red-500/20 bg-red-500/5" : "border-outline-variant/20";
                const typeLabel = mod.type === "implicit" ? "implicit" : mod.type === "crafted" ? "crafted" : "";

                return (
                  <div key={i} className={`flex items-start gap-2 p-1.5 border-l-2 ${benefitColor}`}>
                    <span className={`w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${dotColor}`} />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-sans text-on-surface flex-1">{cleanText}</span>
                        {typeLabel && <span className="text-xs font-sans text-outline uppercase">{typeLabel}</span>}
                      </div>
                      {benefit.reason && (
                        <p className={`text-[12px] font-sans mt-0.5 ${benefit.benefit === "green" ? "text-green-400/80" : benefit.benefit === "red" ? "text-red-400/80" : "text-on-surface-variant"}`}>
                          {benefit.reason}
                        </p>
                      )}
                      {benefit.replace && (
                        <p className="text-[12px] font-sans mt-0.5 text-secondary">
                          <span className="font-bold">{'\u2192'}</span> {benefit.replace}
                        </p>
                      )}
                    </div>
                  </div>
                );
              })
            ) : (
              <div className="text-xs text-outline font-sans py-2">No mod data available</div>
            )}

          <button
            onClick={fetchPopular}

          {popularItems && (
            <div className="mt-3 flex flex-col gap-2">
              {popularItems.slice(0, 5).map((item, i) => {
                const isUnique = item.rarity === "unique";
                return (
                  <div key={i} className={`px-2.5 py-2 border-l-2 ${isUnique ? "border-primary-container bg-primary-container/5" : "border-secondary/30 bg-surface-container"}`}>

                      <span className={`text-xs font-sans font-bold ${isUnique ? "text-primary-container" : "text-secondary"}`}>
                        {item.name}
                      </span>
                      <span className="text-xs font-sans text-on-surface-variant">{item.percentage?.toFixed(0)}%</span>
                    </div>
                    {isUnique && (
                      <p className="text-[12px] font-sans text-on-surface-variant">
                        Unique item — fixed stats, look up specific rolls
                      </p>

                    {!isUnique && item.topMods && item.topMods.length > 0 && (
                      <div className="flex flex-col gap-0.5 mt-1">
                        {item.topMods.map((mod, j) => (

                            <span className={`text-[12px] font-sans ${mod.hasIt ? "text-primary-container" : "text-on-surface-variant"}`}>
                              {mod.hasIt ? "\u2713" : "\u25CB"}
                            </span>
                            <span className="text-[12px] font-sans text-on-surface-variant flex-1 truncate">{mod.name}</span>
                            <span className="text-[12px] font-sans text-on-surface-variant">{mod.pct}%</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {!isUnique && (!item.topMods || item.topMods.length === 0) && (
                      <p className="text-[12px] font-sans text-on-surface-variant">
                        Rare — look for key mods for your build
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );

                  >
                    <div className="relative">
                      <Icon name={slotIcon(sl.slot)} className="text-on-surface-variant text-lg" />
                      {hasDeadMods && <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-red-400" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-xs font-sans text-on-surface-variant">{sl.slotDisplay}</div>
                      <div className="text-xs font-sans text-on-surface truncate">{sl.itemName}</div>
                    </div>
                    <span className={`text-xs font-sans px-1.5 py-0.5 border ${tierColor(sl.avgTier)}`}>
                      T{sl.avgTier}
                    </span>
                  </div>
                );
              })}
            </div>
            <div className="flex-1 min-w-0">
              {selectedSlot ? (
                <SlotDetailPanel
                  slot={selectedSlot}
                  charData={charData}
                  insights={insights}
                  account={charData._account || ""}
                />
              ) : (
                <div className="flex flex-col items-center justify-center h-full text-on-surface-variant py-12">
                  <Icon name="touch_app" className="text-4xl mb-2 opacity-70" />
                  <span className="text-sm font-sans opacity-70">Select an item to view details</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // MARKET Tab
    // -----------------------------------------------------------------------
    function CostTierBreakdown({ efficiency }) {
      const [expanded, setExpanded] = useState(null);
      const costTiers = efficiency?.costTiers || [];

      if (!costTiers.length) return null;

      const tierLabels = ["Free", "Budget", "Mid", "High", "Premium"];
      const tierColors = ["bg-green-400", "bg-tertiary", "bg-primary", "bg-yellow-400", "bg-secondary"];
      const total = costTiers.reduce((s, t) => s + (t.items?.length || 0), 0) || 1;

      return (
        <div className="flex flex-col gap-3">
          <h3 className="font-serif text-base text-on-surface">Investment Tiers</h3>
          <div className="h-3 bg-surface-container overflow-hidden flex">
            {costTiers.map((tier, i) => {
              const w = ((tier.items?.length || 0) / total) * 100;
              return <div key={i} className={`h-full ${tierColors[i] || "bg-outline"} cursor-pointer hover:opacity-80 transition-opacity`} style={{ width: `${Math.max(w, 2)}%` }} onClick={() => setExpanded(expanded === i ? null : i)} />;
            })}
          </div>
          <div className="flex justify-between text-xs font-sans text-on-surface-variant">
            {costTiers.map((tier, i) => (
              <span key={i} className="cursor-pointer hover:text-on-surface" onClick={() => setExpanded(expanded === i ? null : i)}>
                {tierLabels[i] || `Tier ${i + 1}`} ({tier.items?.length || 0})
              </span>
            ))}
          </div>
          {expanded !== null && costTiers[expanded]?.items && (
            <div className="flex flex-col gap-2 fade-in">
              {costTiers[expanded].items.map((item, i) => (
                <div key={i} className="flex items-center justify-between p-2 bg-surface-container">
                  <div className="flex-1 min-w-0">
                    <span className="text-xs font-sans text-on-surface">{item.name || item.item}</span>
                    {item.slot && <span className="ml-2 text-xs text-on-surface-variant">{item.slot}</span>}
                  </div>
                  {item.price && <span className="text-xs font-sans text-primary-container">{item.price}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function UpgradeSuggestions({ efficiency }) {
      const upgrades = efficiency?.upgradePriority || [];
      if (!upgrades.length) return null;

      return (
        <div className="flex flex-col gap-3">
          <h3 className="font-serif text-base text-on-surface">Upgrade Priority</h3>
          {upgrades.map((u, i) => (
            <div key={i} className="p-3 bg-surface-container-low border border-outline-variant fade-in" style={{ animationDelay: `${i * 50}ms` }}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-sm font-sans font-semibold text-on-surface">{u.slotDisplay || u.slot}</span>
                <span className={`text-xs font-sans px-2 py-0.5 border ${tierColor(u.currentTier || u.avgTier || 3)}`}>
                  T{u.currentTier || u.avgTier} avg
                </span>
              </div>
              {u.topItem && (
                <div className="flex items-center justify-between mt-1">
                  <span className="text-xs font-sans text-on-surface-variant">{u.topItem}</span>
                  {u.topItemPrice && <span className="text-xs font-sans text-primary-container">{u.topItemPrice}</span>}
                </div>
              )}
              {u.reason && <div className="text-xs text-on-surface-variant mt-1">{u.reason}</div>}
            </div>
          ))}
        </div>
      );
    }

    function BudgetPlanner({ efficiency }) {
      const [budget, setBudget] = useState("");
      const upgrades = efficiency?.upgradePriority || [];

      const filteredUpgrades = useMemo(() => {
        const b = parseFloat(budget);
        if (!b || isNaN(b)) return upgrades;
        return upgrades.filter(u => {
          const price = parseFloat(String(u.topItemPrice || "").replace(/[^0-9.]/g, ""));
          return !isNaN(price) && price <= b;
        });
      }, [budget, upgrades]);

      const totalCost = useMemo(() => {
        return filteredUpgrades.reduce((sum, u) => {
          const price = parseFloat(String(u.topItemPrice || "").replace(/[^0-9.]/g, ""));
          return sum + (isNaN(price) ? 0 : price);
        }, 0);
      }, [filteredUpgrades]);

      return (
        <div className="flex flex-col gap-3">
          <h3 className="font-serif text-base text-on-surface">Budget Planner</h3>
          <div className="flex items-center gap-3">
            <input
              type="number"
              value={budget}
              onChange={e => setBudget(e.target.value)}
              placeholder="Budget (divines)"
              className="flex-1 px-3 py-2 bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-sans focus:border-primary-container"
            />
            {budget && (
              <div className="text-xs font-sans text-on-surface-variant">
                {filteredUpgrades.length} items | ~{totalCost.toFixed(1)}d total
              </div>
            )}
          </div>
          {budget && filteredUpgrades.length > 0 && (
            <div className="flex flex-col gap-2">
              {filteredUpgrades.map((u, i) => (
                <div key={i} className="flex items-center justify-between p-2 bg-surface-container">
                  <span className="text-xs font-sans text-on-surface">{u.slotDisplay || u.slot}: {u.topItem || "upgrade"}</span>
                  <span className="text-xs font-sans text-primary-container">{u.topItemPrice || "?"}</span>
                </div>
              ))}
            </div>
          )}
          {budget && filteredUpgrades.length === 0 && (
            <div className="text-xs text-on-surface-variant font-sans">No upgrades found within budget</div>
          )}
        </div>
      );
    }

    function MarketTab({ charData, efficiency, whyInsights }) {
      if (!charData) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-4">
            <Icon name="storefront" className="text-6xl text-outline" />
            <p className="text-on-surface-variant font-sans text-sm">Load a character to view market data</p>
          </div>
        );
      }

      if (!efficiency && !whyInsights) {
        return (
          <div className="flex flex-col items-center justify-center h-full gap-3">
            <div className="w-8 h-8 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
            <span className="text-sm text-on-surface-variant font-sans">Loading market data...</span>
          </div>
        );
      }

      const upgradePaths = useMemo(() => {
        if (!whyInsights?.synergyMap) return [];
        const paths = [];
        for (const cat of whyInsights.synergyMap) {
          for (const m of (cat.missing || [])) {
            paths.push({
              category: cat.label,
              categoryIcon: cat.icon,
              name: m.name,
              contribution: m.contribution,
              detail: m.detail,
              estimatedPct: m.estimatedPct || 0,
              estimatedValue: m.estimatedValue || 0,
              severity: m.severity || "info",
              slot: m.slot || "",
              adoptionPct: m.adoptionPct || 0,
            });
          }
        }
        paths.sort((a, b) => b.estimatedValue - a.estimatedValue);
        return paths;
      }, [whyInsights]);

      return (
        <div className="flex flex-col gap-6 p-5 max-w-4xl mx-auto">
          {upgradePaths.length > 0 && (
            <div>
              <h3 className="font-serif text-lg text-on-surface mb-3">
                <Icon name="route" className="text-base mr-2 align-middle text-primary-container" />
                Upgrade Priority
              </h3>
              <p className="text-xs font-sans text-on-surface-variant mb-4">
                Sorted by estimated DPS/survival impact. Click to expand details.
              </p>
              <div className="space-y-2">
                {upgradePaths.slice(0, 15).map((path, i) => (
                  <UpgradePathCard key={i} path={path} rank={i + 1} />
                ))}
              </div>
            </div>
          )}

          {efficiency && <CostTierBreakdown efficiency={efficiency} />}
          {efficiency && <UpgradeSuggestions efficiency={efficiency} />}
          {efficiency && <BudgetPlanner efficiency={efficiency} />}
        </div>
      );
    }

    function UpgradePathCard({ path, rank }) {
      const [open, setOpen] = useState(false);
      const p = path;
      const borderColor = { critical: "border-error", warning: "border-secondary", info: "border-primary-container" }[p.severity] || "border-outline-variant";
      const valueLabel = p.estimatedValue >= 1e6 ? `+${(p.estimatedValue/1e6).toFixed(1)}M` :
                         p.estimatedValue >= 1e3 ? `+${(p.estimatedValue/1e3).toFixed(0)}K` :
                         p.estimatedValue > 0 ? `+${p.estimatedValue.toFixed(0)}` : "";
      return (
        <div className={`p-3 border-l-2 ${borderColor} bg-surface-container cursor-pointer hover:bg-surface-container-high transition-colors`} onClick={() => setOpen(!open)}>
          <div className="flex items-center gap-3">
            <span className="text-xs font-sans text-on-surface-variant w-6">#{rank}</span>
            <Icon name={p.categoryIcon || "trending_up"} className="text-sm text-on-surface-variant" />
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className="text-xs font-sans font-bold text-on-surface truncate">{p.name}</span>
                {p.estimatedPct > 0 && <span className="text-xs font-sans text-secondary">+{p.estimatedPct.toFixed(0)}%</span>}
                {valueLabel && <span className="text-xs font-sans text-primary-container">{valueLabel}</span>}
              </div>
              {!open && <p className="text-xs font-sans text-on-surface-variant truncate mt-0.5">{p.contribution}</p>}
            </div>
            <span className="text-xs font-sans text-on-surface-variant uppercase">{p.category}</span>
          </div>
          {open && (
            <div className="mt-2 ml-9">
              <p className="text-xs font-sans text-on-surface-variant leading-relaxed">{p.detail || p.contribution}</p>
              {p.slot && <p className="text-xs font-sans text-outline mt-1">Slot: {p.slot}</p>}
              {p.adoptionPct > 0 && <p className="text-xs font-sans text-outline mt-1">{p.adoptionPct.toFixed(0)}% of top players use this</p>}
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // GUIDE Tab
    // -----------------------------------------------------------------------
    function GuideImportBar({ onImport }) {
      const [url, setUrl] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleImport = async () => {
        if (!url.trim()) return;
        setLoading(true);
        setError("");
        const result = await api("/api/guide/import", "POST", { url: url.trim() });
        setLoading(false);
        if (result.error) setError(result.error);
        else {
          setUrl("");
          if (onImport) onImport(result);
        }
      };

      return (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-2">
            <input
              value={url}
              onChange={e => setUrl(e.target.value)}
              placeholder="Paste build guide URL"
              className="flex-1 px-3 py-2 bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-sans focus:border-primary-container"
              onKeyDown={e => { if (e.key === "Enter") handleImport(); }}
            />
            <button
              onClick={handleImport}
              disabled={loading}
              className="px-4 py-2 bg-primary-container text-on-primary text-sm font-sans font-semibold hover:bg-primary transition-colors disabled:opacity-70"
            >
              {loading ? "..." : "Import"}
            </button>
          </div>
          {error && <p className="text-xs text-error">{error}</p>}
        </div>
      );
    }

    function GuideList({ guides, selectedId, onSelect, onDelete }) {
      if (!guides.length) return <div className="text-xs text-on-surface-variant font-sans mt-2">No guides imported yet</div>;

      return (
        <div className="flex flex-col gap-2 mt-3">
          {guides.map(g => (
            <div
              key={g.id}
              className={`flex items-center justify-between p-3 border cursor-pointer card-hover ${
                selectedId === g.id ? "bg-surface-container-high border-primary-container/40" : "bg-surface-container-low border-outline-variant"
              }`}
              onClick={() => onSelect(g.id)}
            >
              <div className="flex-1 min-w-0">
                <div className="text-sm font-sans text-on-surface truncate">{g.title}</div>
                <div className="text-xs text-on-surface-variant mt-0.5">{g.char_class} {g.ascendancy ? `- ${g.ascendancy}` : ""} | {g.stages || 0} stages</div>
              </div>
              <button
                onClick={e => { e.stopPropagation(); onDelete(g.id); }}
                className="p-1 text-outline hover:text-error transition-colors ml-2"
              >
                <Icon name="delete" className="text-base" />
              </button>
            </div>
          ))}
        </div>
      );
    }

    function GuideDetail({ guide, charData }) {
      const [activeStage, setActiveStage] = useState(null);
      const [comparison, setComparison] = useState(null);
      const [compLoading, setCompLoading] = useState(false);

      useEffect(() => {
        if (!guide) return;
        if (guide.stages?.length > 0 && !activeStage) {
          setActiveStage(guide.stages[0].stage || guide.stages[0].name || 0);
        }
      }, [guide]);

      useEffect(() => {
        if (!guide || !charData) return;
        setCompLoading(true);
        api(`/api/guide/${guide.id}/compare`, "POST", {
          account: charData._account,
          character_name: charData.name,
        }).then(data => {
          setCompLoading(false);
          if (!data.error) setComparison(data);
        });
      }, [guide, charData]);

      if (!guide) return null;

      const stages = guide.stages || [];
      const stageData = comparison?.stages || comparison?.comparison || [];
      const currentStageComparison = Array.isArray(stageData)
        ? stageData.find(s => s.stage === activeStage) || stageData[0]
        : stageData;

      const slotComparisons = currentStageComparison?.slots || currentStageComparison?.gear || [];

      return (
        <div className="mt-4 flex flex-col gap-3 fade-in">
          {stages.length > 1 && (
            <div className="flex gap-1 overflow-x-auto">
              {stages.map((st, i) => {
                const stageName = st.stage || st.name || `Stage ${i + 1}`;
                return (
                  <button
                    key={i}
                    onClick={() => setActiveStage(stageName)}
                    className={`px-3 py-1.5 text-xs font-sans whitespace-nowrap transition-colors ${
                      activeStage === stageName
                        ? "bg-primary-container text-on-primary"
                        : "bg-surface-container text-on-surface-variant hover:text-on-surface"
                    }`}
                  >
                    {stageName}
                  </button>
                );
              })}
            </div>
          )}

          {compLoading ? (
            <div className="flex items-center justify-center py-8">
              <div className="w-6 h-6 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
            </div>
          ) : slotComparisons.length > 0 ? (
            <div className="flex flex-col gap-2">
              <div className="grid grid-cols-3 gap-2 px-2 text-xs font-sans text-on-surface-variant">
                <span>Slot</span>
                <span>Guide</span>
                <span>Yours</span>
              </div>
              {slotComparisons.map((sc, i) => {
                const matchClass = sc.match === "exact" ? "text-green-400" : sc.match === "partial" ? "text-yellow-400" : "text-red-400";
                const matchIcon = sc.match === "exact" ? "check_circle" : sc.match === "partial" ? "change_circle" : "cancel";
                return (
                  <div key={i} className="grid grid-cols-3 gap-2 p-2 bg-surface-container items-center">
                    <span className="text-xs font-sans text-on-surface-variant">{sc.slotDisplay || sc.slot}</span>
                    <span className="text-xs font-sans text-on-surface truncate">{sc.guideItem || sc.guide_item || "--"}</span>
                    <div className="flex items-center gap-1">
                      <Icon name={matchIcon} className={`text-sm ${matchClass}`} />
                      <span className="text-xs font-sans text-on-surface truncate">{sc.yourItem || sc.your_item || "--"}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="text-xs text-on-surface-variant font-sans text-center py-4">
              {charData ? "No comparison data available" : "Load a character to compare against this guide"}
            </div>
          )}
        </div>
      );
    }

    function GuideTab({ charData }) {
      const [guides, setGuides] = useState([]);
      const [selectedGuideId, setSelectedGuideId] = useState(null);
      const [selectedGuide, setSelectedGuide] = useState(null);

      const fetchGuides = useCallback(async () => {
        const data = await api("/api/guide/list");
        if (Array.isArray(data)) setGuides(data);
      }, []);

      useEffect(() => { fetchGuides(); }, []);

      const handleImport = (result) => {
        fetchGuides();
        if (result.id) setSelectedGuideId(result.id);
      };

      const handleSelect = async (id) => {
        setSelectedGuideId(id);
        const data = await api(`/api/guide/${id}`);
        if (!data.error) setSelectedGuide(data);
      };

      const handleDelete = async (id) => {
        await api(`/api/guide/${id}`, "DELETE");
        fetchGuides();
        if (selectedGuideId === id) { setSelectedGuideId(null); setSelectedGuide(null); }
      };

      return (
        <div className="flex flex-col gap-4 p-5 max-w-4xl mx-auto">
          <h2 className="font-serif text-lg text-on-surface">Build Guides</h2>
          <GuideImportBar onImport={handleImport} />
          <GuideList guides={guides} selectedId={selectedGuideId} onSelect={handleSelect} onDelete={handleDelete} />
          {selectedGuide && <GuideDetail guide={selectedGuide} charData={charData} />}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Dashboard (root)
    // -----------------------------------------------------------------------
    function Dashboard() {
      const [charData, setCharData] = useState(null);
      const [account, setAccount] = useState("");
      const [character, setCharacter] = useState("");
      const [insights, setInsights] = useState(null);
      const [efficiency, setEfficiency] = useState(null);
      const [improvement, setImprovement] = useState(null);
      const [comparison, setComparison] = useState(null);
      const [whyInsights, setWhyInsights] = useState(null);
      const [activeTab, setActiveTab] = useState("BUILD");
      const [settings, setSettings] = useState({});
      const [status, setStatus] = useState({});
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [analysisLoading, setAnalysisLoading] = useState(false);

      // Fetch analysis data when charData changes
      useEffect(() => {
        if (!charData || !account || !character) return;
        setAnalysisLoading(true);
        setInsights(null);
        setEfficiency(null);
        setImprovement(null);
        setComparison(null);
        setWhyInsights(null);

        const body = { account, character };

        Promise.all([
          api("/api/character/build-insights", "POST", body),
          api("/api/character/improvement-package", "POST", body),
          api("/api/character/build-compare", "POST", body),
          api("/api/character/build-efficiency", "POST", body),
        ]).then(([ins, imp, comp, eff]) => {
          if (!ins.error) setInsights(ins);
          if (!imp.error) setImprovement(imp);
          if (!comp.error) setComparison(comp);
          if (!eff.error) setEfficiency(eff);
          setAnalysisLoading(false);
        }).catch(() => setAnalysisLoading(false));

        api("/api/character/why-insights", "POST", body).then(why => {
          if (why && !why.error) {
            console.log("[LAMA] Why-insights received:", Object.keys(why).map(k => `${k}:${Array.isArray(why[k]) ? why[k].length : Object.keys(why[k] || {}).length}`).join(", "));
            setWhyInsights(why);
          } else {
            console.warn("[LAMA] Why-insights failed:", why?.error || "empty response");
          }
        }).catch(e => console.warn("[LAMA] Why-insights error:", e));
      }, [charData, account, character]);

      // Character lookup handler
      const handleLookup = useCallback(async (acct, charName, prefetchedData) => {
        const data = prefetchedData || await api("/api/character/lookup", "POST", { account: acct, character: charName });
        if (data.error) return data;
        setAccount(acct || data.account || "");
        setCharacter(charName || data.name || "");
        setCharData({ ...data, _account: acct || data.account || "" });
        setSettingsOpen(false);
        return data;
      }, []);

      // WebSocket handler
      const handleWsMessage = useCallback((msg) => {
        switch (msg.type) {
          case "init":
            setStatus({ state: msg.state, uptime: msg.uptime, stats: msg.stats, version: msg.version });
            if (msg.settings) setSettings(msg.settings);
            break;
          case "settings":
            if (msg.settings) setSettings(msg.settings);
            break;
          case "state_change":
            setStatus(prev => ({ ...prev, state: msg.state }));
            break;
          case "log":
            break;
        }
      }, []);

      const { connected } = useDashboardSocket(WS_URL, handleWsMessage);

      const tabContent = useMemo(() => {
        switch (activeTab) {
          case "BUILD":
            return <PulseTab charData={charData} insights={insights} improvement={improvement} comparison={comparison} whyInsights={whyInsights} onLookup={handleLookup} />;
          case "GEAR":
            return <GearTab charData={charData} insights={insights} account={account} />;
          case "MARKET":
            return <MarketTab charData={charData} efficiency={efficiency} whyInsights={whyInsights} />;
          case "GUIDE":
            return <GuideTab charData={charData} />;
          default:
            return null;
        }
      }, [activeTab, charData, insights, improvement, comparison, efficiency, whyInsights, account]);

      return (
        <div className="flex flex-col h-full">
          <NavBar onSettingsClick={() => setSettingsOpen(true)} />
          <Sidebar
            activeTab={activeTab}
            onTabChange={setActiveTab}
            charData={charData}
            hasCharacter={!!charData}
            onSettingsClick={() => setSettingsOpen(true)}
          />

          {/* Main content area — offset for navbar + sidebar */}
          <div className="flex-1 overflow-y-auto" style={{ marginLeft: "256px", paddingTop: "80px" }}>
            {tabContent}
          </div>

          {/* Connection indicator */}
          <div className="fixed bottom-3 left-[268px] flex items-center gap-1.5 z-40">
            <span className={`w-1.5 h-1.5 rounded-full ${connected ? "bg-green-400" : "bg-red-400"}`} />
            <span className="text-xs font-sans text-outline">{connected ? "Connected" : "Disconnected"}</span>
          </div>

          {/* Settings Panel */}
          <SettingsPanel
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            settings={settings}
            setSettings={setSettings}
            status={status}
            onLookup={handleLookup}
            charData={charData}
          />
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Mount
    // -----------------------------------------------------------------------
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
