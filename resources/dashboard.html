  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // -----------------------------------------------------------------------
    // Config
    // -----------------------------------------------------------------------
    const API_BASE = window.location.origin;
    const WS_URL = `ws://${window.location.host}/ws`;

    // -----------------------------------------------------------------------
    // Slot icon mapping
    // -----------------------------------------------------------------------
    const SLOT_ICONS = {
      Helm: "head_mounted_device",
      BodyArmour: "shield",
      Gloves: "back_hand",
      Boots: "do_not_step",
      Weapon: "swords",
      Weapon2: "swords",
      Offhand: "security",
      Offhand2: "security",
      Belt: "horizontal_rule",
      Amulet: "diamond",
      Ring: "circle",
      Ring2: "circle",
      Flask: "syringe",
      Flask2: "syringe",
    };

    function slotIcon(slot) {
      return SLOT_ICONS[slot] || "help_outline";
    }

    // -----------------------------------------------------------------------
    // API helper
    // -----------------------------------------------------------------------
    async function api(path, method = "GET", body = null) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      try {
        const res = await fetch(`${API_BASE}${path}`, opts);
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch { data = { raw }; }
        if (!res.ok) {
          let msg = data?.error || `HTTP ${res.status}`;
          if (!data?.error && Array.isArray(data?.detail)) {
            msg = data.detail.map(d => d.msg || JSON.stringify(d)).join("; ");
          } else if (!data?.error && typeof data?.detail === "string") {
            msg = data.detail;
          }
          return { error: msg, ...data };
        }
        return data;
      } catch (e) {
        return { error: e.message };
      }
    }

    // -----------------------------------------------------------------------
    // WebSocket hook
    // -----------------------------------------------------------------------
    function useDashboardSocket(url, onMessage) {
      const wsRef = useRef(null);
      const [connected, setConnected] = useState(false);
      const reconnectRef = useRef(null);
      const disconnectTimerRef = useRef(null);
      const onMessageRef = useRef(onMessage);
      onMessageRef.current = onMessage;

      const connect = useCallback(() => {
        if (wsRef.current?.readyState === WebSocket.OPEN) return;
        const ws = new WebSocket(url);
        wsRef.current = ws;
        ws.onopen = () => {
          if (disconnectTimerRef.current) { clearTimeout(disconnectTimerRef.current); disconnectTimerRef.current = null; }
          setConnected(true);
          if (reconnectRef.current) { clearTimeout(reconnectRef.current); reconnectRef.current = null; }
        };
        ws.onmessage = (evt) => { try { onMessageRef.current(JSON.parse(evt.data)); } catch (e) { console.error("WS parse:", e); } };
        ws.onclose = () => {
          if (!disconnectTimerRef.current) {
            disconnectTimerRef.current = setTimeout(() => { setConnected(false); disconnectTimerRef.current = null; }, 800);
          }
          reconnectRef.current = setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();
      }, [url]);

      useEffect(() => { connect(); return () => { wsRef.current?.close(); if (reconnectRef.current) clearTimeout(reconnectRef.current); if (disconnectTimerRef.current) clearTimeout(disconnectTimerRef.current); }; }, [connect]);
      return { connected };
    }

    // -----------------------------------------------------------------------
    // Icon component
    // -----------------------------------------------------------------------
    function Icon({ name, className = "" }) {
      return <span className={`material-symbols-outlined ${className}`}>{name}</span>;

    // -----------------------------------------------------------------------
    // WhyBadge — inline explanation component
    // -----------------------------------------------------------------------
    const SEV_COLORS = {
      critical: "border-red-500/50 bg-red-500/10 text-red-300",
      warning: "border-yellow-500/50 bg-yellow-500/10 text-yellow-200",
      positive: "border-green-500/50 bg-green-500/10 text-green-300",
      info: "border-outline-variant bg-surface-container text-on-surface-variant",
    };
    const SEV_ICONS = { critical: "error", warning: "warning", positive: "check_circle", info: "info" };


    // -----------------------------------------------------------------------

    // -----------------------------------------------------------------------
    const STATUS_BG = {
      critical: "bg-red-500/15 border-red-500/40 text-red-300",
      warning: "bg-yellow-500/15 border-yellow-500/40 text-yellow-200",
      positive: "bg-green-500/15 border-green-500/40 text-green-300",
      info: "bg-surface-container border-outline-variant text-on-surface-variant",
    };


    // -----------------------------------------------------------------------
    // InsightGroupCard — collapsible group of related explanations
    // -----------------------------------------------------------------------

    // -----------------------------------------------------------------------
    // Window API
    // -----------------------------------------------------------------------
    const getWindowApi = () => window.pywebview?.api;

    // -----------------------------------------------------------------------
    // NavBar (replaces TopBar) — fixed top, full width
    // -----------------------------------------------------------------------
    function NavBar({ onSettingsClick }) {
      return (

    // Settings Panel
    // -----------------------------------------------------------------------
    function SettingsPanel({ open, onClose, settings, setSettings, status, onLookup, charData }) {
      const [query, setQuery] = useState("");
      const [savedChars, setSavedChars] = useState([]);
      const [leagues, setLeagues] = useState([]);
      const [lookupLoading, setLookupLoading] = useState(false);
      const [lookupError, setLookupError] = useState("");
      const [suggestions, setSuggestions] = useState([]);
      const [scanFps, setScanFps] = useState(settings?.scan_fps || 2);
      const [detectionCooldown, setDetectionCooldown] = useState(settings?.detection_cooldown || 3);
      const [overlayMode, setOverlayMode] = useState(settings?.overlay_mode || "standard");

      useEffect(() => {
        if (!open) return;
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
        api("/api/leagues").then(data => { if (data.leagues) setLeagues(data.leagues); });
      }, [open]);

      useEffect(() => {
        setScanFps(settings?.scan_fps || 2);
        setDetectionCooldown(settings?.detection_cooldown || 3);
        setOverlayMode(settings?.overlay_mode || "standard");
      }, [settings]);

      const filteredSaved = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("poe.ninja")) return [];
        const matches = [];
        for (const grp of savedChars) {
          for (const ch of (grp.characters || [])) {
            const acct = grp.accountName || "";
            if (ch.name.toLowerCase().includes(q) || acct.toLowerCase().includes(q)) {
              matches.push({ account: acct, name: ch.name, class: ch.class, level: ch.level });
            }
          }
        }
        return matches;
      }, [query, savedChars]);

      const handleSmartLookup = async (overrideQuery) => {
        const q = (overrideQuery || query).trim();
        if (!q) return;
        setLookupLoading(true);
        setLookupError("");
        setSuggestions([]);
        const data = await api("/api/character/smart-lookup", "POST", { query: q });
        setLookupLoading(false);
        if (data.suggestions) {
          setSuggestions(data.suggestions);
          setLookupError(data.error || "Multiple matches — pick one:");
        } else if (data.error) {
          setLookupError(data.error);
        } else {
          setLookupError("");
          const acct = data.account || "";
          onLookup(acct, data.name, data);
          api("/api/character/saved").then(d => { if (Array.isArray(d)) setSavedChars(d); });
        }
      };

      const handleSuggestionClick = async (acct, charName) => {
        setQuery(charName);
        setSuggestions([]);
        setLookupLoading(true);
        setLookupError("");
        const result = await onLookup(acct, charName);
        setLookupLoading(false);
        if (result?.error) setLookupError(result.error);
      };

      const handleSavedClick = async (acct, charName) => {
        setQuery(charName);
        setLookupLoading(true);
        setLookupError("");
        setSuggestions([]);
        const result = await onLookup(acct, charName);
        setLookupLoading(false);
        if (result?.error) setLookupError(result.error);
      };

      const handleDeleteSaved = async (acct, charName) => {
        await api("/api/character/delete", "POST", { account: acct, character: charName });
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
      };

      const saveSettings = async () => {
        const newSettings = { ...settings, scan_fps: scanFps, detection_cooldown: detectionCooldown, overlay_mode: overlayMode };
        await api("/api/settings", "POST", newSettings);
        setSettings(newSettings);
      };

      const handleOverlayAction = async (action) => {
        await api(`/api/overlay/${action}`, "POST");
      };

      if (!open) return null;

      return (
        <div className="fixed inset-0 z-[60]" onClick={onClose}>

          <div

            style={{ animation: "slideIn 0.2s ease" }}
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-5 py-4 border-b border-outline-variant">
              <h2 className="font-serif text-lg text-primary-container">Settings</h2>
              <button onClick={onClose} className="p-2 hover:bg-surface-container text-on-surface-variant hover:text-on-surface transition-colors" title="Close settings">

            </div>

            {/* Character Lookup */}
            <div className="p-5 border-b border-outline-variant">
              <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">CHARACTER LOOKUP</h3>
              <input
                value={query}
                onChange={e => { setQuery(e.target.value); setSuggestions([]); setLookupError(""); }}
                placeholder="Name, account/character, or poe.ninja URL"
                className="w-full px-3 py-2 mb-2 bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-sans focus:border-primary-container"
                onKeyDown={e => { if (e.key === "Enter") handleSmartLookup(); }}
              />
              {filteredSaved.length > 0 && !lookupLoading && (
                <div className="mb-2 border border-outline-variant bg-surface-container overflow-hidden">
                  {filteredSaved.slice(0, 5).map((m, i) => (
                    <div
                      key={i}
                      onClick={() => handleSavedClick(m.account, m.name)}
                      className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border-b border-outline-variant last:border-0"
                    >
                      <span className="text-sm text-on-surface font-sans">{m.name}</span>
                      <span className="text-xs text-on-surface-variant">Lv{m.level} {m.class}</span>
                    </div>
                  ))}
                </div>
              )}
              <button
                onClick={() => handleSmartLookup()}
                disabled={lookupLoading || !query.trim()}
                className="w-full py-2 bg-primary-container text-on-primary text-sm font-sans font-semibold hover:bg-primary transition-colors disabled:opacity-70"
              >
                {lookupLoading ? "Looking up..." : "Look Up"}
              </button>
              {lookupError && <p className="mt-2 text-xs text-error">{lookupError}</p>}
              {suggestions.length > 0 && (
                <div className="mt-2 border border-outline-variant bg-surface-container overflow-hidden">
                  {suggestions.map((s, i) => (
                    <div
                      key={i}
                      onClick={() => handleSuggestionClick(s.account, s.name)}
                      className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border-b border-outline-variant last:border-0"
                    >
                      <div>
                        <span className="text-sm text-on-surface font-sans">{s.name}</span>

                      </div>

                <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">SAVED CHARACTERS</h3>
                <div className="flex flex-col gap-2">
                  {savedChars.map((acctGroup, i) => (

                      <div className="text-xs text-outline mb-1 font-sans">{acctGroup.accountName}</div>
                      {(acctGroup.characters || []).map((ch, j) => (

                            <span className="text-sm text-on-surface font-sans">{ch.name}</span>
                            <span className="ml-2 text-xs text-on-surface-variant">Lv{ch.level} {ch.class}</span>
                          </div>
                          <button
                            onClick={(e) => { e.stopPropagation(); handleDeleteSaved(acctGroup.accountName, ch.name); }}
                            className="p-1 text-outline hover:text-error transition-colors"
                          >
                            <Icon name="close" className="text-base" />
                          </button>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Overlay Controls */}
            <div className="p-5 border-b border-outline-variant">
              <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">OVERLAY</h3>
              <div className="flex items-center gap-2 mb-3">
                <button onClick={() => handleOverlayAction("start")} className="flex-1 py-2 bg-surface-container border border-outline-variant text-xs font-sans text-on-surface-variant hover:border-primary-container hover:text-on-surface transition-colors">Start</button>
                <button onClick={() => handleOverlayAction("stop")} className="flex-1 py-2 bg-surface-container border border-outline-variant text-xs font-sans text-on-surface-variant hover:border-secondary hover:text-on-surface transition-colors">Stop</button>
                <button onClick={() => handleOverlayAction("restart")} className="flex-1 py-2 bg-surface-container border border-outline-variant text-xs font-sans text-on-surface-variant hover:border-tertiary hover:text-on-surface transition-colors">Restart</button>
              </div>
              {status?.state && (
                <div className="flex items-center gap-2 mb-3">
                  <span className={`w-2 h-2 rounded-full ${status.state === "running" ? "bg-green-400" : status.state === "stopped" ? "bg-red-400" : "bg-yellow-400"}`} />
                  <span className="text-xs font-sans text-on-surface-variant capitalize">{status.state}</span>
                </div>
              )}
              <label className="block text-xs font-sans text-on-surface-variant mb-1">Mode</label>
              <select
                value={overlayMode}
                onChange={e => setOverlayMode(e.target.value)}
                className="w-full px-3 py-2 mb-3 bg-surface-container border border-outline-variant text-sm text-on-surface font-sans focus:border-primary-container"
              >
                <option value="stars_only">Stars Only</option>
                <option value="minimal">Minimal</option>
                <option value="standard">Standard</option>
                <option value="detailed">Detailed</option>
              </select>
            </div>

            {/* League Selector */}
            {leagues.length > 0 && (
              <div className="p-5 border-b border-outline-variant">
                <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">LEAGUE</h3>
                <select
                  value={settings?.league || ""}
                  onChange={e => setSettings({ ...settings, league: e.target.value })}
                  className="w-full px-3 py-2 bg-surface-container border border-outline-variant text-sm text-on-surface font-sans focus:border-primary-container"

                  {leagues.map(l => typeof l === "string"
                    ? <option key={l} value={l}>{l}</option>
                    : <option key={l.value} value={l.value}>{l.label || l.value}</option>
                  )}
                </select>
              </div>
            )}

            {/* Detection Settings */}
            <div className="p-5 border-b border-outline-variant">

              <label className="flex items-center justify-between text-xs font-sans text-on-surface-variant mb-1">

                <span className="text-on-surface">{scanFps}</span>

                value={scanFps}
                onChange={e => setScanFps(Number(e.target.value))}
                className="w-full mb-4 accent-primary-container"
              />
              <label className="flex items-center justify-between text-xs font-sans text-on-surface-variant mb-1">

                onChange={e => setDetectionCooldown(Number(e.target.value))}
                className="w-full mb-4 accent-primary-container"

              <button

                className="w-full py-2 bg-surface-container border border-primary-container text-xs font-sans text-primary-container hover:bg-primary-container hover:text-on-primary transition-colors"

    function InlineCharacterLookup({ onLookup }) {
      const [query, setQuery] = useState("");
      const [savedChars, setSavedChars] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      useEffect(() => {
        api("/api/character/saved").then(data => { if (Array.isArray(data)) setSavedChars(data); });
      }, []);

      const filteredSaved = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("poe.ninja")) return [];
        const matches = [];
        for (const grp of savedChars) {
          for (const ch of (grp.characters || [])) {
            const acct = grp.accountName || "";
            if (ch.name.toLowerCase().includes(q) || acct.toLowerCase().includes(q)) {
              matches.push({ account: acct, name: ch.name, class: ch.class, level: ch.level });
            }
          }
        }
        return matches;
      }, [query, savedChars]);

      const handleSmartLookup = async (overrideQuery) => {
        const q = (overrideQuery || query).trim();
        if (!q) return;
        setLoading(true);
        setError("");
        setSuggestions([]);
        const data = await api("/api/character/smart-lookup", "POST", { query: q });
        setLoading(false);
        if (data.suggestions) {
          setSuggestions(data.suggestions);
          setError(data.error || "Multiple matches — pick one:");
        } else if (data.error) {
          setError(data.error);
        } else {
          setError("");
          const acct = data.account || "";
          onLookup(acct, data.name, data);
        }
      };

      const handleSuggestionClick = async (acct, charName) => {
        setQuery(charName);
        setSuggestions([]);
        setLoading(true);
        setError("");
        const result = await onLookup(acct, charName);
        setLoading(false);
        if (result?.error) setError(result.error);
      };

      const handleSavedClick = async (acct, charName) => {
        setQuery(charName);
        setLoading(true);
        setError("");
        setSuggestions([]);
        const result = await onLookup(acct, charName);
        setLoading(false);
        if (result?.error) setError(result.error);
      };

      return (
        <div className="flex flex-col items-center h-full overflow-y-auto gap-6 px-8 py-8">

            <h2 className="font-serif text-xl text-on-surface mb-1 text-center">Welcome to LAMA</h2>
            <p className="text-on-surface-variant font-sans text-sm mb-6 text-center">
              Look up your character to begin build analysis
            </p>

            <input
              value={query}
              onChange={e => { setQuery(e.target.value); setSuggestions([]); setError(""); }}
              placeholder="Name, account/character, or poe.ninja URL"
              className="w-full px-3 py-2 mb-2 bg-surface-container border border-outline-variant text-sm text-on-surface placeholder-outline font-sans focus:border-primary-container focus:outline-none"
              onKeyDown={e => { if (e.key === "Enter") handleSmartLookup(); }}
            />
            {filteredSaved.length > 0 && !loading && (
              <div className="mb-2 border border-outline-variant bg-surface-container overflow-hidden">
                {filteredSaved.slice(0, 5).map((m, i) => (
                  <div
                    key={i}
                    onClick={() => handleSavedClick(m.account, m.name)}
                    className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border-b border-outline-variant last:border-0"
                  >
                    <span className="text-sm text-on-surface font-sans">{m.name}</span>
                    <span className="text-xs text-on-surface-variant">Lv{m.level} {m.class}</span>
                  </div>
                ))}
              </div>
            )}
            <button
              onClick={() => handleSmartLookup()}
              disabled={loading || !query.trim()}
              className="w-full py-3 bg-primary-container text-on-primary text-sm font-sans font-semibold hover:bg-primary transition-colors disabled:opacity-70"
            >
              {loading ? "Looking up..." : "Look Up Character"}
            </button>
            {error && <p className="mt-2 text-xs text-error font-sans">{error}</p>}
            {suggestions.length > 0 && (
              <div className="mt-2 border border-outline-variant bg-surface-container overflow-hidden">
                {suggestions.map((s, i) => (
                  <div
                    key={i}
                    onClick={() => handleSuggestionClick(s.account, s.name)}
                    className="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-surface-container-lowest transition-colors border-b border-outline-variant last:border-0"
                  >
                    <div>
                      <span className="text-sm text-on-surface font-sans">{s.name}</span>
                      <span className="ml-2 text-xs text-outline font-sans">{s.account}</span>
                    </div>
                    <span className="text-xs text-on-surface-variant">Lv{s.level} {s.class}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {savedChars.length > 0 && !query.trim() && (
            <div className="w-full max-w-sm">
              <h3 className="text-xs font-sans tracking-widest text-on-surface-variant mb-3 uppercase">SAVED CHARACTERS</h3>
              <div className="flex flex-col gap-2">
                {savedChars.map((acctGroup, i) => (
                  <div key={i}>
                    <div className="text-xs text-outline mb-1 font-sans">{acctGroup.accountName}</div>
                    {(acctGroup.characters || []).map((ch, j) => (
                      <div
                        key={j}
                        onClick={() => handleSavedClick(acctGroup.accountName, ch.name)}
                        className="flex items-center justify-between px-3 py-2 bg-surface-container border border-outline-variant cursor-pointer hover:border-primary-container transition-colors"
                      >
                        <span className="text-sm text-on-surface font-sans">{ch.name}</span>
                        <span className="text-xs text-on-surface-variant">Lv{ch.level} {ch.class}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }


    // -- Build Diff View (Stitch Prompt 5) ----------------------------------

    function BuildDiffView({ result }) {
      const r = result;
      const player = r.player || {};
      const target = r.target || {};
      const diffs = r.diffs || [];
      const shoppingList = r.shoppingList || [];

      // Cost summary from priced items
      const pricedItems = shoppingList.filter(i => i.price);
      const unpricedItems = shoppingList.filter(i => !i.price && i.dpsDiffPct > 0);

      // Group diffs by category
      const grouped = useMemo(() => {
        const groups = {};
        for (const d of diffs) {
          const cat = d.category || "other";
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(d);
        }
        return groups;
      }, [diffs]);

      const catMeta = {
        dps: { label: "DPS", icon: "bolt", order: 0 },
        survival: { label: "Survival", icon: "shield", order: 1 },
        gear: { label: "Gear", icon: "inventory_2", order: 2 },
        keystones: { label: "Keystones", icon: "key", order: 3 },
        jewels: { label: "Jewels", icon: "diamond", order: 4 },
        supports: { label: "Supports", icon: "link", order: 5 },
        other: { label: "Other", icon: "more_horiz", order: 6 },
      };

      const sortedCats = Object.keys(grouped).sort((a, b) => (catMeta[a]?.order ?? 9) - (catMeta[b]?.order ?? 9));
      const critCount = diffs.filter(d => d.severity === "critical").length;
      const warnCount = diffs.filter(d => d.severity === "warning").length;

      return (
        <div>
          {/* Header: player vs target — compact */}
          <div className="border-l-2 border-tertiary p-3 bg-surface-container-low mb-3">
            <div className="flex items-center gap-2 text-xs mb-1">
              <span className="text-on-surface font-bold">{player.name}</span>
              <Icon name="compare_arrows" className="text-tertiary text-sm" />
              <span className="text-tertiary font-bold">{target.name}</span>
            </div>
            <div className="flex items-center gap-2 text-[10px] text-outline">
              <span>{r.player_dps} vs {r.target_dps} DPS</span>
              {critCount > 0 && <span className="text-error">{critCount} critical</span>}
              {warnCount > 0 && <span className="text-secondary">{warnCount} warnings</span>}
            </div>
          </div>

          {/* Shopping List — gear upgrades sorted by bang-for-buck */}
          {shoppingList.length > 0 && (
            <div className="mb-6">

                </span>
                <p className="font-label text-[11px] text-outline uppercase tracking-widest">
                  {shoppingList.length} gear upgrade{shoppingList.length !== 1 ? "s" : ""} sorted by impact
                  {pricedItems.length > 0 && (
                    <span className="text-primary-container ml-2">| {pricedItems.length} priced</span>
                  )}
                  {unpricedItems.length > 0 && (
                    <span className="text-on-surface-variant ml-2">| {unpricedItems.length} check trade</span>
                  )}
                </p>
              </div>

              {/* Budget summary — cheapest upgrade path */}
              {pricedItems.length > 0 && (() => {
                // Sort by bang-for-buck (DPS per divine)
                const withValue = pricedItems.filter(i => i.priceValue > 0);
                const bangForBuck = [...withValue].sort((a, b) => (b.dpsDiffPct / (b.priceValue || 1)) - (a.dpsDiffPct / (a.priceValue || 1)));
                const cheapest = [...withValue].sort((a, b) => (a.priceValue || 999) - (b.priceValue || 999));
                return (
                  <div className="grid grid-cols-2 gap-3 mb-4">
                    <div className="bg-surface-container-lowest p-4 border-l-2 border-primary-container/40">
                      <span className="font-label text-[10px] text-primary-container uppercase tracking-widest block mb-2">Best Bang for Buck</span>
                      {bangForBuck.slice(0, 3).map((item, i) => (

                        </div>
                      ))}
                    </div>
                    <div className="bg-surface-container-lowest p-4 border-l-2 border-tertiary/40">
                      <span className="font-label text-[10px] text-tertiary uppercase tracking-widest block mb-2">Cheapest First</span>
                      {cheapest.slice(0, 3).map((item, i) => (
                        <div key={i} className="flex justify-between text-xs py-0.5">
                          <span className="font-body text-on-surface-variant">{item.slot}: {item.targetItem}</span>
                          <span className="font-label text-tertiary">{item.price} <span className="text-secondary ml-1">+{item.dpsDiffPct}%</span></span>
                        </div>
                      ))}
                    </div>
                  </div>

              })()}

              <div className="space-y-2">
                {shoppingList.map((item, i) => {
                  const sevColor = { critical: "border-error", warning: "border-secondary", info: "border-outline-variant" }[item.severity] || "border-outline-variant";

                      <div className="w-8 text-center shrink-0">

                          <div className="flex items-center gap-2">

                              <span className="px-2 py-0.5 bg-primary-container/10 border border-primary-container/20 text-primary-container font-label text-[10px] font-bold uppercase">
                                {item.price}
                              </span>

                            <span className="px-2 py-0.5 bg-secondary/10 border border-secondary/20 text-secondary font-label text-[10px] font-bold uppercase">
                              +{item.dpsDiffPct}% DPS

                          </div>
                        </div>
                        <div className="text-xs font-body text-on-surface-variant mb-1">
                          <span className="text-error line-through mr-2">{item.currentItem}</span>
                          <Icon name="arrow_forward" className="text-[10px] text-outline mx-1 align-middle" />
                          <span className="text-tertiary ml-2">{item.targetItem}</span>
                          {item.targetRarity && <span className="ml-1 text-outline">({item.targetRarity})</span>}
                          {!item.price && item.targetRarity !== "Unique" && (
                            <span className="ml-2 text-[10px] text-outline italic">search trade for price</span>
                          )}
                        </div>
                        {item.keyMods.length > 0 && (
                          <div className="flex gap-1.5 flex-wrap mt-1">
                            <span className="text-[10px] font-label text-outline uppercase tracking-wider">Look for:</span>
                            {item.keyMods.map((mod, j) => (
                              <span key={j} className="text-[10px] font-label text-tertiary bg-tertiary/5 px-1.5 py-0.5 border border-tertiary/15">{mod}</span>
                            ))}
                          </div>
                        )}
                        {item.searchTips.length > 0 && (
                          <div className="mt-2">
                            {item.searchTips.map((tip, j) => (
                              <p key={j} className="text-xs font-body text-on-surface-variant leading-relaxed">
                                <Icon name="search" className="text-[10px] text-tertiary mr-1 align-middle" />
                                {tip}
                              </p>
                            ))}
                          </div>
                        )}

                        {/* Alternative items top players use */}
                        {item.alternatives?.length > 0 && (
                          <div className="mt-3 pt-2 border-t border-outline-variant/15">
                            <span className="font-label text-[10px] text-outline uppercase tracking-widest block mb-2">
                              <Icon name="storefront" className="text-xs mr-1 align-middle" />
                              What top players use in this slot
                            </span>
                            <div className="space-y-1">
                              {item.alternatives.map((alt, j) => (
                                <div key={j} className="flex items-center justify-between py-1 px-2 bg-surface-container-lowest">
                                  <div className="flex items-center gap-2 flex-1 min-w-0">
                                    <span className={`text-xs font-body truncate ${alt.rarity === "unique" ? "text-secondary" : "text-on-surface"}`}>
                                      {alt.name}
                                    </span>
                                    <span className="text-[9px] font-label text-outline uppercase shrink-0">{alt.rarity}</span>
                                  </div>
                                  <div className="flex items-center gap-2 shrink-0">
                                    <span className="text-[10px] font-label text-on-surface-variant">{alt.usage.toFixed(0)}% use</span>
                                    {alt.price ? (
                                      <span className="text-[10px] font-label text-primary-container font-bold bg-primary-container/10 px-1.5 py-0.5">
                                        {alt.price}
                                      </span>
                                    ) : (
                                      <span className="text-[9px] text-outline italic">check trade</span>
                                    )}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Category sections */}
          <div className="flex flex-col gap-5">
            {sortedCats.map(cat => {
              const meta = catMeta[cat] || catMeta.other;
              const items = grouped[cat];
              return (
                <div key={cat}>
                  {/* Category header */}
                  <div className="flex items-center gap-2 mb-3">
                    <Icon name={meta.icon} className="text-sm text-on-surface-variant" />
                    <span className="font-label text-[11px] text-outline uppercase tracking-widest">{meta.label}</span>
                    <span className="text-[10px] text-outline/60">({items.length})</span>
                    <div className="flex-1 h-px bg-outline-variant/20" />

                    {items.map((d, i) => (
                      <DiffCard key={i} diff={d} />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Classify a mod as beneficial, neutral, or wasted for a build
    function classifyMod(modText, archetype) {
      if (!modText || !archetype) return { benefit: "neutral", reason: "" };
      const ml = modText.toLowerCase();
      const dmgType = archetype.damageType || archetype.damage_type || "";
      const defType = archetype.defenseType || archetype.defense_type || "";
      const isCrit = archetype.isCrit || archetype.is_crit || archetype.isCoc || archetype.is_coc;
      const isSpell = dmgType === "spell";
      const isAttack = dmgType === "attack";
      const isMinion = dmgType === "minion";

      if (isSpell) {
        if (/spell.*damage|cast speed|gem level|level of all.*spell|level of all.*skill/.test(ml))
          return { benefit: "green", reason: "Scales your spell damage directly" };
        if (/as extra.*damage|elemental damage|cold damage|fire damage|lightning damage/.test(ml))
          return { benefit: "green", reason: "Adds elemental damage scaling" };
      }
      if (isAttack) {
        if (/attack speed|physical damage|added.*damage to attack|melee damage/.test(ml))
          return { benefit: "green", reason: "Scales your attack damage directly" };
      }
      if (isCrit && /critical.*hit.*chance|critical.*damage|critical.*multiplier/.test(ml))
        return { benefit: "green", reason: "Scales your crit damage" };
      if (/maximum life/.test(ml) && (defType === "life" || defType === "hybrid"))
        return { benefit: "green", reason: "Increases your life pool" };
      if (/energy shield|maximum energy shield/.test(ml) && (defType === "es" || defType === "hybrid"))
        return { benefit: "green", reason: "Increases your ES pool" };
      if (/resist/.test(ml))
        return { benefit: "green", reason: "Helps cap resistances" };
      if (/movement speed/.test(ml))
        return { benefit: "green", reason: "Faster movement = better clear" };
      if (/spirit/.test(ml))
        return { benefit: "green", reason: "Enables more skill reservations" };

      if (isSpell && /attack speed|local.*physical|added.*damage to attack/.test(ml))
        return { benefit: "red", reason: "Attack mod on a spell build — wasted",
          replace: "Replace with: % spell damage, % cast speed, or +gem levels" };
      if (isAttack && /spell.*damage|cast speed/.test(ml))
        return { benefit: "red", reason: "Spell mod on an attack build — wasted",
          replace: "Replace with: % attack speed, flat physical damage, or % elemental damage" };
      if (!isCrit && /critical.*hit.*chance|critical.*multiplier/.test(ml))
        return { benefit: "red", reason: "Crit mod on a non-crit build — wasted",
          replace: "Replace with: % increased damage, flat damage, or defensive mod" };
      if (defType === "es" && /maximum life/.test(ml) && /armour|evasion/.test(ml))
        return { benefit: "red", reason: "Life/armour mod on an ES build",
          replace: "Replace with: +ES, % increased ES, or ES recharge" };

      if (/mana.*regeneration/.test(ml) && defType !== "mom")
        return { benefit: "neutral", reason: "Mana regen — minor utility for this build",
          replace: isSpell ? "Could be: % spell damage, cast speed, or resistance" : "Could be: attack speed, flat damage, or resistance" };
      if (/maximum mana/.test(ml) && defType !== "mom")
        return { benefit: "neutral", reason: "Mana pool — minor utility unless using Mind Over Matter",
          replace: defType === "life" ? "Better as: +maximum life, resistance, or damage mod" : "Better as: +ES, resistance, or damage mod" };
      if (/item rarity|item quantity/.test(ml))
        return { benefit: "neutral", reason: "Magic find — doesn't help in combat",
          replace: "Could be a damage or survivability mod instead" };
      if (/light radius|stun/.test(ml))
        return { benefit: "neutral", reason: "Minor utility — low impact",
          replace: isSpell ? "Better as: spell damage, cast speed, or resistance" : "Better as: damage, attack speed, or resistance" };
      if (/intelligence|dexterity|strength/.test(ml) && !/damage/.test(ml))

    // Plain-language tier explanation

      if (!tierNum || !tierCount) return null;
      const pct = Math.round(((tierCount - tierNum + 1) / tierCount) * 100);

      if (tierNum === 1) {
        return { text: "Best possible roll (Tier 1). This is the highest value this mod can roll.", severity: "positive" };
      }
      if (tierNum <= 2) {
        return { text: `Near-perfect roll (Tier ${tierNum} of ${tierCount}). Only ${tierNum - 1} tier${tierNum > 2 ? "s" : ""} higher exist.`, severity: "positive" };
      }
      if (tierNum <= Math.ceil(tierCount / 2)) {
        const nextRange = tierRange || "";
        return {
          text: `Mid-tier roll (Tier ${tierNum} of ${tierCount}). Higher tiers exist with better values${nextRange ? ` — next tier rolls ${nextRange}` : ""}. Search player trade for an upgrade.`,
          severity: "warning"

      }
      return {
        text: `Low roll (Tier ${tierNum} of ${tierCount}). Significantly better versions of this mod exist. Look for Tier 1-${Math.ceil(tierCount / 3)} on trade — the difference is substantial.`,
        severity: "critical"

      });

        fetch(`${base}/data.json`).then(r => r.json()),
        fetch(`${base}/assets/skills.json`).then(r => r.json()),
        fetch(`${base}/assets/skills-disabled.json`).then(r => r.json()),
        fetch(`${base}/assets/frame.json`).then(r => r.json()),
        fetch(`${base}/assets/line.json`).then(r => r.json()),
        loadImg(`${base}/assets/skills.webp`),
        loadImg(`${base}/assets/skills-disabled.webp`),
        loadImg(`${base}/assets/frame.webp`),

    function CoachPanel({ account, character }) {
      const [text, setText] = useState("");
      const [model, setModel] = useState("phi4");
      const [phase, setPhase] = useState("loading"); // loading | streaming | done | error | unavailable
      const [error, setError] = useState("");

      useEffect(() => {
        if (!account || !character) return;
        let cancelled = false;
        setText(""); setError(""); setPhase("loading");
        (async () => {
          try {
            const res = await fetch(`${API_BASE}/api/character/coach-stream`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ account, character }),
            });
            if (cancelled) return;
            if (res.status === 503) {
              const d = await res.json().catch(() => ({}));
              setError(d.error || "Local AI coach unavailable."); setPhase("unavailable"); return;
            }
            if (!res.ok || !res.body) {
              const d = await res.json().catch(() => ({}));
              setError(d.error || "Coach failed."); setPhase("error"); return;
            }
            setModel(res.headers.get("X-Coach-Model") || "phi4");
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let acc = "";
            setPhase("streaming");
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              if (cancelled) { try { reader.cancel(); } catch (e) {} return; }
              acc += dec.decode(value, { stream: true });
              setText(acc);
            }
            if (cancelled) return;
            if (acc.trim()) setPhase("done");
            else { setError("Coach returned nothing — try reopening."); setPhase("error"); }
          } catch (e) {
            if (!cancelled) { setError("Coach failed to respond."); setPhase("error"); }
          }
        })();
        return () => { cancelled = true; };
      }, [account, character]);

      if (phase === "unavailable") return (
        <div className="flex-1 flex flex-col items-center justify-center py-16 gap-2 px-8 text-center">
          <Icon name="smart_toy" className="text-4xl text-outline/40" />
          <p className="text-sm text-on-surface-variant max-w-md">{error}</p>
          <p className="text-[11px] text-outline">Install Ollama and run <span className="text-on-surface-variant">ollama pull phi4</span>, then reopen the coach.</p>
        </div>
      );
      if (phase === "loading") return (
        <div className="flex-1 flex flex-col items-center justify-center py-16 gap-3 px-8 text-center">
          <div className="w-8 h-8 border-2 border-secondary border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
          <span className="text-sm text-on-surface-variant font-sans">Your local AI coach is reading your build…</span>
          <span className="text-[11px] text-outline">Runs on your own machine — it streams in as it thinks.</span>
        </div>
      );
      if (phase === "error" && !text) return <p className="text-sm text-error font-sans p-6">{error}</p>;
      return (
        <div className="flex-1 overflow-y-auto px-8 py-6">
          <div className="max-w-2xl mx-auto">
            <p className="text-base font-sans text-on-surface leading-relaxed whitespace-pre-wrap">
              {text}{phase === "streaming" && <span className="text-secondary animate-pulse">▋</span>}
            </p>
            {phase === "done" && (
              <p className="text-[10px] text-outline mt-6 pt-3 border-t border-outline-variant/15">
                Generated locally by {model} from LAMA's analysis of your build — grounded in your real numbers. Double-check big purchases yourself.
              </p>
            )}
          </div>
        </div>
      );
    }

              <span className={`text-xs font-label ${dpsOk ? "text-primary-container" : "text-error"}`}>{sc?.dpsLabel || "..."}</span>
              {sc?.dpsCeiling > 0 && <span className="text-[9px] text-outline">/ {sc.dpsCeiling >= 1e6 ? `${(sc.dpsCeiling/1e6).toFixed(1)}M` : `${(sc.dpsCeiling/1e3).toFixed(0)}K`}</span>}
            </div>
            <div className={`flex items-center gap-1.5 px-3 py-1 ${ehpOk ? "bg-primary-container/10" : "bg-error/10"}`}>
              <Icon name="shield" className={`text-xs ${ehpOk ? "text-primary-container" : "text-error"}`} />
              <span className={`text-xs font-label ${ehpOk ? "text-primary-container" : "text-error"}`}>{sc ? sc.ehp?.toLocaleString() : "..."} EHP</span>
            </div>
            <div className={`flex items-center gap-1.5 px-3 py-1 ${resistOk ? "bg-primary-container/10" : "bg-error/10"}`}>
              <Icon name={resistOk ? "check_circle" : "warning"} className={`text-xs ${resistOk ? "text-primary-container" : "text-error"}`} />
              <span className={`text-xs font-label ${resistOk ? "text-primary-container" : "text-error"}`}>{resistOk ? "Resists Capped" : sc?.resistSummary || "Resists?"}</span>
            </div>
          </div>

          {/* ── MAIN: Two columns ── */}
          <div className="flex-1 grid grid-cols-2 gap-0 overflow-hidden">

            {/* LEFT: What's working / What's not (synergy categories) */}
            <div className="border-r border-outline-variant/20 overflow-y-auto p-5">
              <DpsMeterCard sc={sc} />
              {synergy.map(cat => {
                const hasIssues = cat.missing?.length > 0;
                const catIcon = { dps: "bolt", survival: "shield", clear_speed: "speed", quality: "auto_awesome" }[cat.category] || "category";
                const statusColor = cat.status === "positive" ? "text-primary-container" : cat.status === "critical" ? "text-error" : "text-secondary";

                return (
                  <div key={cat.category} className="mb-5">
                    {/* Category header */}
                    <div className="flex items-center gap-2 mb-2">
                      <Icon name={catIcon} className={`text-base ${statusColor}`} />
                      <span className="font-headline text-sm font-bold text-on-surface">{cat.label}</span>
                      <span className={`font-headline text-sm ${statusColor}`}>{cat.value}</span>
                      <div className="flex-1 h-px bg-outline-variant/20" />
                      {hasIssues && <span className="text-[10px] font-label text-error uppercase">{cat.missing.length} to fix</span>}
                    </div>

                    {/* Working — compact green items */}
                    {cat.contributors?.length > 0 && (
                      <div className="flex flex-wrap gap-1 mb-2">
                        {cat.contributors.slice(0, 6).map((c, i) => (
                          <span key={i} className="text-[11px] font-body text-primary-container/80 bg-primary-container/5 px-2 py-0.5 border border-primary-container/10">
                            {c.name}
                          </span>
                        ))}
                        {cat.contributors.length > 6 && <span className="text-[10px] text-outline">+{cat.contributors.length - 6} more</span>}
                      </div>
                    )}

                    {/* Not working — each is an actionable upgrade */}
                    {cat.missing?.map((m, i) => (
                      <div key={i} className="bg-surface-container-low border-l-2 border-error/60 p-3 mb-1.5">
                        <div className="flex items-start justify-between gap-2">
                          <div className="flex-1">
                            <span className="font-headline text-sm text-on-surface">{m.name}</span>
                            {m.slot && <span className="text-[10px] text-outline ml-2">{m.slot}</span>}
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            {m.estimatedPct > 0 && (
                              <span className="text-[10px] font-label text-secondary">+{Math.round(m.estimatedPct)}%</span>
                            )}
                            {m.costTier && (
                              <span title={m.costLabel}
                                    className={`text-[9px] font-label uppercase px-1.5 py-0.5 ${m.costTier === "free" ? "text-primary-container bg-primary-container/10" : m.costTier === "cheap" ? "text-tertiary bg-tertiary/10" : "text-error bg-error/10"}`}>
                                {m.costTier === "free" ? "Free" : m.costTier === "cheap" ? "Cheap" : "Chase"}
                              </span>
                            )}
                          </div>
                        </div>
                        <p className="text-xs font-body text-on-surface-variant mt-1">{m.contribution}</p>
                        <div className="flex items-center gap-2 mt-1 flex-wrap">
                          {m.costTier && m.costTier !== "free" && m.costLabel && (
                            <span className="text-[10px] text-on-surface-variant">{m.costLabel}</span>
                          )}
                          {m.adoptionPct > 0 && (
                            <span className="text-[10px] text-outline">{Math.round(m.adoptionPct)}% of top players have this</span>
                          )}
                        </div>
                      </div>
                    ))}

                    {!hasIssues && cat.contributors?.length > 0 && (
                      <p className="text-xs text-primary-container/60 italic">Looking good</p>
                    )}
                  </div>
                );
              })}

            </div>

            {/* RIGHT: Gear + Passive Tree */}
            <div className="overflow-y-auto p-5">
              <div className="flex items-center gap-2 mb-4">
                <Icon name="inventory_2" className="text-lg text-on-surface-variant" />
                <span className="font-headline text-base font-bold text-on-surface">Equipment</span>
              </div>
              {slots.map(sl => {
                const hasDeadMods = (sl.deadMods?.length || 0) > 0;
                const hasGaps = (sl.gapAnalysis?.length || 0) > 0;
                const needsUpgrade = hasDeadMods || hasGaps || sl.avgTier > 4;
                const equipment = (charData?.equipment || []).find(e => e.slot === sl.slot);
                const isUnique = equipment?.rarity === "Unique";
                const isOpen = expandedSlot === sl.slot;
                const popular = slotPopular[sl.slot] || [];

                return (
                  <div key={sl.slot} className={`mb-1 ${needsUpgrade ? "border-l-2 border-error/40" : "border-l-2 border-primary-container/20"}`}>
                    <div
                      className="flex items-center gap-2 py-2 px-3 cursor-pointer hover:bg-surface-container-low transition-all"
                      onClick={() => setExpandedSlot(isOpen ? null : sl.slot)}
                    >
                      <Icon name={slotIcon(sl.slot)} className={`text-sm ${isUnique ? "text-secondary" : "text-on-surface-variant"}`} />
                      <div className="flex-1 min-w-0">
                        <span className={`text-sm ${isUnique ? "text-secondary" : "text-on-surface"} block truncate`}>{sl.itemName}</span>
                        {needsUpgrade && sl.deadMods?.[0] && (
                          <span className="text-[10px] text-error block">{sl.deadMods[0].reason}</span>
                        )}
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        {hasDeadMods && <Icon name="error" className="text-xs text-error" />}
                        <span className={`text-[10px] font-label ${sl.avgTier <= 2 ? "text-tertiary" : sl.avgTier <= 3.5 ? "text-on-surface-variant" : "text-error"}`}>T{sl.avgTier}</span>
                      </div>
                    </div>

                    {/* Expanded: upgrade recommendations */}
                    {isOpen && (
                      <div className="px-3 pb-3 space-y-2">
                        {/* Gap analysis — what mods to add */}
                        {sl.gapAnalysis?.length > 0 && (
                          <div className="bg-surface-container-lowest p-3">
                            <span className="text-[10px] font-label text-secondary uppercase tracking-widest block mb-1">Missing mods for your build</span>
                            {sl.gapAnalysis.slice(0, 3).map((gap, i) => (
                              <div key={i} className="text-xs text-on-surface-variant py-0.5">{gap.displayName} <span className="text-outline">({gap.bestTierRange})</span></div>
                            ))}
                          </div>
                        )}

                        {/* Dead mods */}
                        {sl.deadMods?.length > 0 && (
                          <div className="bg-error/5 p-3">
                            <span className="text-[10px] font-label text-error uppercase tracking-widest block mb-1">Wasted mods</span>
                            {sl.deadMods.map((dm, i) => (
                              <div key={i} className="text-xs text-on-surface-variant py-0.5">{dm.mod} — <span className="text-error">{dm.reason}</span></div>
                            ))}
                          </div>
                        )}

                        {/* Popular items — what to buy */}
                        {popular.length > 0 ? (
                          <div className="bg-surface-container-lowest p-3">
                            <span className="text-[10px] font-label text-tertiary uppercase tracking-widest block mb-2">What top players use</span>
                            {popular.slice(0, 5).map((pi, i) => (
                              <div key={i} className="flex items-center justify-between py-1 border-b border-outline-variant/10 last:border-0">
                                <div className="flex items-center gap-2 flex-1 min-w-0">
                                  <span className={`text-sm font-body truncate ${pi.rarity === "unique" ? "text-secondary" : "text-on-surface"}`}>{pi.name}</span>
                                </div>
                                <div className="flex items-center gap-2 shrink-0">
                                  <span className="text-[10px] text-on-surface-variant">{Math.round(pi.percentage || pi.count)}% use</span>
                                  {pi.priceText ? (
                                    <span className="text-xs font-label text-primary-container font-bold bg-primary-container/10 px-2 py-0.5">{pi.priceText}</span>
                                  ) : (
                                    <span className="text-[10px] text-outline">check trade</span>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="text-xs text-outline py-2">Loading alternatives...</div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}

              {/* Passive Tree (lives here under Equipment so it fills the column and is visible) */}
              {treeAnalysis?.treeNodes?.player?.length > 0 && (
                <div className="mt-7 pt-5 border-t border-outline-variant/15">
                  <div className="flex items-center gap-2 mb-3">
                    <Icon name="account_tree" className="text-lg text-secondary" />
                    <span className="font-headline text-base font-bold text-on-surface">Passive Tree</span>
                    <div className="flex-1 h-px bg-outline-variant/20" />
                    {treeAnalysis.swapRecommendations?.length > 0 && (
                      <span className="text-[10px] font-label text-secondary uppercase">{treeAnalysis.swapRecommendations.length} swaps</span>
                    )}
                  </div>
                  <PassiveTreeCanvas treeNodes={treeAnalysis.treeNodes} swaps={treeAnalysis.swapRecommendations} />
                  <div className="mt-3 space-y-1.5">
                    {(treeAnalysis.swapRecommendations || []).slice(0, 4).map((s, i) => (
                      <div key={i} className="bg-surface-container-low border-l-2 border-secondary/60 p-3">
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-error line-through text-sm">{s.refund}</span>
                          <Icon name="arrow_forward" className="text-xs text-outline" />
                          <span className="text-tertiary text-sm font-bold">{s.take}</span>
                          <span className="text-[10px] text-outline ml-auto">{s.netPoints > 0 ? `saves ${s.netPoints} pts` : s.netPoints < 0 ? `costs ${-s.netPoints} pts` : "same cost"}</span>
                        </div>
                        <p className="text-xs font-body text-on-surface-variant">{s.summary}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ── COMPARE vs another build (overlay) ── */}
          {compareOpen && (
            <div className="absolute inset-0 z-40 bg-surface flex flex-col overflow-hidden">
              <div className="flex items-center gap-3 px-6 py-3 border-b border-outline-variant/20 shrink-0">
                <Icon name="compare_arrows" className="text-base text-tertiary" />
                <span className="font-headline text-lg text-on-surface">Compare Build</span>
                <span className="text-xs text-on-surface-variant">{charData.name} vs another player</span>
                <div className="flex-1" />
                <button onClick={() => setCompareOpen(false)} className="text-on-surface-variant hover:text-on-surface" title="Close">
                  <Icon name="close" className="text-lg" />
                </button>
              </div>
              <div className="px-6 py-4 border-b border-outline-variant/20 shrink-0">
                <div className="flex gap-3">
                  <input
                    value={compareQuery}
                    onChange={e => { setCompareQuery(e.target.value); setCompareError(""); }}
                    placeholder="poe.ninja URL, or account#character (e.g. Player123#CharName)"
                    className="flex-1 px-4 py-3 bg-surface-container-lowest border border-outline-variant text-sm font-sans text-on-surface placeholder-outline focus:border-tertiary focus:outline-none"
                    onKeyDown={e => { if (e.key === "Enter") runCompare(); }}
                  />
                  <button
                    onClick={runCompare}
                    disabled={compareLoading || !compareQuery.trim()}
                    className="px-6 py-3 bg-tertiary text-surface text-sm font-sans font-bold uppercase tracking-wider hover:opacity-90 transition-opacity disabled:opacity-50"
                  >
                    {compareLoading ? (
                      <div className="w-4 h-4 border-2 border-surface border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
                    ) : "Compare"}
                  </button>
                </div>
                {compareError && <p className="text-sm text-error font-sans mt-3">{compareError}</p>}
              </div>
              <div className="flex-1 overflow-y-auto">
                {!compareResult && !compareLoading && (
                  <div className="flex flex-col items-center justify-center py-16 gap-4 px-6">
                    <Icon name="compare_arrows" className="text-5xl text-outline/30" />
                    <p className="text-on-surface-variant font-sans text-sm text-center max-w-md">
                      Paste a poe.ninja profile URL or enter account/character to see a detailed diff of gear, keystones, jewels, supports, DPS and survivability — plus a prioritized upgrade shopping list.
                    </p>
                  </div>
                )}
                {compareLoading && (
                  <div className="flex flex-col items-center justify-center py-16 gap-3">
                    <div className="w-8 h-8 border-2 border-tertiary border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
                    <span className="text-sm text-on-surface-variant font-sans">Comparing builds...</span>
                  </div>
                )}
                {compareResult && <BuildDiffView result={compareResult} />}
              </div>
            </div>
          )}

          {/* ── BUDGET planner (overlay) ── */}
          {budgetOpen && (
            <div className="absolute inset-0 z-40 bg-surface flex flex-col overflow-hidden">
              <div className="flex items-center gap-3 px-6 py-3 border-b border-outline-variant/20 shrink-0">
                <Icon name="savings" className="text-base text-primary-container" />
                <span className="font-headline text-lg text-on-surface">Upgrade Budget</span>
                <span className="text-xs text-on-surface-variant">priced upgrades for {charData.name}</span>
                <div className="flex-1" />
                <button onClick={() => setBudgetOpen(false)} className="text-on-surface-variant hover:text-on-surface" title="Close">
                  <Icon name="close" className="text-lg" />
                </button>
              </div>
              <BudgetPlanner account={account} character={character} />
            </div>
          )}

          {/* ── HOW TO FUND IT (overlay) ── */}
          {fundingOpen && (
            <div className="absolute inset-0 z-40 bg-surface flex flex-col overflow-hidden">
              <div className="flex items-center gap-3 px-6 py-3 border-b border-outline-variant/20 shrink-0">
                <Icon name="payments" className="text-base text-tertiary" />
                <span className="font-headline text-lg text-on-surface">How to Fund It</span>
                <span className="text-xs text-on-surface-variant">currency farming for {charData.name}</span>
                <div className="flex-1" />
                <button onClick={() => setFundingOpen(false)} className="text-on-surface-variant hover:text-on-surface" title="Close">
                  <Icon name="close" className="text-lg" />
                </button>
              </div>
              <FundingPanel account={account} character={character} />
            </div>
          )}

          {/* ── AI COACH (right-side flyout) ── */}
          {coachOpen && (
            <div className="fixed inset-0 z-[60]" onClick={() => setCoachOpen(false)}>
              <div className="absolute inset-0 bg-black/30" />
              <div
                className="absolute top-0 right-0 bottom-0 w-[440px] max-w-[92vw] bg-surface-container-low border-l border-outline-variant flex flex-col overflow-hidden"
                style={{ animation: "slideIn 0.2s ease" }}
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 px-6 py-3 border-b border-outline-variant/20 shrink-0">
                  <Icon name="auto_awesome" className="text-base text-secondary" />
                  <span className="font-headline text-lg text-on-surface">Coach</span>
                  <span className="text-xs text-on-surface-variant">what to focus on, {charData.name}</span>
                  <div className="flex-1" />
                  <button onClick={() => setCoachOpen(false)} className="text-on-surface-variant hover:text-on-surface" title="Close">
                    <Icon name="close" className="text-lg" />
                  </button>
                </div>
                <CoachPanel account={account} character={character} />
              </div>
            </div>
          )}
        </div>
      );
    }


    // -----------------------------------------------------------------------
    // Dashboard (root)
    // -----------------------------------------------------------------------
    function Dashboard() {
      const [charData, setCharData] = useState(null);
      const [account, setAccount] = useState("");
      const [character, setCharacter] = useState("");
      const [insights, setInsights] = useState(null);
      const [efficiency, setEfficiency] = useState(null);
      const [improvement, setImprovement] = useState(null);
      const [comparison, setComparison] = useState(null);
      const [whyInsights, setWhyInsights] = useState(null);
      const [activeTab, setActiveTab] = useState("BUILD");
      const [settings, setSettings] = useState({});
      const [status, setStatus] = useState({});
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [analysisLoading, setAnalysisLoading] = useState(false);

      // Fetch analysis data when charData changes
      useEffect(() => {
        if (!charData || !account || !character) return;
        setAnalysisLoading(true);
        setInsights(null);
        setEfficiency(null);
        setImprovement(null);
        setComparison(null);
        setWhyInsights(null);

        const body = { account, character };

        Promise.all([
          api("/api/character/build-insights", "POST", body),
          api("/api/character/improvement-package", "POST", body),
          api("/api/character/build-compare", "POST", body),
          api("/api/character/build-efficiency", "POST", body),
        ]).then(([ins, imp, comp, eff]) => {
          if (!ins.error) setInsights(ins);
          if (!imp.error) setImprovement(imp);
          if (!comp.error) setComparison(comp);
          if (!eff.error) setEfficiency(eff);
          setAnalysisLoading(false);
        }).catch(() => setAnalysisLoading(false));

        api("/api/character/why-insights", "POST", body).then(why => {
          if (why && !why.error) {
            console.log("[LAMA] Why-insights received:", Object.keys(why).map(k => `${k}:${Array.isArray(why[k]) ? why[k].length : Object.keys(why[k] || {}).length}`).join(", "));
            setWhyInsights(why);
          } else {
            console.warn("[LAMA] Why-insights failed:", why?.error || "empty response");
          }
        }).catch(e => console.warn("[LAMA] Why-insights error:", e));
      }, [charData, account, character]);

      // Character lookup handler
      const handleLookup = useCallback(async (acct, charName, prefetchedData) => {
        const data = prefetchedData || await api("/api/character/lookup", "POST", { account: acct, character: charName });
        if (data.error) return data;
        setAccount(acct || data.account || "");
        setCharacter(charName || data.name || "");
        setCharData({ ...data, _account: acct || data.account || "" });
        setSettingsOpen(false);
        return data;
      }, []);

      // WebSocket handler
      const handleWsMessage = useCallback((msg) => {
        switch (msg.type) {
          case "init":
            setStatus({ state: msg.state, uptime: msg.uptime, stats: msg.stats, version: msg.version });
            if (msg.settings) setSettings(msg.settings);
            break;
          case "settings":
            if (msg.settings) setSettings(msg.settings);
            break;
          case "state_change":
            setStatus(prev => ({ ...prev, state: msg.state }));
            break;
          case "log":
            break;
        }
      }, []);

      const { connected } = useDashboardSocket(WS_URL, handleWsMessage);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          <NavBar onSettingsClick={() => setSettingsOpen(true)} />

          {/* Single-page layout — no tabs, no sidebar, no scroll */}
          <div className="flex-1 overflow-hidden" style={{ paddingTop: "64px" }}>
            {!charData ? (
              <div className="h-full flex items-center justify-center">
                <InlineCharacterLookup onLookup={handleLookup} />
              </div>
            ) : !whyInsights && !insights ? (
              <div className="h-full flex flex-col items-center justify-center gap-3">
                <div className="w-8 h-8 border-2 border-primary-container border-t-transparent rounded-full" style={{ animation: "spin 0.8s linear infinite" }} />
                <span className="text-sm text-on-surface-variant font-sans">Analyzing build...</span>
              </div>
            ) : (
              <SinglePageView
                charData={charData}
                insights={insights}
                whyInsights={whyInsights}
                account={account}
                character={character}
              />
            )}
          </div>

          {/* Connection indicator */}
          <div className="fixed bottom-3 right-4 flex items-center gap-1.5 z-40">
            <span className={`w-1.5 h-1.5 rounded-full ${connected ? "bg-green-400" : "bg-red-400"}`} />
            <span className="text-xs font-sans text-outline">{connected ? "" : "Disconnected"}</span>
          </div>

          {/* Settings Panel */}
          <SettingsPanel
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            settings={settings}
            setSettings={setSettings}
            status={status}
            onLookup={handleLookup}
            charData={charData}
          />
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Error Boundary — catches render crashes, shows message instead of blank screen
    // -----------------------------------------------------------------------
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error("[LAMA] React crash:", error, info); }
      render() {
        if (this.state.error) {
          return React.createElement("div", {
            style: { padding: "40px", textAlign: "center", color: "#FFB77B", fontFamily: "Space Grotesk, sans-serif" }
          },
            React.createElement("h2", null, "Something went wrong"),
            React.createElement("p", { style: { color: "#999", marginTop: "8px", fontSize: "14px" } }, String(this.state.error)),
            React.createElement("button", {
              onClick: () => this.setState({ error: null }),
              style: { marginTop: "16px", padding: "8px 24px", background: "#FFB77B", color: "#0e0e0e", border: "none", cursor: "pointer" }
            }, "Retry")
          );
        }
        return this.props.children;
      }
    }

    // -----------------------------------------------------------------------
    // Mount
    // -----------------------------------------------------------------------
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ErrorBoundary><Dashboard /></ErrorBoundary>);
  </script>
</body>
</html>
